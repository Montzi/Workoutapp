/* ---------- what you actually did ---------- */

function performedList(rec) {
  const entries = rec.entries || [];
  const rows = [];
  entries.forEach(e => {
    let r = rows.find(x => x.name === e.exerciseName);
    if (!r) { r = { name: e.exerciseName, group: e.group, sets: 0, weight: '' }; rows.push(r); }
    r.sets++;
    if (e.weight) r.weight = e.weight;
  });
  const body = rows.length ? rows.map((r, i) => `<div class="logrow">
      <span class="logrow-n">${i + 1}</span>
      <span class="logrow-name">${esc(r.name)}<span class="logrow-sub"> ${esc(GROUPS[r.group] ? GROUPS[r.group].name : '')}</span></span>
      <span class="logrow-meta">${r.sets} ${r.sets === 1 ? 'set' : 'sets'}${r.weight ? ' &middot; ' + r.weight + ' lb' : ''}</span>
    </div>`).join('') : `<p class="hint">${esc((rec.exercises || []).join(', '))}</p>`;

  return `<div class="section-head"><h2>What you did</h2><span>${clock(rec.durationSec)}</span></div>
    <div class="panel">${body}</div>
    <div class="hero-actions">
      <button class="btn btn-quiet" data-manual="${esc(key(viewedDate()))}">Edit this workout</button>
      <button class="btn btn-quiet" data-daylog="${esc(key(viewedDate()))}">Full log</button>
    </div>`;
}

/* ---------- week band ---------- */

function weekBand(viewed) {
  const t = today(), log = store.get('log', {});
  const days = weekOf(viewed);
  const cells = days.map(d => {
    const rec = log[key(d)];
    const future = d > t && key(d) !== key(t);
    const cls = ['band-day'];
    if (rec) cls.push('is-done');
    if (key(d) === key(t)) cls.push('is-today');
    if (future) cls.push('is-future');
    return `<button class="${cls.join(' ')}" ${future ? 'disabled' : `data-daylog="${key(d)}"`}
      ${future ? 'title="Not here yet. Plan it in the week below."' : ''}>
      <span class="bd-w">${esc(d.toLocaleDateString(undefined, { weekday: 'narrow' }))}</span>
      <span class="bd-n">${d.getDate()}</span>
      <span class="bd-tick">${rec ? '&check;' : '&nbsp;'}</span>
    </button>`;
  }).join('');
  const done = days.filter(d => log[key(d)]).length;
  return `<section class="band">
    <p class="band-head"><span class="band-week">Week ${isoWeek(viewed)}</span>
      <span>${done} of 7 days logged</span></p>
    <div class="band-grid">${cells}</div>
    <p class="band-note">Tap a day up to today to see or add its log. Plan ahead in the week below.</p>
  </section>`;
}

/* ---------- one day's log ---------- */

function dayLogView() {
  const rec = store.get('log', {})[state.logDate];
  if (!rec) return `${welcomeBar()}<div class="detail">
    <button class="back" data-back="1">&larr; Back</button>
    <h1>Nothing logged</h1>
    <p class="detail-meta">${esc(state.logDate)}</p>
    <p class="desc">No workout was recorded on this day. If you trained and forgot to open the app, add it now.</p>
    <div class="hero-actions">
      <button class="btn" data-manual="${esc(state.logDate)}">Add a past workout</button>
      <button class="btn btn-quiet" data-goto="${esc(state.logDate)}">Open that day</button>
    </div></div>`;

  const entries = rec.entries || [];
  const byEx = [];
  entries.forEach(e => {
    let row = byEx.find(r => r.name === e.exerciseName);
    if (!row) { row = { name: e.exerciseName, group: e.group, sets: [] }; byEx.push(row); }
    row.sets.push(e);
  });

  const rows = byEx.length ? byEx.map((r, i) => {
    const marked = r.sets.some(s => s.marked);
    const w = r.sets.map(s => s.weight).filter(Boolean);
    return `<div class="logrow">
      <span class="logrow-n">${i + 1}</span>
      <span class="logrow-name">${esc(r.name)}
        ${marked ? '<span class="logrow-mark"> marked done</span>' : ''}</span>
      <span class="logrow-meta">${r.sets.length} sets${w.length ? ' &middot; ' + w[w.length - 1] + ' lb' : ''}</span>
    </div>`;
  }).join('') : `<p class="desc">${esc((rec.exercises || []).join(', '))}</p>`;

  return `
    ${welcomeBar()}
    <div class="detail">
      <button class="back" data-back="1">&larr; Back</button>
      <h1>${esc(rec.title)}</h1>
      <p class="detail-meta">${esc(state.logDate)} &middot; ${clock(rec.durationSec)} &middot; ${rec.sets} sets</p>
      <div style="margin-top:18px">${rows}</div>
      <div class="hero-actions" style="margin-top:22px">
        <button class="btn" data-manual="${esc(state.logDate)}">Edit this workout</button>
        <button class="btn btn-quiet" data-mclear="${esc(state.logDate)}">Delete</button>
      </div>
    </div>`;
}

/* ---------- logging a day you missed ---------- */

function startManual(dateKey) {
  const d = dateOf(dateKey);
  const existing = store.get('log', {})[dateKey];
  let items, groups, minutes;

  if (existing && existing.entries && existing.entries.length) {
    items = [];
    existing.entries.forEach(e => {
      let r = items.find(x => x.id === e.exerciseId);
      if (!r) { r = { id: e.exerciseId, sets: 0, weight: Number(e.weight) || 0 }; items.push(r); }
      r.sets++;
      if (e.weight) r.weight = Number(e.weight);
    });
    items = items.filter(x => byId(x.id));
    groups = [...new Set(items.map(x => byId(x.id).group))];
    minutes = Math.max(1, Math.round(existing.durationSec / 60));
  } else {
    const plan = sessionFor(d);
    const ids = plan ? orderFor(d) : [];
    items = ids.map(id => ({ id, sets: byId(id).sets, weight: byId(id).cardio ? 0 : session.weight(id) }));
    groups = plan ? plan.groups.slice() : [];
    minutes = Math.max(20, Math.round(estimateSeconds(ids.map(byId)) / 60 / 5) * 5);
  }

  state.manual = { dateKey, groups, items, minutes, touched: !!existing, picking: null, editing: !!existing };
  state.screen = 'manual';
}

function manualEstimate() {
  const m = state.manual;
  return Math.max(5, Math.round(estimateSeconds(m.items.map(i => byId(i.id))) / 60 / 5) * 5);
}

function manualToggleGroup(g) {
  const m = state.manual;
  const take = g === 'cardio' ? 1 : (PER_GROUP[state.split] || 3);
  if (m.groups.includes(g)) {
    m.groups = m.groups.filter(x => x !== g);
    m.items = m.items.filter(i => byId(i.id).group !== g);
  } else {
    m.groups.push(g);
    byGroup(g).slice(0, take).forEach(e => {
      if (!m.items.some(i => i.id === e.id)) {
        m.items.push({ id: e.id, sets: e.sets, weight: e.cardio ? 0 : session.weight(e.id) });
      }
    });
  }
  if (!m.touched) m.minutes = manualEstimate();
}

function manualAdd(id) {
  const m = state.manual;
  const e = byId(id);
  if (!m.items.some(i => i.id === id)) {
    m.items.push({ id, sets: e.sets, weight: e.cardio ? 0 : session.weight(id) });
    if (!m.groups.includes(e.group)) m.groups.push(e.group);
    if (!m.touched) m.minutes = manualEstimate();
  }
  m.picking = null;
}

function manualDrop(id) {
  const m = state.manual;
  m.items = m.items.filter(i => i.id !== id);
  m.groups = m.groups.filter(g => m.items.some(i => byId(i.id).group === g));
  if (!m.touched) m.minutes = manualEstimate();
}

function manualBump(id, field, by) {
  const m = state.manual;
  const it = m.items.find(i => i.id === id);
  if (!it) return;
  if (field === 'sets') it.sets = Math.min(10, Math.max(1, it.sets + by));
  else it.weight = Math.min(MAX_DUMBBELL, Math.max(0, it.weight + by * WEIGHT_STEP));
  if (field === 'sets' && !m.touched) m.minutes = manualEstimate();
}

function saveManual() {
  const m = state.manual;
  if (!m.items.length) { alert('Add at least one exercise.'); return false; }
  const minutes = Math.max(1, Number(m.minutes) || 1);
  const doneGroups = [...new Set(m.items.map(i => byId(i.id).group))];
  const title = titleFor(doneGroups);
  const entries = [];
  m.items.forEach(it => {
    const e = byId(it.id);
    for (let i = 1; i <= it.sets; i++) {
      entries.push({
        exerciseId: e.id, exerciseName: e.name, group: e.group,
        set: i, reps: e.reps, weight: e.cardio ? '' : (it.weight || ''),
        elapsedSec: 0, marked: m.editing ? 'edited' : 'added later'
      });
    }
    if (!e.cardio && it.weight) session.setWeight(e.id, it.weight);
  });

  const log = store.get('log', {});
  log[m.dateKey] = {
    title, groups: doneGroups,
    durationSec: minutes * 60, sets: entries.length,
    exercises: [...new Set(entries.map(e => e.exerciseName))],
    entries, finishedAt: new Date(m.dateKey + 'T12:00:00').toISOString()
  };
  store.set('log', log);

  entries.forEach(e => sync.push(Object.assign({ type: 'set', dateKey: m.dateKey, sessionTitle: title }, e)));
  sync.push({
    type: 'session', dateKey: m.dateKey, title, groups: doneGroups.join('|'),
    durationSec: minutes * 60, sets: entries.length,
    exercises: [...new Set(entries.map(e => e.exerciseName))].join('|')
  });
  return true;
}

function manualView() {
  const m = state.manual;
  const chips = EDITABLE_GROUPS.map(g =>
    `<button class="chip" aria-pressed="${m.groups.includes(g)}" data-mgroup="${g}">${esc(GROUPS[g].name)}</button>`
  ).join('');

  const rows = m.items.length ? m.items.map(it => {
    const e = byId(it.id);
    return `<div class="mitem">
      <div class="mitem-top">
        <span class="mitem-name">${esc(e.name)}<span class="logrow-sub"> ${esc(GROUPS[e.group].name)}</span></span>
        <button class="logrow-x" data-mdrop="${e.id}" aria-label="Remove ${esc(e.name)}">&times;</button>
      </div>
      <div class="mitem-rows">
        <div class="stepper">
          <button data-mbump="sets" data-i="${e.id}" data-by="-1" aria-label="Fewer sets">&minus;</button>
          <span><strong>${it.sets}</strong> ${it.sets === 1 ? 'set' : 'sets'}</span>
          <button data-mbump="sets" data-i="${e.id}" data-by="1" aria-label="More sets">+</button>
        </div>
        ${e.cardio ? `<div class="stepper is-flat"><span>${esc(e.reps)}</span></div>` : `<div class="stepper">
          <button data-mbump="weight" data-i="${e.id}" data-by="-1" aria-label="Less weight">&minus;</button>
          <span><strong>${it.weight || 0}</strong> lb</span>
          <button data-mbump="weight" data-i="${e.id}" data-by="1" aria-label="More weight">+</button>
        </div>`}
      </div>
    </div>`;
  }).join('') : '<p class="hint">Add a muscle group, or a single exercise, to fill this in.</p>';

  const pickable = m.picking
    ? byGroup(m.picking).filter(e => !m.items.some(i => i.id === e.id))
    : [];

  const picker = m.picking
    ? `<div class="gsec-swap">
        <p class="hint">${pickable.length ? 'Add from ' + esc(GROUPS[m.picking].name) : 'Every ' + esc(GROUPS[m.picking].name) + ' exercise is already in.'}</p>
        <div class="chips">${pickable.map(e => `<button class="chip" data-madd="${e.id}">${esc(e.name)}</button>`).join('')}</div>
        <button class="linky" data-mpick="">Cancel</button>
      </div>`
    : `<div class="chips" style="margin-top:10px">${EDITABLE_GROUPS.map(g =>
        `<button class="chip" data-mpick="${g}">+ ${esc(GROUPS[g].name)}</button>`).join('')}</div>`;

  const total = m.items.reduce((n, i) => n + i.sets, 0);

  return `
    ${welcomeBar()}
    <div class="detail">
      <button class="back" data-back="1">&larr; Back</button>
      <h1>${m.editing ? 'Edit this workout' : 'Add a past workout'}</h1>
      <p class="detail-meta">${esc(m.dateKey)} &middot; ${m.items.length} exercises &middot; ${total} sets</p>

      <div class="panel"><h2>Muscle groups</h2><div class="chips">${chips}</div></div>

      <div class="panel"><h2>How long did it take</h2>
        <div class="cardio-row">
          <button class="btn btn-quiet" data-mmin="-5">&minus;5</button>
          <span class="mins-read"><strong id="mmins">${m.minutes}</strong> min</span>
          <button class="btn btn-quiet" data-mmin="5">+5</button>
        </div>
      </div>

      <div class="panel"><h2>Exercises, sets and weight</h2>
        ${rows}
        ${picker}
      </div>

      <div class="hero-actions">
        <button class="btn" data-msave="1">Save to the log</button>
      </div>
      <p class="stage-note">These land in your sheet flagged as ${m.editing ? 'edited' : 'added later'}, so the record stays honest.</p>
    </div>`;
}

/* ---------- detail ---------- */

function detailView() {
  const e = byId(state.exercise);

/* ---------- history ---------- */

function historyView() {
  const local = store.get('log', {});
  const days = Object.keys(local).sort().reverse();
  const remote = state.history;

  const localRows = days.length ? days.map(k => {
    const r = local[k];
    return `<li class="hist">
      <span class="hist-date">${esc(k)}</span>
      <span class="hist-title">${esc(r.title)}</span>
      <span class="hist-meta">${clock(r.durationSec)} &middot; ${r.sets} sets</span>
    </li>`;
  }).join('') : '<li class="hist hist-empty">Nothing logged on this device yet.</li>';

  let remoteBlock;
  if (remote === null) remoteBlock = '<p class="stage-note">Loading from your sheet.</p>';
  else if (remote === 'error') remoteBlock = '<p class="stage-note">Could not reach the sheet. Check the Apps Script deployment is set to "Anyone".</p>';
  else if (!remote.length) remoteBlock = '<p class="stage-note">The sheet has no sessions yet.</p>';
  else remoteBlock = `<ul class="hists">${remote.slice().reverse().map(s => `<li class="hist">
      <span class="hist-date">${esc(String(s.date).slice(0, 10))}</span>
      <span class="hist-title">${esc(s.title || '')}</span>
      <span class="hist-meta">${esc(String(s.duration || ''))} &middot; ${esc(String(s.sets || 0))} sets</span>
    </li>`).join('')}</ul>`;

  return `
    ${welcomeBar()}
    <div class="detail">
      <button class="back" data-back="1">&larr; Back</button>
      <h1>History</h1>
      <p class="detail-meta">On this device</p>
      <ul class="hists">${localRows}</ul>
      <p class="detail-meta" style="margin-top:22px">From the sheet</p>
      ${remoteBlock}
    </div>`;
}

function loadHistory() {
  state.history = null;
  fetch(SYNC_URL + '?action=history')
    .then(r => r.json())
    .then(j => { state.history = (j && j.sessions) || []; if (state.screen === 'history') render(); })
    .catch(() => { state.history = 'error'; if (state.screen === 'history') render(); });
}

/* ---------- runner ---------- */

function runView() {
  const d = session.data;
  if (d.phase === 'done') return doneView();
  const ex = session.exercise;
  const setNo = Math.min(d.setsDone + 1, ex.sets);
  const pct = Math.round((session.doneSets / session.totalSets) * 100);

  return `
    ${welcomeBar()}
    ${musicBar()}
    <div class="run">
      <div class="run-top">
        <button class="back" data-exit="1">&larr; Leave</button>
        <span class="run-pos">Exercise ${d.idx + 1} of ${d.order.length}</span>
      </div>
      ${session.doneSets ? `<button class="callit" data-callit="1">Call it a day &middot; finish with ${session.doneSets} ${session.doneSets === 1 ? 'set' : 'sets'} logged</button>` : ''}
      <div class="bar"><span style="width:${pct}%"></span></div>
      <p class="bar-note">${session.doneSets} of ${session.totalSets} sets done in this session</p>
      ${d.phase === 'cheer' ? '' : (d.phase === 'proposed'
        ? posterBlock(ex, { body: true })
        : `<div class="detail-stage${d.phase === 'rest' ? ' is-rest' : ''}">${bodySVG(d.phase === 'rest' ? REST_FIGURE : ex)}</div>`)}
      ${d.phase === 'set' ? posterOnly(ex) : ''}
      ${d.phase === 'cheer' ? '' : `<h1 class="run-name">${esc(ex.name)}</h1>`}
      ${d.phase === 'proposed' ? proposedBlock(ex) : ''}
      ${d.phase === 'set' ? setBlock(ex, setNo) : ''}
      ${d.phase === 'rest' ? restBlock(ex, setNo) : ''}
      ${d.phase === 'cheer' ? cheerBlock(ex) : ''}
    </div>
    ${state.zoom ? lightbox() : ''}`;
}

/* One tap back, for a wrong weight or an early tap. */
function undoRow() {
  if (!session.doneSets) return '';
  const last = session.data.logged[session.data.logged.length - 1];
  return `<button class="linky undo" data-undo="1">
    &larr; Undo ${esc(last.exerciseName)} set ${last.set}${last.weight ? ' at ' + last.weight + ' lb' : ''}</button>`;
}

const CONFETTI_COLOURS = ['#1e9bff', '#7cc6ff', '#ffffff', '#0d6fd1', '#bfe3ff'];

function confetti() {
  let out = '';
  for (let i = 0; i < 40; i++) {
    const left = Math.round(Math.random() * 100);
    const delay = (Math.random() * 1.6).toFixed(2);
    const dur = (1.9 + Math.random() * 1.7).toFixed(2);
    const size = 5 + Math.round(Math.random() * 5);
    const c = CONFETTI_COLOURS[i % CONFETTI_COLOURS.length];
    const spin = Math.round(360 + Math.random() * 720);
    const round = Math.random() > 0.6 ? '50%' : '1px';
    out += `<i style="left:${left}%;width:${size}px;height:${size + 4}px;background:${c};
      border-radius:${round};animation-delay:${delay}s;animation-duration:${dur}s;
      --spin:${spin}deg"></i>`;
  }
  return `<div class="confetti" aria-hidden="true">${out}</div>`;
}

function cheerBlock(ex) {
  const d = session.data;
  const next = session.upNext;
  const holding = !d.cheerEndsAt;

  const upNext = next
    ? `<div class="upnext">
        <p class="upnext-l">Up next</p>
        <div class="upnext-row">
          <span class="upnext-fig">${figureSVG(next, {})}</span>
          <span>
            <span class="upnext-n">${esc(next.name)}</span>
            <span class="upnext-m">${next.cardio
              ? esc(next.reps)
              : `${next.sets} sets &middot; ${esc(next.reps)} reps &middot; ${esc(GROUPS[next.group].name)}`}</span>
          </span>
        </div>
      </div>`
    : `<div class="upnext">
        <p class="upnext-l">Last one</p>
        <div class="upnext-row"><span><span class="upnext-n">That was the whole session</span></span></div>
      </div>`;

  return `
    <div class="cheer">
      ${confetti()}
      <p class="cheer-h">${esc(d.cheerLine || 'Hurray!')}</p>
      <p class="cheer-sub">${esc(ex.name)} done &middot; ${ex.sets} of ${ex.sets} sets</p>
      ${upNext}
      <p class="cheer-cd">${holding
        ? 'Take your time. Go when you are ready.'
        : `Starting in <strong id="cheercount">${Math.max(0, Math.ceil(session.cheerLeft()))}</strong>`}</p>
      <div class="hero-actions">
        <button class="btn" data-cheernow="1">${next ? 'Start it now' : 'Finish the session'}</button>
        ${holding ? '' : '<button class="btn btn-quiet" data-cheerhold="1">Hold on</button>'}
      </div>
      ${undoRow()}
    </div>`;
}

function weightPicker(ex) {
  const w = session.weight(ex.id);
  return `<div class="weight">
    <button data-weight="-1" aria-label="Lower the weight">&minus;</button>
    <span><strong>${w}</strong> lb each</span>

function proposedBlock(ex) {

function setBlock(ex, setNo) {
  const pct = Math.round((session.data.setsDone / ex.sets) * 100);
  if (ex.cardio) return `
    <p class="set-count">Target <strong>${ex.minutes}</strong> min</p>

function restBlock(ex, setNo) {

function doneView() {
  const d = session.data;
  const names = [...new Set(d.logged.map(l => l.exerciseName))];
  return `
    ${welcomeBar()}
    <div class="detail">
      <h1 class="run-name">${esc(titleFor([...new Set(d.logged.map(l => l.group))]) || d.title)} done</h1>
      <p class="detail-meta">${clock((Date.now() - d.startedAt) / 1000)} &middot; ${d.logged.length} sets &middot; ${names.length} exercises</p>

/* ---------- events ---------- */

function on(sel, fn) { app.querySelectorAll(sel).forEach(el => el.addEventListener('click', () => fn(el))); }
const dateOf = k => new Date(k + 'T12:00:00');

const COUNTDOWN_SEC = 10;

function armCountdown(dk, startIdx) {
  if (!sessionFor(dateOf(dk))) return;
  state.pending = { dk, idx: startIdx || 0 };
  state.cdEnd = Date.now() + COUNTDOWN_SEC * 1000;
  state.screen = 'countdown';
  lastCd = null;
  holdScreen();
  if (music.state === 'idle' && store.get('music', {}).station) music.play();
  render();
}

function beginSession(dk, startIdx) {
  const d = dateOf(dk);
  const plan = sessionFor(d);
  if (!plan) return;
  if (session.data && session.data.phase !== 'done') session.abandon();
  session.start(dk, plan, orderFor(d), startIdx || 0);
  state.pending = null;
  state.cdEnd = null;
  state.screen = 'run';
  holdScreen();
  render();
}

function countdownView() {
  const left = Math.max(0, (state.cdEnd - Date.now()) / 1000);
  const n = Math.ceil(left);
  const d = dateOf(state.pending.dk);
  const plan = sessionFor(d);
  const first = byId(orderFor(d)[state.pending.idx] || orderFor(d)[0]);
  return `
    ${welcomeBar()}
    ${musicBar()}
    <div class="cd">
      <p class="cd-label">Starting in</p>
      <p class="cd-num" id="cdnum">${n}</p>
      <p class="cd-next">${esc(plan.title)} &middot; first up, ${esc(first.name)}</p>
      <div class="hero-actions">
        <button class="btn" data-cdskip="1">Start now</button>
        <button class="btn btn-quiet" data-cdcancel="1">Cancel</button>
      </div>
    </div>`;
}

function bind() {
  on('[data-split]', el => {
    const v = el.dataset.split;
    state.split = v === 'c' ? 'c' : Number(v);
    store.set('split', state.split);
    state.moving = false; state.editing = false; state.swapGroup = null;
    render();
  });
  on('[data-customday]', el => { toggleCustomDay(Number(el.dataset.customday)); render(); });
  on('[data-goto]', el => { state.selected = el.dataset.goto === key(today()) ? null : el.dataset.goto; state.screen = 'home'; state.moving = false; state.editing = false; render(); });
  on('[data-exercise]', el => { state.exercise = el.dataset.exercise; state.detailFrom = el.dataset.from || null; state.screen = 'detail'; render(); });
  on('[data-back]', () => { state.screen = 'home'; state.exercise = null; state.manual = null; render(); });
  on('[data-activate]', el => { activateDay(el.dataset.activate); render(); });
  on('[data-deactivate]', el => { deactivateDay(el.dataset.deactivate); render(); });
  on('[data-history]', () => { state.screen = 'history'; loadHistory(); render(); });

  on('[data-swapgroup]', el => { state.swapGroup = el.dataset.swapgroup || null; render(); });
  on('[data-swapto]', el => {
    if (!swapGroupFor(dateOf(el.dataset.d), el.dataset.from, el.dataset.swapto)) alert('That group is already in this session.');
    state.swapGroup = null; render();
  });
  on('[data-rmgroup]', el => {
    if (!toggleGroup(dateOf(el.dataset.d), el.dataset.rmgroup)) alert('A day needs at least one muscle group. Turn the day off instead.');
    state.swapGroup = null; render();
  });

  on('[data-manual]', el => { startManual(el.dataset.manual); render(); });
  on('[data-mgroup]', el => { manualToggleGroup(el.dataset.mgroup); render(); });
  on('[data-mdrop]', el => { manualDrop(el.dataset.mdrop); render(); });
  on('[data-mbump]', el => { manualBump(el.dataset.i, el.dataset.mbump, Number(el.dataset.by)); render(); });
  on('[data-mpick]', el => { state.manual.picking = el.dataset.mpick || null; render(); });
  on('[data-madd]', el => { manualAdd(el.dataset.madd); render(); });
  on('[data-mmin]', el => {
    state.manual.minutes = Math.max(5, state.manual.minutes + Number(el.dataset.mmin));
    state.manual.touched = true;   // stop the estimate overwriting a number you set yourself
    render();
  });
  on('[data-msave]', () => { if (saveManual()) { state.logDate = state.manual.dateKey; state.manual = null; state.screen = 'daylog'; render(); } });
  on('[data-mclear]', el => {
    const log = store.get('log', {}); delete log[el.dataset.mclear]; store.set('log', log);
    state.screen = 'daylog'; render();
  });

  on('[data-sync]', () => { sync.flush(); render(); });
  on('[data-tester]', el => setTesterMode(el.dataset.tester === '1'));
  on('[data-zoomposter]', el => {
    const img = el.closest('.poster').querySelector('img');
    state.zoom = img ? img.getAttribute('src') : null;
    render();
  });
  on('[data-closezoom]', () => { state.zoom = null; render(); });
  on('[data-daylog]', el => { state.logDate = el.dataset.daylog; state.screen = 'daylog'; render(); });
  on('[data-disable]', el => {
    disableDay(el.dataset.disable);
    state.editing = false; state.moving = false; state.swapGroup = null;
    render();
  });
  on('[data-edit]', el => { state.editing = el.dataset.edit === '1'; render(); });
  on('[data-group]', el => {
    if (!toggleGroup(dateOf(el.dataset.d), el.dataset.group)) alert('A day needs at least one muscle group. Turn the day off instead.');
    render();
  });
  on('[data-addcardio]', el => { addCardioToDay(dateOf(el.dataset.d), el.dataset.addcardio); render(); });
  on('[data-savecardio]', el => {
    const t = (document.getElementById('ctype').value || '').trim();
    const m = parseInt(document.getElementById('cmins').value, 10);
    if (!t || !m || m < 5) { alert('Give it a name and a length of at least 5 minutes.'); return; }
    addCardioToDay(dateOf(el.dataset.d), addCustomCardio(t, m));
    render();
  });

  on('[data-move]', el => { state.moving = el.dataset.move === '1'; render(); });
  on('[data-swapday]', el => { swapDays(isoDay(viewedDate()), Number(el.dataset.swapday)); state.moving = false; render(); });
  on('[data-resetweek]', () => { resetWeek(); state.moving = false; render(); });

  on('[data-up]', el => { moveAt(dateOf(el.dataset.d), Number(el.dataset.up), -1); render(); });
  on('[data-down]', el => { moveAt(dateOf(el.dataset.d), Number(el.dataset.down), 1); render(); });
  on('[data-replace]', el => {
    if (!replaceAt(dateOf(el.dataset.d), Number(el.dataset.replace))) alert('Every exercise for that muscle group is already in this session.');
    render();
  });
  on('[data-replacehere]', el => {
    const d = dateOf(el.dataset.d), i = Number(el.dataset.replacehere);
    if (replaceAt(d, i)) { state.exercise = orderFor(d)[i]; } else alert('Every exercise for that muscle group is already in this session.');
    render();
  });

  on('[data-start]', el => armCountdown(el.dataset.start, 0));
  on('[data-starthere]', el => armCountdown(el.dataset.starthere, Math.max(0, Number(el.dataset.i))));
  on('[data-cdskip]', () => beginSession(state.pending.dk, state.pending.idx));
  on('[data-cdcancel]', () => { state.pending = null; state.cdEnd = null; state.screen = 'home'; releaseScreen(); render(); });
  on('[data-resume]', () => { state.screen = 'run'; holdScreen(); render(); });
  on('[data-accept]', () => { session.accept(); render(); });
  on('[data-swap]', () => { if (!session.swap()) alert('No other exercise left for this muscle group.'); render(); });
  on('[data-skipex]', () => { session.skipExercise(); render(); });
  on('[data-markdone]', () => { session.completeExercise(); render(); });
  on('[data-done]', () => {
    session.completeSet();
    if (session.data.phase === 'cheer') applause();
    render();
  });
  on('[data-cheernow]', () => { session.nextExercise(); render(); });
  on('[data-cheerhold]', () => { session.holdCheer(); render(); });
  on('[data-skiprest]', () => { session.skipRest(); render(); });
  on('[data-addrest]', el => { session.addRest(Number(el.dataset.addrest)); render(); });
  on('[data-exit]', () => { state.screen = 'home'; releaseScreen(); render(); });
  on('[data-close]', () => { session.data = null; store.set('active', null); state.screen = 'home'; releaseScreen(); music.pause(); render(); });

  on('[data-undo]', () => { session.undoSet(); render(); });
  on('[data-callit]', () => {
    const left = session.totalSets - session.doneSets;
    const s1 = session.doneSets === 1 ? 'set' : 'sets';
    if (!confirm('Finish the session now with ' + session.doneSets + ' ' + s1 + ' logged? ' + left + ' planned sets will be left undone.')) return;
    session.callItADay(); releaseScreen(); render();
  });

  on('[data-mtoggle]', () => { music.toggle(); render(); });
  on('[data-mnext]', () => { music.next(); render(); });
  on('[data-mopen]', el => { state.musicOpen = el.dataset.mopen === '1'; render(); });
  on('[data-mstation]', el => { music.pick(el.dataset.mstation); state.musicOpen = false; render(); });
  on('[data-mcustom]', () => {
    const v = (document.getElementById('mcustom').value || '').trim();
    if (!/^https?:\/\//.test(v)) { alert('Paste a full stream address starting with http.'); return; }
    music.save({ custom: v });
    music.pick('custom');
    state.musicOpen = false;
    render();
  });
  const vol = app.querySelector('[data-mvol]');
  if (vol) vol.addEventListener('input', () => music.setVolume(Number(vol.value) / 100));

  on('[data-weight]', el => {
    const ex = session.exercise;
    session.setWeight(ex.id, session.weight(ex.id) + Number(el.dataset.weight) * WEIGHT_STEP);
    render();
  });
}

/* ---------- clock ---------- */

function beep(freq, len) {
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const ctx = new C();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq || 660; o.connect(g); g.connect(ctx.destination);
    const d = len || 0.35;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + d);
    o.start(); o.stop(ctx.currentTime + d + 0.01);
  } catch (e) { /* no audio, no problem */ }
}

function applause() {
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const ctx = new C();
    const out = ctx.createGain();
    out.gain.value = 0.5;
    out.connect(ctx.destination);

    /* A clap is a short burst of filtered noise. A crowd is a lot of them,
       swelling and then thinning out. */
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.5);

    const now = ctx.currentTime;
    for (let i = 0; i < 90; i++) {
      const t = now + Math.random() * 1.8;
      const swell = Math.min(1, (t - now) / 0.35) * Math.max(0.15, 1 - (t - now) / 2.2);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 1100 + Math.random() * 2600;
      bp.Q.value = 0.7;
      const g = ctx.createGain();
      g.gain.value = (0.05 + Math.random() * 0.09) * swell;
      src.connect(bp); bp.connect(g); g.connect(out);
      src.start(t);
    }

    /* Three notes over the top so it reads as a win, not just noise. */
    [523.25, 659.25, 783.99].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      const t = now + i * 0.11;
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t + 0.6);
    });
  } catch (e) { /* no audio, no problem */ }
}

let lastBeep = null;
let lastCd = null;
let lastFlush = 0;

setInterval(() => {
  if (state.screen === 'countdown' && state.pending) {
    const left = (state.cdEnd - Date.now()) / 1000;
    const n = Math.max(0, Math.ceil(left));
    const el = document.getElementById('cdnum');
    if (el && el.textContent !== String(n)) el.textContent = n;
    if (n !== lastCd) { lastCd = n; if (n > 0) beep(n <= 3 ? 760 : 520, 0.16); }
    if (left <= 0) { beep(980, 0.5); beginSession(state.pending.dk, state.pending.idx); }
    return;
  }

  const s = document.getElementById('syncstate');
  if (s) {
    s.textContent = sync.label();
    s.classList.toggle('is-pending', sync.pending());
  }
  /* Retry anything stuck in the queue every half minute. */
  if (sync.pending() && Date.now() - lastFlush > 30000) { lastFlush = Date.now(); sync.flush(); }
  if (!session.data || session.data.phase === 'done') return;

  const el = document.getElementById('elapsed');
  if (el) el.textContent = clock(session.elapsed);
  const mv = document.getElementById('motivate');
  if (mv) mv.textContent = session.motivation();

  if (session.data.phase === 'cheer' && session.data.cheerEndsAt) {
    const left = session.cheerLeft();
    const cc = document.getElementById('cheercount');
    const n = Math.max(0, Math.ceil(left));
    if (cc && cc.textContent !== String(n)) cc.textContent = n;
    if (left <= 0) { session.nextExercise(); render(); }
    return;
  }

  if (session.data.phase === 'rest') {
    const left = session.restLeft();
    const rc = document.getElementById('restcount');
    if (rc) rc.textContent = clock(left);
    const w = Math.ceil(left);
    if (w <= 3 && w >= 1 && lastBeep !== w) { lastBeep = w; beep(760, 0.16); }
    if (left <= 0) { lastBeep = null; session.skipRest(); render(); }
  }
}, 500);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  sync.flush();
  if (state.screen === 'run' && session.data) holdScreen();
  render();
});

loadCustomCardio();
session.load();
if (session.data && session.data.phase !== 'done') { state.screen = 'run'; holdScreen(); }
sync.flush();
render();

</script>
</body>
</html>
