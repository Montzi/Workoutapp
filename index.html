/* ---------- dates ---------- */

function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const start = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - start) / 86400000 + 1) / 7);
}

const isoDay = d => ((d.getDay() + 6) % 7) + 1;
const key = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

function today() { const d = new Date(); d.setHours(12, 0, 0, 0); return d; }
function viewedDate() { return state.selected ? new Date(state.selected + 'T12:00:00') : today(); }
function weekOf(d) { const s = addDays(d, -(isoDay(d) - 1)); return Array.from({ length: 7 }, (_, i) => addDays(s, i)); }

const fmtLong = d => d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = d => d.toLocaleDateString(undefined, { weekday: 'long' });

/* ---------- the editable week ---------- */

function defaultPlanMap(n) {
  const m = {};
  DEFAULT_SPLITS[n].forEach(s => { m[s.weekday] = { mark: s.mark, title: s.title, groups: s.groups.slice() }; });
  return m;
}

const MARK_FIX = { A: '1', B: '2', C: '3' };

function plans() {
  const p = store.get('plans', {}) || {};
  let dirty = false;
  [3, 5, 'c'].forEach(n => {
    if (!p[n]) return;
    Object.keys(p[n]).forEach(wd => {
      const m = p[n][wd] && p[n][wd].mark;
      if (m && MARK_FIX[m]) { p[n][wd].mark = MARK_FIX[m]; dirty = true; }
    });
  });
  [3, 5, 'c'].forEach(n => { if (!p[n]) { p[n] = defaultPlanMap(n); dirty = true; } });
  if (dirty) store.set('plans', p);
  return p;
}

function scheduledFor(date) { return plans()[state.split][isoDay(date)] || null; }

function sessionFor(date) {
  const ov = store.get('overrides', {})[key(date)];
  if (ov && ov.disabled) return null;
  return ov || scheduledFor(date);
}

function isDisabled(date) {
  const ov = store.get('overrides', {})[key(date)];
  return !!(ov && ov.disabled);
}

function disableDay(dateKey) {
  const o = store.get('overrides', {});
  o[dateKey] = { disabled: true };
  store.set('overrides', o);
}

function titleFor(groups) {
  const n = groups.map(g => (GROUPS[g] ? GROUPS[g].name : g));
  if (n.length <= 1) return n[0] || '';
  if (n.length === 2) return n[0] + ' and ' + n[1];
  return n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1];
}

/* Adds or removes a muscle group from a day, and keeps the exercise order in step. */
function toggleGroup(date, group) {
  const dk = key(date);
  const overrides = store.get('overrides', {});
  const ov = overrides[dk];
  const scheduled = scheduledFor(date);
  const n = PER_GROUP[state.split] || 3;

  let plan;
  if (ov && !ov.disabled) plan = ov;
  else if (scheduled) plan = scheduled;
  else {
    overrides[dk] = { mark: '+', title: titleFor([group]), groups: [], activated: true };
    store.set('overrides', overrides);
    plan = overrides[dk];
  }

  let ids = orderFor(date).slice();
  const has = plan.groups.includes(group);

  if (has) {
    if (plan.groups.length === 1) return false;
    plan.groups = plan.groups.filter(g => g !== group);
    ids = ids.filter(id => byId(id).group !== group);
  } else {
    plan.groups = plan.groups.concat([group]);
    const take = group === 'cardio' ? 1 : n;
    byGroup(group).slice(0, take).forEach(e => { if (!ids.includes(e.id)) ids.push(e.id); });
  }

  plan.title = titleFor(plan.groups);
  if (ov && !ov.disabled) { overrides[dk] = plan; store.set('overrides', overrides); }
  else { const p = plans(); p[state.split][isoDay(date)] = plan; store.set('plans', p); }
  setOrder(date, ids);
  return true;
}

function addCardioToDay(date, id) {
  const dk = key(date);
  const ids = orderFor(date).slice();   // read the order before the plan changes under us
  const overrides = store.get('overrides', {});
  const scheduled = scheduledFor(date);
  let plan = (overrides[dk] && !overrides[dk].disabled) ? overrides[dk] : scheduled;
  if (!plan) {
    overrides[dk] = { mark: '+', title: 'Cardio', groups: ['cardio'], activated: true };
    store.set('overrides', overrides);
    plan = overrides[dk];
    setOrder(date, [id]);
    return;
  }
  if (!plan.groups.includes('cardio')) plan.groups = plan.groups.concat(['cardio']);
  plan.title = titleFor(plan.groups);
  if (overrides[dk] && !overrides[dk].disabled) { overrides[dk] = plan; store.set('overrides', overrides); }
  else { const p = plans(); p[state.split][isoDay(date)] = plan; store.set('plans', p); }
  if (!ids.includes(id)) ids.push(id);
  setOrder(date, ids);
}

function resetWeek() {
  const p = plans();
  p[state.split] = defaultPlanMap(state.split);
  store.set('plans', p);
  const o = store.get('orders', {});
  Object.keys(o).forEach(k => { if (k.indexOf('s' + state.split) === 0) delete o[k]; });
  store.set('orders', o);
}

function swapDays(wdA, wdB) {
  if (wdA === wdB) return;
  const p = plans();
  const map = p[state.split];
  const a = map[wdA] || null, b = map[wdB] || null;
  if (b) map[wdA] = b; else delete map[wdA];
  if (a) map[wdB] = a; else delete map[wdB];
  store.set('plans', p);

  const o = store.get('orders', {});
  const ka = `s${state.split}w${wdA}`, kb = `s${state.split}w${wdB}`;
  const oa = o[ka], ob = o[kb];
  if (ob) o[ka] = ob; else delete o[ka];
  if (oa) o[kb] = oa; else delete o[kb];
  store.set('orders', o);
}

/* ---------- the editable exercise order ---------- */

function orderKey(date) {
  return store.get('overrides', {})[key(date)] ? 'd:' + key(date) : `s${state.split}w${isoDay(date)}`;
}

function defaultOrder(plan) {
  const n = PER_GROUP[state.split] || 3;
  const groups = [...new Set(plan.groups)];
  return dedupe(groups.flatMap(g => byGroup(g).slice(0, n).map(e => e.id)));
}

function orderFor(date) {
  const plan = sessionFor(date);
  if (!plan) return [];
  const saved = store.get('orders', {})[orderKey(date)];
  if (Array.isArray(saved) && saved.length) {
    /* Drop anything unknown or repeated rather than throwing away the whole
       list. One bad entry should not cost you a session you arranged. */
    const clean = dedupe(saved);
    if (clean.length) return clean;
  }
  return dedupe(defaultOrder(plan));
}

/* The single gate every change to a session list goes through. An exercise
   appears once or not at all, whatever route put it there. */
function dedupe(ids) {
  const seen = new Set();
  return ids.filter(id => {
    if (!byId(id) || seen.has(id)) return false;
    seen.add(id);
    return true;
  });
}

function setOrder(date, ids) {
  const o = store.get('orders', {});
  o[orderKey(date)] = dedupe(ids);
  store.set('orders', o);
}

function replaceAt(date, i) {
  const ids = orderFor(date).slice();
  const cur = byId(ids[i]);
  const pool = byGroup(cur.group);
  if (pool.length < 2) return false;
  const start = pool.findIndex(e => e.id === cur.id);
  for (let k = 1; k <= pool.length; k++) {
    const cand = pool[(start + k) % pool.length];
    if (!ids.includes(cand.id)) { ids[i] = cand.id; setOrder(date, ids); return true; }
  }
  return false;
}

/* The session, split into its muscle groups, in plan order. */
function sessionGroups(date) {
  const plan = sessionFor(date);
  if (!plan) return [];
  const ids = orderFor(date);
  const out = [];
  const used = new Set();
  plan.groups.forEach(g => {
    const list = ids.filter(id => byId(id).group === g);
    list.forEach(id => used.add(id));
    if (list.length) out.push({ group: g, ids: list });
  });
  const orphans = ids.filter(id => !used.has(id));
  orphans.forEach(id => {
    const g = byId(id).group;
    const found = out.find(o => o.group === g);
    if (found) found.ids.push(id); else out.push({ group: g, ids: [id] });
  });
  return out;
}

function availableGroups(date) {
  const plan = sessionFor(date);
  const have = plan ? plan.groups : [];
  return EDITABLE_GROUPS.filter(g => !have.includes(g));
}

/* Swap a whole muscle group for another, keeping its place in the session. */
function swapGroupFor(date, from, to) {
  const plan = sessionFor(date);
  if (!plan || !plan.groups.includes(from) || plan.groups.includes(to)) return false;
  const ids = orderFor(date);
  const at = ids.findIndex(id => byId(id).group === from);
  const take = to === 'cardio' ? 1 : (PER_GROUP[state.split] || 3);
  const fresh = byGroup(to).slice(0, take).map(e => e.id);
  const kept = ids.filter(id => byId(id).group !== from);
  const insert = at < 0 ? kept.length : Math.min(at, kept.length);
  const next = dedupe(kept.slice(0, insert).concat(fresh, kept.slice(insert)));

  plan.groups = plan.groups.map(g => (g === from ? to : g));
  plan.title = titleFor(plan.groups);
  writePlan(date, plan);
  setOrder(date, next);
  return true;
}

function writePlan(date, plan) {
  const dk = key(date);
  const overrides = store.get('overrides', {});
  if (overrides[dk] && !overrides[dk].disabled) { overrides[dk] = plan; store.set('overrides', overrides); }
  else { const p = plans(); p[state.split][isoDay(date)] = plan; store.set('plans', p); }
}

function moveAt(date, i, dir) {
  const ids = orderFor(date).slice();
  const j = i + dir;
  if (j < 0 || j >= ids.length) return;
  const t = ids[i]; ids[i] = ids[j]; ids[j] = t;
  setOrder(date, ids);
}

/* ---------- activation ---------- */

function trainedThisWeek(date) {
  const log = store.get('log', {});
  const done = new Set();
  weekOf(date).forEach(d => { const r = log[key(d)]; if (r) (r.groups || []).forEach(g => done.add(g)); });
  return done;
}

function suggestGroups(date) {
  const done = trainedThisWeek(date);
  const open = GROUP_PRIORITY.filter(g => !done.has(g));
  if (open.length >= 2) return open.slice(0, 2);
  if (open.length === 1) return open;
  return ['biceps', 'back'];
}

function activateDay(dateKey) {
  const groups = suggestGroups(new Date(dateKey + 'T12:00:00'));
  const o = store.get('overrides', {});
  o[dateKey] = { mark: '+', title: groups.map(g => GROUPS[g].name).join(' and '), groups, activated: true };
  store.set('overrides', o);
}

function deactivateDay(dateKey) {
  const o = store.get('overrides', {});
  delete o[dateKey];
  store.set('overrides', o);
  const ord = store.get('orders', {});
  delete ord['d:' + dateKey];
  store.set('orders', ord);
}

/* Days are numbered by where they fall in the week, not by a fixed letter.
   Activate an extra day and everything after it shifts up on its own. */
function markFor(date) {
  const log = store.get('log', {});
  let n = 0;
  const week = weekOf(date);
  for (let i = 0; i < week.length; i++) {
    const d = week[i];
    if (sessionFor(d) || log[key(d)]) n++;
    if (key(d) === key(date)) return sessionFor(d) || log[key(d)] ? String(n) : '';
  }
  return '';
}

function nextTrainingDay(from) {
  for (let i = 1; i <= 7; i++) {
    const d = addDays(from, i);
    if (sessionFor(d)) return { date: d, session: sessionFor(d) };
  }
  return null;
}

/* ---------- screen wake lock ---------- */

let wakeLock = null;

async function holdScreen() {
  try {
    if (navigator.wakeLock && !wakeLock) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) { /* unsupported or refused, not worth telling anyone */ }
}

function releaseScreen() {
  if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
}

/* Settings that arrived from the sheet have to reach the live state, not just storage. */
function onPrefsApplied() {
  const v = String(store.get('split', 3));
  state.split = v === 'c' ? 'c' : Number(v) || 3;
  state.moving = false;
  state.editing = false;
  state.swapGroup = null;
}

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function render() {
  remote.pushPrefs();
  if (state.screen === 'countdown' && state.pending) app.innerHTML = countdownView();
  else if (state.screen === 'run' && session.data) app.innerHTML = runView();
  else if (state.screen === 'history') app.innerHTML = historyView();
  else if (state.screen === 'daylog') app.innerHTML = dayLogView();
  else if (state.screen === 'manual' && state.manual) app.innerHTML = manualView();
  else if (state.screen === 'detail') app.innerHTML = detailView();
  else app.innerHTML = homeView();
  bind();
  startFigureLoop();
}

function heroTraining(d, plan) {

function dayMover(d) {
  const wd = isoDay(d);
  const map = plans()[state.split];
  const cells = WEEKDAY_NAMES.map((name, i) => {
    const target = i + 1;
    const p = map[target];
    return `<button class="mover-day" ${target === wd ? 'disabled' : ''} data-swapday="${target}">
      <span class="mv-name">${esc(name.slice(0, 3))}</span>

  }).join('');
  return `
    <section class="mover">
      <div class="panel-head">

function splitSwitch() {
  const on = n => String(state.split) === String(n);
  const buttons = [3, 5, 'c'].map(n =>
    `<button data-split="${n}" aria-pressed="${on(n)}">${SPLIT_LABEL[n]}</button>`).join('');
  return `<div class="switch" role="group" aria-label="Training days per week">${buttons}</div>
    ${state.split === 'c' ? customPicker() : ''}`;
}

function customPicker() {
  const map = plans().c || {};
  const cells = WEEKDAY_NAMES.map((name, i) => {
    const wd = i + 1;
    const p = map[wd];
    return `<button class="chip is-day" aria-pressed="${!!p}" data-customday="${wd}">
      ${esc(name.slice(0, 3))}${p ? ' &check;' : ''}</button>`;
  }).join('');
  return `<section class="groups">
    <h3>Your own schedule</h3>
    <p class="hint">Tap the days you plan to train. Each one starts with three exercises per group,
      and you can change its muscle groups from the day itself.</p>
    <div class="chips">${cells}</div>
    ${Object.keys(map).length ? `<p class="hint" style="margin-top:10px">${
      Object.keys(map).sort().map(wd => esc(WEEKDAY_NAMES[wd - 1].slice(0, 3)) + ' ' + esc(map[wd].title)).join(' &middot; ')
    }</p>` : ''}
  </section>`;
}

function toggleCustomDay(wd) {
  const p = plans();
  const map = p.c || (p.c = {});
  if (map[wd]) {
    delete map[wd];
    const o = store.get('orders', {});
    delete o['scw' + wd];
    store.set('orders', o);
  } else {
    const groups = CUSTOM_ROTATION[Object.keys(map).length % CUSTOM_ROTATION.length].slice();
    map[wd] = { title: titleFor(groups), groups };
  }
  store.set('plans', p);
}

function weekStrip(viewed) {
  const t = today(), log = store.get('log', {});
  const cells = weekOf(viewed).map(d => {
    const s = sessionFor(d);
    const cls = ['week-day'];
    if (!s) cls.push('is-rest');
    if (log[key(d)]) cls.push('is-logged');
    if (key(d) === key(t)) cls.push('is-today');
    return `<button class="${cls.join(' ')}" aria-pressed="${key(d) === key(viewed)}" data-goto="${key(d)}">
      <span class="wd">${esc(d.toLocaleDateString(undefined, { weekday: 'narrow' }))}</span>
      <span class="wm">${markFor(d) || '&middot;'}</span>
    </button>`;
  }).join('');
  return `<nav class="week" aria-label="This week">${cells}</nav>`;
}

function exerciseList(d) {
  const dk = key(d);
  const ids = orderFor(d);
  const blocks = sessionGroups(d).map(sec => {
    const sets = sec.ids.reduce((n, id) => n + byId(id).sets, 0);
    const open = state.swapGroup === sec.group;
    const rows = sec.ids.map((id, li) => {
      const e = byId(id);
      const gi = ids.indexOf(id);
      return `<div class="card">
        <button class="card-main" data-exercise="${e.id}" data-from="${dk}">
          <span class="card-thumb">${thumbFor(e, (gi + 1) * 0.13)}</span>
          <span class="card-body">
            <span class="card-tag">${gi + 1} &middot; ${esc(GROUPS[e.group].name)}</span>
            <h3>${esc(e.name)}</h3>
            <p>${e.cardio ? esc(e.reps) : `${e.sets} sets &middot; ${esc(e.reps)} reps &middot; ${GROUPS[e.group].rest}s rest`}</p>
          </span>
        </button>
        <div class="card-tools">
          <button data-up="${gi}" data-d="${dk}" ${li === 0 ? 'disabled' : ''} aria-label="Move up">&uarr;</button>
          <button data-down="${gi}" data-d="${dk}" ${li === sec.ids.length - 1 ? 'disabled' : ''} aria-label="Move down">&darr;</button>
          <button class="tool-wide" data-replace="${gi}" data-d="${dk}">Replace</button>
        </div>
      </div>`;
    }).join('');

    const choices = availableGroups(d).map(g =>
      `<button class="chip" data-swapto="${g}" data-from="${sec.group}" data-d="${dk}">${esc(GROUPS[g].name)}</button>`
    ).join('') || '<p class="hint">Every muscle group is already in this session.</p>';

    return `<section class="gsec">
      <div class="gsec-head">
        <div>
          <p class="gsec-name">${esc(GROUPS[sec.group].name)}</p>
          <p class="gsec-meta">${sec.ids.length} ${sec.ids.length === 1 ? 'exercise' : 'exercises'} &middot; ${sets} sets</p>
        </div>
        <div class="gsec-tools">
          <button data-swapgroup="${open ? '' : sec.group}">${open ? 'Cancel' : 'Swap'}</button>
          <button data-rmgroup="${sec.group}" data-d="${dk}">Remove</button>
        </div>
      </div>
      ${open ? `<div class="gsec-swap"><p class="hint">Swap ${esc(GROUPS[sec.group].name)} for:</p><div class="chips">${choices}</div></div>` : ''}
      ${rows}
    </section>`;
  }).join('');

  return `<div class="section-head"><h2>The session</h2><span>Tap to open, or reorder</span></div>${blocks}`;
}

/* ---------- what you actually did ---------- */

function performedList(rec) {
  const entries = rec.entries || [];

    if (!r) { r = { name: e.exerciseName, group: e.group, sets: 0, weight: '' }; rows.push(r); }

      <span class="logrow-n">${i + 1}</span>

      <span class="logrow-meta">${r.sets} ${r.sets === 1 ? 'set' : 'sets'}${r.weight ? ' &middot; ' + r.weight + ' lb' : ''}</span>

    <div class="panel">${body}</div>
    <div class="hero-actions">
      <button class="btn btn-quiet" data-manual="${esc(key(viewedDate()))}">Edit this workout</button>
      <button class="btn btn-quiet" data-daylog="${esc(key(viewedDate()))}">Full log</button>
    </div>`;
}

/* ---------- week band ---------- */

function weekBand(viewed) {
  const t = today(), log = store.get('log', {});
  const days = weekOf(viewed);
  const cells = days.map(d => {
    const rec = log[key(d)];
    const future = d > t && key(d) !== key(t);
    const cls = ['band-day'];
    if (rec) cls.push('is-done');
    if (key(d) === key(t)) cls.push('is-today');
    if (future) cls.push('is-future');
    return `<button class="${cls.join(' ')}" ${future ? 'disabled' : `data-daylog="${key(d)}"`}
      ${future ? 'title="Not here yet. Plan it in the week below."' : ''}>
      <span class="bd-w">${esc(d.toLocaleDateString(undefined, { weekday: 'narrow' }))}</span>
      <span class="bd-n">${d.getDate()}</span>
      <span class="bd-tick">${rec ? '&check;' : '&nbsp;'}</span>
    </button>`;
  }).join('');
  const done = days.filter(d => log[key(d)]).length;
  return `<section class="band">
    <p class="band-head"><span class="band-week">Week ${isoWeek(viewed)}</span>
      <span>${done} of 7 days logged</span></p>
    <div class="band-grid">${cells}</div>
    <p class="band-note">Tap a day up to today to see or add its log. Plan ahead in the week below.</p>

}

/* ---------- logging a day you missed ---------- */

function startManual(dateKey) {
  const d = dateOf(dateKey);
  const existing = store.get('log', {})[dateKey];
  let items, groups, minutes;

  if (existing && existing.entries && existing.entries.length) {
    items = [];
    existing.entries.forEach(e => {
      let r = items.find(x => x.id === e.exerciseId);
      if (!r) { r = { id: e.exerciseId, sets: 0, weight: Number(e.weight) || 0, reps: Number(e.reps) || DEFAULT_REPS }; items.push(r); }
      r.sets++;
      if (e.weight) r.weight = Number(e.weight);
      if (Number(e.reps)) r.reps = Number(e.reps);
    });
    items = items.filter(x => byId(x.id));
    groups = [...new Set(items.map(x => byId(x.id).group))];
    minutes = Math.max(1, Math.round(existing.durationSec / 60));
  } else {
    const plan = sessionFor(d);
    const ids = plan ? orderFor(d) : [];
    items = ids.map(id => ({ id, sets: byId(id).sets, weight: byId(id).cardio ? 0 : session.weight(id),
      reps: byId(id).cardio ? 0 : session.reps(id) }));
    groups = plan ? plan.groups.slice() : [];
    minutes = Math.max(20, Math.round(estimateSeconds(ids.map(byId)) / 60 / 5) * 5);
  }

  state.manual = { dateKey, groups, items, minutes, touched: !!existing, picking: null, editing: !!existing };
  state.screen = 'manual';
}

function manualEstimate() {
  const m = state.manual;
  return Math.max(5, Math.round(estimateSeconds(m.items.map(i => byId(i.id))) / 60 / 5) * 5);
}

function manualToggleGroup(g) {
  const m = state.manual;
  const take = g === 'cardio' ? 1 : (PER_GROUP[state.split] || 3);
  if (m.groups.includes(g)) {
    m.groups = m.groups.filter(x => x !== g);
    m.items = m.items.filter(i => byId(i.id).group !== g);
  } else {
    m.groups.push(g);
    byGroup(g).slice(0, take).forEach(e => {
      if (!m.items.some(i => i.id === e.id)) {
        m.items.push({ id: e.id, sets: e.sets, weight: e.cardio ? 0 : session.weight(e.id),
          reps: e.cardio ? 0 : session.reps(e.id) });
      }
    });
  }
  if (!m.touched) m.minutes = manualEstimate();
}

function manualAdd(id) {
  const m = state.manual;
  const e = byId(id);
  if (!m.items.some(i => i.id === id)) {
    m.items.push({ id, sets: e.sets, weight: e.cardio ? 0 : session.weight(id),
      reps: e.cardio ? 0 : session.reps(id) });
    if (!m.groups.includes(e.group)) m.groups.push(e.group);
    if (!m.touched) m.minutes = manualEstimate();
  }
  m.picking = null;
}

function manualDrop(id) {
  const m = state.manual;
  m.items = m.items.filter(i => i.id !== id);
  m.groups = m.groups.filter(g => m.items.some(i => byId(i.id).group === g));
  if (!m.touched) m.minutes = manualEstimate();
}

function manualBump(id, field, by) {
  const m = state.manual;
  const it = m.items.find(i => i.id === id);
  if (!it) return;
  if (field === 'sets') it.sets = Math.min(10, Math.max(1, it.sets + by));
  else if (field === 'reps') it.reps = Math.min(60, Math.max(1, (it.reps || DEFAULT_REPS) + by));
  else it.weight = Math.min(MAX_DUMBBELL, Math.max(0, it.weight + by * WEIGHT_STEP));
  if (field === 'sets' && !m.touched) m.minutes = manualEstimate();
}

function saveManual() {
  const m = state.manual;
  if (!m.items.length) { alert('Add at least one exercise.'); return false; }
  const minutes = Math.max(1, Number(m.minutes) || 1);
  const doneGroups = [...new Set(m.items.map(i => byId(i.id).group))];
  const title = titleFor(doneGroups);
  const entries = [];
  m.items.forEach(it => {
    const e = byId(it.id);
    for (let i = 1; i <= it.sets; i++) {
      entries.push({
        exerciseId: e.id, exerciseName: e.name, group: e.group,
        set: i, reps: e.cardio ? e.reps : (it.reps || DEFAULT_REPS), target: e.reps,
        weight: e.cardio ? '' : (it.weight || ''),
        elapsedSec: 0, marked: m.editing ? 'edited' : 'added later'
      });
    }
    if (!e.cardio && it.weight) session.setWeight(e.id, it.weight);
    if (!e.cardio && it.reps) session.setReps(e.id, it.reps);
  });

  const run = newRun();
  const log = store.get('log', {});
  log[m.dateKey] = {
    title, groups: doneGroups, run,
    durationSec: minutes * 60, sets: entries.length,
    exercises: [...new Set(entries.map(e => e.exerciseName))],
    entries, finishedAt: new Date(m.dateKey + 'T12:00:00').toISOString()
  };
  store.set('log', log);

  entries.forEach(e => sync.push(Object.assign({ type: 'set', dateKey: m.dateKey, sessionTitle: title, run }, e)));
  sync.push({
    type: 'session', dateKey: m.dateKey, title, groups: doneGroups.join('|'), run,
    durationSec: minutes * 60, sets: entries.length,
    exercises: [...new Set(entries.map(e => e.exerciseName))].join('|')
  });
  return true;
}

    : `<div class="chips" style="margin-top:10px">${EDITABLE_GROUPS.map(g =>
        `<button class="chip" data-mpick="${g}">+ ${esc(GROUPS[g].name)}</button>`).join('')}</div>`;

  const total = m.items.reduce((n, i) => n + i.sets, 0);

  return `

    <div class="detail">

      <div class="panel"><h2>How long did it take</h2>

      </div>
      <p class="stage-note">These land in your sheet flagged as ${m.editing ? 'edited' : 'added later'}, so the record stays honest.</p>
    </div>`;
}

      ${motionBlock(e)}
      <div class="panel"><h2>Technique</h2>
        <ul class="cues">${e.cues.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
      </div>
      <div class="panel"><h2>Muscles worked</h2>${muscleMap(e.muscles)}</div>
    </div>
    ${state.zoom ? lightbox() : ''}`;
}

function lightbox() {
  return `<div class="lightbox" data-closezoom="1">
      <img src="${state.zoom}" alt="Technique guide">
    </div>
    <button class="lightbox-close" data-closezoom="1" aria-label="Close">&times;</button>`;
}

/* ---------- history ---------- */

function historyView() {
  const local = store.get('log', {});
  const days = Object.keys(local).sort().reverse();
  const remote = state.history;

  const localRows = days.length ? days.map(k => {
    const r = local[k];
    return `<li class="hist">
      <span class="hist-date">${esc(k)}</span>
      <span class="hist-title">${esc(r.title)}</span>
      <span class="hist-meta">${clock(r.durationSec)} &middot; ${r.sets} sets</span>
    </li>`;
  }).join('') : '<li class="hist hist-empty">Nothing logged on this device yet.</li>';

  let remoteBlock;
  if (remote === null) remoteBlock = '<p class="stage-note">Loading from your sheet.</p>';
  else if (remote === 'error') remoteBlock = '<p class="stage-note">Could not reach the sheet. Check the Apps Script deployment is set to "Anyone".</p>';
  else if (!remote.length) remoteBlock = '<p class="stage-note">The sheet has no sessions yet.</p>';
  else remoteBlock = `<ul class="hists">${remote.slice().reverse().map(s => `<li class="hist">
      <span class="hist-date">${esc(String(s.date).slice(0, 10))}</span>
      <span class="hist-title">${esc(s.title || '')}</span>
      <span class="hist-meta">${esc(String(s.duration || ''))} &middot; ${esc(String(s.sets || 0))} sets</span>
    </li>`).join('')}</ul>`;

  return `
    ${welcomeBar()}
    <div class="detail">
      <button class="back" data-back="1">&larr; Back</button>
      <h1>History</h1>
      <p class="detail-meta">On this device</p>
      <ul class="hists">${localRows}</ul>
      <p class="detail-meta" style="margin-top:22px">From the sheet</p>
      ${remoteBlock}
    </div>`;
}

function loadHistory() {
  remote.pull();
  state.history = null;
  fetch(SYNC_URL + '?action=history')
    .then(r => r.json())
    .then(j => { state.history = (j && j.sessions) || []; if (state.screen === 'history') render(); })
    .catch(() => { state.history = 'error'; if (state.screen === 'history') render(); });
}

/* ---------- music ---------- */

function musicBar() {
  const st = music.station();
  const p = music.prefs();
  const on = music.state === 'playing' || music.state === 'loading';
  const pct = Math.round(p.volume * 100);

  const groups = MOODS.map(m => {
    const items = STATIONS.filter(x => x.mood === m.id);
    if (!items.length) return '';
    return `<p class="music-mood">${esc(m.name)}</p>
      <div class="chips">${items.map(x =>
        `<button class="chip" aria-pressed="${x.id === p.station}" data-mstation="${x.id}">${esc(x.name)}</button>`
      ).join('')}</div>`;
  }).join('');

  const deaf = !music.volumeLive();

  return `<section class="music">
    <div class="music-row">
      <button class="music-btn is-play" data-mtoggle="1" aria-label="${on ? 'Pause' : 'Play'}">${on ? '&#10073;&#10073;' : '&#9654;'}</button>
      <button class="music-now" data-mopen="${state.musicOpen ? '0' : '1'}">
        <span class="music-name">${esc(st.name)}</span>
        <span class="music-sub">${esc(st.by)} &middot; ${esc(music.label())}</span>
      </button>
      <button class="music-btn" data-mnext="1" aria-label="Next station">&#9197;</button>
    </div>
    <div class="music-row is-vol">
      <button class="music-btn is-small" data-mvoljump="0" aria-label="Mute">&#128264;</button>
      <input class="music-vol" type="range" min="0" max="100" step="1" value="${pct}" data-mvol="1" aria-label="Volume">
      <span class="music-pct" id="musicpct">${pct}%</span>
      <button class="music-btn is-small" data-mvoljump="100" aria-label="Full volume">&#128266;</button>
    </div>
    ${deaf ? `<p class="music-note">This phone keeps volume for live stations on its own buttons.
      The slider still controls the built in loops.</p>` : ''}
    ${state.musicOpen ? `<div class="music-picker">
      ${groups}
      <div class="cardio-form">
        <label for="mcustom">Or paste a stream address</label>
        <div class="cardio-row">
          <input id="mcustom" type="url" placeholder="https://..." value="${esc(p.custom)}" autocomplete="off">
          <button class="btn" data-mcustom="1">Use</button>
        </div>
      </div>
    </div>` : ''}
  </section>`;
}

/* ---------- runner ---------- */

function runView() {
  const d = session.data;
  if (d.phase === 'done') return doneView();
  const ex = session.exercise;
  const setNo = Math.min(d.setsDone + 1, ex.sets);
  const pct = Math.round((session.doneSets / session.totalSets) * 100);

  return `
    ${welcomeBar()}
    ${musicBar()}
    <div class="run">
      <div class="run-top">
        <button class="back" data-exit="1">&larr; Leave</button>
        <span class="run-pos">Exercise ${d.idx + 1} of ${d.order.length}</span>
      </div>
      ${session.doneSets ? `<button class="callit" data-callit="1">Call it a day &middot; finish with ${session.doneSets} ${session.doneSets === 1 ? 'set' : 'sets'} logged</button>` : ''}
      <div class="bar"><span style="width:${pct}%"></span></div>
      <p class="bar-note">${session.doneSets} of ${session.totalSets} sets done in this session</p>
      ${d.phase === 'cheer' ? '' : (d.phase === 'proposed'
        ? posterBlock(ex, { body: true })
        : (d.phase === 'rest'
            ? `<div class="detail-stage is-rest">${bodySVG(REST_FIGURE)}</div>`
            : stageFor(ex)))}
      ${d.phase === 'cheer' ? '' : `<h1 class="run-name">${esc(ex.name)}</h1>`}
      ${d.phase === 'proposed' ? proposedBlock(ex) : ''}
      ${d.phase === 'set' ? setBlock(ex, setNo) + posterOnly(ex) : ''}
      ${d.phase === 'rest' ? restBlock(ex, setNo) : ''}
      ${d.phase === 'cheer' ? cheerBlock(ex) : ''}
    </div>
    ${state.zoom ? lightbox() : ''}`;
}

/* One tap back, for a wrong weight or an early tap. */
function undoRow() {
  if (!session.doneSets) return '';
  const last = session.data.logged[session.data.logged.length - 1];
  return `<button class="linky undo" data-undo="1">
    &larr; Undo ${esc(last.exerciseName)} set ${last.set}${last.weight ? ' at ' + last.weight + ' lb' : ''}</button>`;
}

const CONFETTI_COLOURS = ['#1e9bff', '#7cc6ff', '#ffffff', '#0d6fd1', '#bfe3ff'];

function confetti() {
  let out = '';
  for (let i = 0; i < 40; i++) {
    const left = Math.round(Math.random() * 100);
    const delay = (Math.random() * 1.6).toFixed(2);
    const dur = (1.9 + Math.random() * 1.7).toFixed(2);
    const size = 5 + Math.round(Math.random() * 5);
    const c = CONFETTI_COLOURS[i % CONFETTI_COLOURS.length];
    const spin = Math.round(360 + Math.random() * 720);
    const round = Math.random() > 0.6 ? '50%' : '1px';
    out += `<i style="left:${left}%;width:${size}px;height:${size + 4}px;background:${c};
      border-radius:${round};animation-delay:${delay}s;animation-duration:${dur}s;
      --spin:${spin}deg"></i>`;
  }
  return `<div class="confetti" aria-hidden="true">${out}</div>`;
}

function cheerBlock(ex) {
  const d = session.data;
  const next = session.upNext;
  const holding = !d.cheerEndsAt;

  const upNext = next
    ? `<div class="upnext">
        <p class="upnext-l">Up next</p>
        <div class="upnext-row">
          <span class="upnext-fig">${thumbFor(next, 0)}</span>
          <span>
            <span class="upnext-n">${esc(next.name)}</span>
            <span class="upnext-m">${next.cardio
              ? esc(next.reps)
              : `${next.sets} sets &middot; ${esc(next.reps)} reps &middot; ${esc(GROUPS[next.group].name)}`}</span>
          </span>
        </div>
      </div>`
    : `<div class="upnext">
        <p class="upnext-l">Last one</p>
        <div class="upnext-row"><span><span class="upnext-n">That was the whole session</span></span></div>
      </div>`;

  return `
    <div class="cheer">
      ${confetti()}
      <p class="cheer-h">${esc(d.cheerLine || 'Hurray!')}</p>
      <p class="cheer-sub">${esc(ex.name)} done &middot; ${ex.sets} of ${ex.sets} sets</p>
      ${upNext}
      <p class="cheer-cd">${holding
        ? 'Take your time. Go when you are ready.'
        : `Starting in <strong id="cheercount">${Math.max(0, Math.ceil(session.cheerLeft()))}</strong>`}</p>
      <div class="hero-actions">
        <button class="btn" data-cheernow="1">${next ? 'Start it now' : 'Finish the session'}</button>
        ${holding ? '' : '<button class="btn btn-quiet" data-cheerhold="1">Hold on</button>'}
      </div>
      ${undoRow()}
    </div>`;
}

/* Everything in this muscle group that is not already somewhere in the session. */
function swapOptions(ex) {
  const used = new Set(session.data.order);
  return byGroup(ex.group).filter(e => e.id !== ex.id && !used.has(e.id));
}

function swapPicker(ex) {
  const opts = swapOptions(ex);
  return `<div class="gsec-swap">
    <p class="hint">${opts.length
      ? 'Swap this for another ' + esc(GROUPS[ex.group].name.toLowerCase()) + ' exercise. The rest of the session stays as it is.'
      : 'Every ' + esc(GROUPS[ex.group].name.toLowerCase()) + ' exercise is already in this session.'}</p>
    <div class="chips">${opts.map(e =>
      `<button class="chip" data-swapto-ex="${e.id}">${esc(e.name)}</button>`).join('')}</div>
  </div>`;
}

function weightPicker(ex) {
  const w = session.weight(ex.id);
  const r = session.reps(ex.id);
  return `<div class="pickers">
    <div class="weight">
      <button data-weight="-1" aria-label="Lower the weight">&minus;</button>
      <span><strong>${w}</strong> lb each</span>
      <button data-weight="1" aria-label="Raise the weight">+</button>
    </div>
    <div class="weight">
      <button data-repsbump="-1" aria-label="Fewer reps">&minus;</button>
      <span><strong>${r}</strong> reps</span>
      <button data-repsbump="1" aria-label="More reps">+</button>
    </div>
  </div>`;
}

function proposedBlock(ex) {
  return `
    ${metaChips(ex)}
    <p class="desc">${esc(ex.desc)}</p>
    ${ex.cardio ? '' : weightPicker(ex)}
    <div class="hero-actions">
      <button class="btn" data-accept="1">Accept</button>
      <button class="btn btn-quiet" data-pickswap="${state.pickSwap ? '0' : '1'}">${state.pickSwap ? 'Keep this one' : 'Change exercise'}</button>
    </div>
    ${state.pickSwap ? swapPicker(ex) : ''}
    <div class="hero-actions">
      <button class="btn btn-quiet" data-markdone="1">Mark as done</button>
    </div>
    <button class="linky" data-skipex="1">Skip this exercise</button>
    ${undoRow()}
    ${motionBlock(ex)}
    <div class="panel"><h2>Technique</h2>
      <ul class="cues">${ex.cues.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
    </div>
    <div class="panel"><h2>Muscles worked</h2>${muscleMap(ex.muscles)}</div>`;
}

function setBlock(ex, setNo) {
  const pct = Math.round((session.data.setsDone / ex.sets) * 100);
  if (ex.cardio) return `
    <p class="set-count">Target <strong>${ex.minutes}</strong> min</p>
    <p class="bar-note">The session clock above is running. Come back and log it when you finish.</p>
    <div class="hero-actions"><button class="btn" data-done="1">Cardio complete</button></div>
    ${undoRow()}
    <p class="cue-strip">${esc(ex.cues[0])}</p>`;
  return `
    <p class="set-count">Set <strong>${setNo}</strong> of ${ex.sets}</p>
    <div class="bar is-set"><span style="width:${pct}%"></span></div>
    <p class="bar-note">${session.data.setsDone} of ${ex.sets} done &middot; aiming for ${esc(ex.reps)}</p>
    ${weightPicker(ex)}
    <div class="hero-actions">
      <button class="btn" data-done="1">Next set (${setNo}/${ex.sets})</button>
      <button class="btn btn-quiet" data-markdone="1">Mark exercise done</button>
    </div>
    ${undoRow()}
    <p class="cue-strip">${esc(ex.cues[0])}</p>`;
}

function restBlock(ex, setNo) {
  return `
    <div class="rest">
      <p class="rest-label">Rest &middot; breathe</p>
      <p class="rest-clock" id="restcount">${clock(session.restLeft())}</p>
      <p class="rest-next">Set ${setNo} of ${ex.sets} starts automatically</p>
    </div>
    <div class="hero-actions">
      <button class="btn" data-skiprest="1">Start now</button>
      <button class="btn btn-quiet" data-addrest="30">Add 30s</button>
    </div>
    ${undoRow()}
    <button class="linky" data-markdone="1">Mark exercise done and move on</button>`;
}

function doneView() {
  const d = session.data;
  const names = [...new Set(d.logged.map(l => l.exerciseName))];
  return `
    ${welcomeBar()}
    <div class="detail">
      <h1 class="run-name">${esc(titleFor([...new Set(d.logged.map(l => l.group))]) || d.title)} done</h1>
      <p class="detail-meta">${clock((Date.now() - d.startedAt) / 1000)} &middot; ${d.logged.length} sets &middot; ${names.length} exercises</p>
      <ul class="cues">${names.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
      <p class="stage-note">Saved to your sheet. ${esc(sync.label())}.</p>
      <div class="hero-actions"><button class="btn" data-close="1">Back to the week</button></div>
    </div>`;
}

/* ---------- events ---------- */

function on(sel, fn) { app.querySelectorAll(sel).forEach(el => el.addEventListener('click', () => fn(el))); }
const dateOf = k => new Date(k + 'T12:00:00');

const COUNTDOWN_SEC = 10;

function armCountdown(dk, startIdx) {
  if (!sessionFor(dateOf(dk))) return;
  state.pending = { dk, idx: startIdx || 0 };
  state.cdEnd = Date.now() + COUNTDOWN_SEC * 1000;
  state.screen = 'countdown';
  lastCd = null;
  holdScreen();
  if (music.state === 'idle' && store.get('music', {}).station) music.play();
  render();
}

function beginSession(dk, startIdx) {
  const d = dateOf(dk);
  const plan = sessionFor(d);
  if (!plan) return;
  if (session.data && session.data.phase !== 'done') session.abandon();
  session.start(dk, plan, orderFor(d), startIdx || 0);
  state.pending = null;
  state.cdEnd = null;
  state.screen = 'run';
  holdScreen();
  render();
}

function countdownView() {
  const left = Math.max(0, (state.cdEnd - Date.now()) / 1000);
  const n = Math.ceil(left);
  const d = dateOf(state.pending.dk);
  const plan = sessionFor(d);
  const first = byId(orderFor(d)[state.pending.idx] || orderFor(d)[0]);
  return `
    ${welcomeBar()}
    ${musicBar()}
    <div class="cd">
      <p class="cd-label">Starting in</p>
      <p class="cd-num" id="cdnum">${n}</p>
      <p class="cd-next">${esc(plan.title)} &middot; first up, ${esc(first.name)}</p>
      <div class="hero-actions">
        <button class="btn" data-cdskip="1">Start now</button>
        <button class="btn btn-quiet" data-cdcancel="1">Cancel</button>
      </div>
    </div>`;
}

function bind() {
  on('[data-split]', el => {
    const v = el.dataset.split;
    state.split = v === 'c' ? 'c' : Number(v);
    store.set('split', state.split);
    state.moving = false; state.editing = false; state.swapGroup = null;
    render();
  });
  on('[data-customday]', el => { toggleCustomDay(Number(el.dataset.customday)); render(); });
  on('[data-goto]', el => { state.selected = el.dataset.goto === key(today()) ? null : el.dataset.goto; state.screen = 'home'; state.moving = false; state.editing = false; render(); });
  on('[data-exercise]', el => { state.exercise = el.dataset.exercise; state.detailFrom = el.dataset.from || null; state.screen = 'detail'; render(); });
  on('[data-back]', () => { state.screen = 'home'; state.exercise = null; state.manual = null; render(); });
  on('[data-activate]', el => { activateDay(el.dataset.activate); render(); });
  on('[data-deactivate]', el => { deactivateDay(el.dataset.deactivate); render(); });
  on('[data-history]', () => { state.menu = false; state.screen = 'history'; loadHistory(); render(); });

  on('[data-swapgroup]', el => { state.swapGroup = el.dataset.swapgroup || null; render(); });
  on('[data-swapto]', el => {
    if (!swapGroupFor(dateOf(el.dataset.d), el.dataset.from, el.dataset.swapto)) alert('That group is already in this session.');
    state.swapGroup = null; render();
  });
  on('[data-rmgroup]', el => {
    if (!toggleGroup(dateOf(el.dataset.d), el.dataset.rmgroup)) alert('A day needs at least one muscle group. Turn the day off instead.');
    state.swapGroup = null; render();
  });

  on('[data-manual]', el => { startManual(el.dataset.manual); render(); });
  on('[data-mgroup]', el => { manualToggleGroup(el.dataset.mgroup); render(); });
  on('[data-mdrop]', el => { manualDrop(el.dataset.mdrop); render(); });
  on('[data-mbump]', el => { manualBump(el.dataset.i, el.dataset.mbump, Number(el.dataset.by)); render(); });
  on('[data-mpick]', el => { state.manual.picking = el.dataset.mpick || null; render(); });
  on('[data-madd]', el => { manualAdd(el.dataset.madd); render(); });
  on('[data-mmin]', el => {
    state.manual.minutes = Math.max(5, state.manual.minutes + Number(el.dataset.mmin));
    state.manual.touched = true;   // stop the estimate overwriting a number you set yourself
    render();
  });
  on('[data-msave]', () => { if (saveManual()) { state.logDate = state.manual.dateKey; state.manual = null; state.screen = 'daylog'; render(); } });
  on('[data-mclear]', el => {
    const log = store.get('log', {}); delete log[el.dataset.mclear]; store.set('log', log);
    state.screen = 'daylog'; render();
  });

  on('[data-sync]', () => { sync.flush(); remote.pull(); render(); });
  on('[data-menu]', el => { state.menu = el.dataset.menu === '1'; render(); });
  on('[data-equip]', el => {
    const cur = Object.assign({}, equipOn());
    const id = el.dataset.equip;
    cur[id] = !cur[id];
    if (!EQUIPMENT.some(e => cur[e.id])) { alert('Keep at least one kind of equipment turned on.'); return; }
    store.set('equip', cur);
    render();
  });
  on('[data-tester]', el => setTesterMode(el.dataset.tester === '1'));
  on('[data-zoomposter]', el => {
    const img = el.closest('.poster').querySelector('img');
    state.zoom = img ? img.getAttribute('src') : null;
    render();
  });
  on('[data-closezoom]', () => { state.zoom = null; render(); });
  on('[data-daylog]', el => { state.logDate = el.dataset.daylog; state.screen = 'daylog'; render(); });
  on('[data-disable]', el => {
    disableDay(el.dataset.disable);
    state.editing = false; state.moving = false; state.swapGroup = null;
    render();
  });
  on('[data-edit]', el => { state.editing = el.dataset.edit === '1'; render(); });
  on('[data-group]', el => {
    if (!toggleGroup(dateOf(el.dataset.d), el.dataset.group)) alert('A day needs at least one muscle group. Turn the day off instead.');
    render();
  });
  on('[data-addcardio]', el => { addCardioToDay(dateOf(el.dataset.d), el.dataset.addcardio); render(); });
  on('[data-savecardio]', el => {
    const t = (document.getElementById('ctype').value || '').trim();
    const m = parseInt(document.getElementById('cmins').value, 10);
    if (!t || !m || m < 5) { alert('Give it a name and a length of at least 5 minutes.'); return; }
    addCardioToDay(dateOf(el.dataset.d), addCustomCardio(t, m));
    render();
  });

  on('[data-move]', el => { state.moving = el.dataset.move === '1'; render(); });
  on('[data-swapday]', el => { swapDays(isoDay(viewedDate()), Number(el.dataset.swapday)); state.moving = false; render(); });
  on('[data-resetweek]', () => { resetWeek(); state.moving = false; render(); });

  on('[data-up]', el => { moveAt(dateOf(el.dataset.d), Number(el.dataset.up), -1); render(); });
  on('[data-down]', el => { moveAt(dateOf(el.dataset.d), Number(el.dataset.down), 1); render(); });
  on('[data-replace]', el => {
    if (!replaceAt(dateOf(el.dataset.d), Number(el.dataset.replace))) alert('Every exercise for that muscle group is already in this session.');
    render();
  });
  on('[data-replacehere]', el => {
    const d = dateOf(el.dataset.d), i = Number(el.dataset.replacehere);
    if (replaceAt(d, i)) { state.exercise = orderFor(d)[i]; } else alert('Every exercise for that muscle group is already in this session.');
    render();
  });

  on('[data-start]', el => armCountdown(el.dataset.start, 0));
  on('[data-starthere]', el => armCountdown(el.dataset.starthere, Math.max(0, Number(el.dataset.i))));
  on('[data-cdskip]', () => beginSession(state.pending.dk, state.pending.idx));
  on('[data-cdcancel]', () => { state.pending = null; state.cdEnd = null; state.screen = 'home'; releaseScreen(); render(); });
  on('[data-resume]', () => { state.screen = 'run'; holdScreen(); render(); });
  on('[data-accept]', () => { state.pickSwap = false; session.accept(); render(); });
  on('[data-pickswap]', el => { state.pickSwap = el.dataset.pickswap === '1'; render(); });
  on('[data-swapto-ex]', el => {
    if (!session.swapTo(el.dataset.swaptoEx)) alert('That exercise is already in this session.');
    state.pickSwap = false;
    render();
  });
  on('[data-skipex]', () => { state.pickSwap = false; session.skipExercise(); render(); });
  on('[data-markdone]', () => { session.completeExercise(); render(); });
  on('[data-done]', () => {
    session.completeSet();
    if (session.data.phase === 'cheer') applause();
    render();
  });
  on('[data-cheernow]', () => { session.nextExercise(); render(); });
  on('[data-cheerhold]', () => { session.holdCheer(); render(); });
  on('[data-skiprest]', () => { session.skipRest(); render(); });
  on('[data-addrest]', el => { session.addRest(Number(el.dataset.addrest)); render(); });
  on('[data-exit]', () => { state.screen = 'home'; releaseScreen(); render(); });
  on('[data-close]', () => { session.data = null; store.set('active', null); state.screen = 'home'; releaseScreen(); music.pause(); render(); });

  on('[data-undo]', () => { session.undoSet(); render(); });
  on('[data-callit]', () => {
    const left = session.totalSets - session.doneSets;
    const s1 = session.doneSets === 1 ? 'set' : 'sets';
    if (!confirm('Finish the session now with ' + session.doneSets + ' ' + s1 + ' logged? ' + left + ' planned sets will be left undone.')) return;
    session.callItADay(); releaseScreen(); render();
  });

  on('[data-mtoggle]', () => { music.toggle(); render(); });
  on('[data-mnext]', () => { music.next(); render(); });
  on('[data-mopen]', el => { state.musicOpen = el.dataset.mopen === '1'; render(); });
  on('[data-mstation]', el => { music.pick(el.dataset.mstation); state.musicOpen = false; render(); });
  on('[data-mcustom]', () => {
    const v = (document.getElementById('mcustom').value || '').trim();
    if (!/^https?:\/\//.test(v)) { alert('Paste a full stream address starting with http.'); return; }
    music.save({ custom: v });
    music.pick('custom');
    state.musicOpen = false;
    render();
  });
  const vol = app.querySelector('[data-mvol]');
  if (vol) vol.addEventListener('input', () => {
    music.setVolume(Number(vol.value) / 100);
    const pc = document.getElementById('musicpct');
    if (pc) pc.textContent = vol.value + '%';
  });
  on('[data-mvoljump]', el => { music.setVolume(Number(el.dataset.mvoljump) / 100); render(); });

  on('[data-weight]', el => {
    const ex = session.exercise;
    session.setWeight(ex.id, session.weight(ex.id) + Number(el.dataset.weight) * WEIGHT_STEP);
    render();
  });
  on('[data-repsbump]', el => {
    const ex = session.exercise;
    session.setReps(ex.id, session.reps(ex.id) + Number(el.dataset.repsbump));
    render();
  });
}

/* ---------- clock ---------- */

function beep(freq, len) {
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const ctx = new C();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq || 660; o.connect(g); g.connect(ctx.destination);
    const d = len || 0.35;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + d);
    o.start(); o.stop(ctx.currentTime + d + 0.01);
  } catch (e) { /* no audio, no problem */ }
}

function applause() {
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const ctx = new C();
    const out = ctx.createGain();
    out.gain.value = 0.5;
    out.connect(ctx.destination);

    /* A clap is a short burst of filtered noise. A crowd is a lot of them,
       swelling and then thinning out. */
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.5);

    const now = ctx.currentTime;
    for (let i = 0; i < 90; i++) {
      const t = now + Math.random() * 1.8;
      const swell = Math.min(1, (t - now) / 0.35) * Math.max(0.15, 1 - (t - now) / 2.2);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 1100 + Math.random() * 2600;
      bp.Q.value = 0.7;
      const g = ctx.createGain();
      g.gain.value = (0.05 + Math.random() * 0.09) * swell;
      src.connect(bp); bp.connect(g); g.connect(out);
      src.start(t);
    }

    /* Three notes over the top so it reads as a win, not just noise. */
    [523.25, 659.25, 783.99].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      const t = now + i * 0.11;
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t + 0.6);
    });
  } catch (e) { /* no audio, no problem */ }
}

let lastBeep = null;
let lastCd = null;
let lastFlush = 0;

setInterval(() => {
  if (state.screen === 'countdown' && state.pending) {
    const left = (state.cdEnd - Date.now()) / 1000;
    const n = Math.max(0, Math.ceil(left));
    const el = document.getElementById('cdnum');
    if (el && el.textContent !== String(n)) el.textContent = n;
    if (n !== lastCd) { lastCd = n; if (n > 0) beep(n <= 3 ? 760 : 520, 0.16); }
    if (left <= 0) { beep(980, 0.5); beginSession(state.pending.dk, state.pending.idx); }
    return;
  }

  const s = document.getElementById('syncstate');
  if (s) {
    s.textContent = syncLabel();
    s.classList.toggle('is-pending', sync.pending());
  }
  /* Retry anything stuck in the queue every half minute. */
  if (sync.pending() && Date.now() - lastFlush > 30000) { lastFlush = Date.now(); sync.flush(); }
  if (!session.data || session.data.phase === 'done') return;

  const el = document.getElementById('elapsed');
  if (el) el.textContent = clock(session.elapsed);
  const mv = document.getElementById('motivate');
  if (mv) mv.textContent = session.motivation();

  if (session.data.phase === 'cheer' && session.data.cheerEndsAt) {
    const left = session.cheerLeft();
    const cc = document.getElementById('cheercount');
    const n = Math.max(0, Math.ceil(left));
    if (cc && cc.textContent !== String(n)) cc.textContent = n;
    if (left <= 0) { session.nextExercise(); render(); }
    return;
  }

  if (session.data.phase === 'rest') {
    const left = session.restLeft();
    const rc = document.getElementById('restcount');
    if (rc) rc.textContent = clock(left);
    const w = Math.ceil(left);
    if (w <= 3 && w >= 1 && lastBeep !== w) { lastBeep = w; beep(760, 0.16); }
    if (left <= 0) { lastBeep = null; session.skipRest(); render(); }
  }
}, 500);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  sync.flush();
  if (Date.now() - remote.lastPull > 120000) remote.pull();
  if (state.screen === 'run' && session.data) holdScreen();
  render();
});

loadCustomCardio();
session.load();
if (session.data && session.data.phase !== 'done') { state.screen = 'run'; holdScreen(); }
sync.flush();
remote.onchange = () => render();
remote.pull();
render();

</script>
