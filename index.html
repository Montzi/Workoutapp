<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dumbbelly</title>
<meta name="description" content="Dumbbelly. Simple workouts. Real results.">
<meta name="theme-color" content="#080b10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080b10;
  --panel: #10151d;
  --panel-2: #161d27;
  --line: #232c38;
  --line-soft: #1a222c;
  --white: #ffffff;
  --text: #e8edf3;
  --muted: #8695a8;
  --blue: #1e9bff;
  --blue-deep: #0d6fd1;
  --blue-glow: rgba(30, 155, 255, 0.28);
  --radius: 12px;
  --radius-sm: 8px;
  --pad: 18px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Archivo, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100dvh; display: flex; justify-content: center;
  background-image: radial-gradient(120% 60% at 50% -10%, #14202e 0%, var(--bg) 62%);
  background-attachment: fixed;
}

#app { width: 100%; max-width: 480px; padding: 0 var(--pad) 80px; }

button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
img { max-width: 100%; display: block; }

/* ---------- top bar ---------- */

.welcome {
  position: sticky; top: 0; z-index: 20;
  background: linear-gradient(180deg, var(--bg) 76%, rgba(8, 11, 16, 0));
  padding: 14px 0 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
}

.hello {
  margin: 0; font-size: 14px; font-variation-settings: 'wdth' 104, 'wght' 600; color: var(--text);
  flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sync-state { margin: 0; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }

.live {
  flex: 0 1 auto; min-width: 0; max-width: 62%;
  display: flex; flex-direction: column; align-items: flex-end; gap: 1px;
}

.live-clock {
  font-size: 18px; font-variation-settings: 'wdth' 112, 'wght' 800;
  font-variant-numeric: tabular-nums; color: var(--blue);
  background: rgba(30, 155, 255, 0.12);
  border: 1px solid rgba(30, 155, 255, 0.28);
  border-radius: 999px; padding: 2px 12px;
}

.live-msg { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- brand ---------- */

.masthead { display: flex; align-items: flex-end; justify-content: space-between; padding: 6px 0 16px; gap: 12px; }

.wordmark {
  font-variation-settings: 'wdth' 118, 'wght' 800;
  font-size: 27px; line-height: 1; letter-spacing: -0.02em; color: var(--white);
}

.wordmark em { font-style: normal; color: var(--blue); }

.tagline {
  margin: 5px 0 0; font-size: 9px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--muted);
}

.datestamp {
  padding: 0; font-size: 12px; color: var(--muted); text-align: right;
  border-bottom: 1px solid var(--line); padding-bottom: 2px;
}

/* ---------- week band ---------- */

.band {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  padding: 12px 12px 13px; margin-bottom: 14px;
}

.band-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 10px; font-size: 11px; color: var(--muted); }
.band-week { font-variation-settings: 'wdth' 110, 'wght' 750; color: var(--white); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
.band-grid { display: flex; gap: 5px; }

.band-day {
  flex: 1 1 0; min-width: 0; text-align: center;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.02); padding: 6px 1px 7px; min-height: 58px;
}

.band-day .bd-w { display: block; font-size: 9px; color: var(--muted); letter-spacing: 0.06em; }
.band-day .bd-n { display: block; font-size: 14px; font-variant-numeric: tabular-nums; color: var(--text); margin-top: 1px; }
.band-day .bd-tick { display: block; font-size: 14px; line-height: 1.1; color: var(--blue); }
.band-day.is-today { border-color: var(--blue); box-shadow: 0 0 0 1px rgba(30, 155, 255, 0.25) inset; }
.band-day.is-done { background: linear-gradient(180deg, var(--blue), var(--blue-deep)); border-color: transparent; }
.band-day.is-done .bd-w, .band-day.is-done .bd-n, .band-day.is-done .bd-tick { color: #fff; }

/* ---------- hero ---------- */

.hero {
  position: relative; overflow: hidden;
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px 18px 18px;
}

.hero::after {
  content: ''; position: absolute; inset: 0 0 auto 0; height: 2px;
  background: linear-gradient(90deg, var(--blue), transparent 70%);
}

.hero.is-rest { background: none; border-style: dashed; }
.hero.is-rest::after { background: linear-gradient(90deg, var(--line), transparent 60%); }
.hero.is-done { border-color: rgba(30, 155, 255, 0.4); }

.hero-mark {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 54px; height: 54px; padding: 0 12px;
  border-radius: var(--radius-sm);
  background: linear-gradient(180deg, var(--blue), var(--blue-deep));
  color: #fff; font-size: 30px; line-height: 1;
  font-variation-settings: 'wdth' 118, 'wght' 800;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 6px 18px -6px var(--blue-glow);
}

.hero.is-rest .hero-mark { background: none; border: 1px solid var(--line); color: var(--muted); font-size: 17px; }

.hero-title { font-variation-settings: 'wdth' 110, 'wght' 750; font-size: 27px; line-height: 1.08; margin: 14px 0 4px; color: var(--white); }
.hero-groups { color: var(--muted); font-size: 14px; margin: 0 0 3px; }
.hero-count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; margin: 0; }
.hero-count b { color: var(--blue); font-variation-settings: 'wght' 700; }
.hero-actions { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
.hero-actions + .hero-actions { margin-top: 8px; }

/* ---------- buttons ---------- */

.btn {
  background: linear-gradient(180deg, var(--blue), var(--blue-deep));
  color: #fff; border-radius: var(--radius-sm); padding: 14px 20px;
  font-variation-settings: 'wdth' 104, 'wght' 700;
  font-size: 15px; min-height: 52px; flex: 1 1 auto;
  box-shadow: 0 8px 22px -10px var(--blue-glow);
}

.btn:active { transform: translateY(1px); }
.btn[disabled] { background: var(--panel-2); color: var(--muted); box-shadow: none; }

.btn-quiet {
  background: rgba(255, 255, 255, 0.03); color: var(--text);
  border: 1px solid var(--line); box-shadow: none;
}

.btn-quiet:active { background: rgba(255, 255, 255, 0.07); }

.linky { display: block; width: 100%; text-align: center; color: var(--muted); font-size: 13px; padding: 14px 0; min-height: 44px; }

/* ---------- resume ---------- */

.resume {
  width: 100%; display: flex; justify-content: space-between; align-items: center;
  background: linear-gradient(90deg, rgba(30, 155, 255, 0.16), rgba(30, 155, 255, 0.04));
  border: 1px solid rgba(30, 155, 255, 0.35);
  border-radius: var(--radius); padding: 13px 16px; margin-bottom: 14px;
  font-size: 13px; min-height: 52px; text-align: left; color: var(--text);
}

.resume-go { font-variation-settings: 'wght' 700; color: var(--blue); }

/* ---------- split switch ---------- */

.switch {
  display: flex; margin: 18px 0 4px; padding: 3px; gap: 3px;
  border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--panel);
}

.switch button { flex: 1; padding: 11px 8px; font-size: 14px; color: var(--muted); min-height: 46px; border-radius: 6px; }
.switch button[aria-pressed="true"] { background: linear-gradient(180deg, var(--blue), var(--blue-deep)); color: #fff; font-variation-settings: 'wght' 700; }
.switch-note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }

/* ---------- week strip ---------- */

.week { display: flex; gap: 5px; margin: 20px 0 8px; }

.week-day {
  flex: 1 1 0; min-width: 0; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--panel); padding: 8px 2px 9px; text-align: center; min-height: 60px;
}

.week-day .wd { display: block; font-size: 10px; color: var(--muted); }
.week-day .wm { display: block; font-size: 17px; margin-top: 3px; font-variation-settings: 'wdth' 112, 'wght' 750; color: var(--text); }
.week-day.is-rest .wm { color: var(--line); }
.week-day.is-today { border-color: var(--blue); }
.week-day.is-logged .wm { color: var(--blue); }
.week-day[aria-pressed="true"] { background: linear-gradient(180deg, var(--blue), var(--blue-deep)); border-color: transparent; }
.week-day[aria-pressed="true"] .wd, .week-day[aria-pressed="true"] .wm { color: #fff; }

/* ---------- section head ---------- */

.section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 28px 0 12px; }
.section-head h2 { font-size: 12px; margin: 0; letter-spacing: 0.12em; text-transform: uppercase; color: var(--white); font-variation-settings: 'wght' 700; }
.section-head span { color: var(--muted); font-size: 12px; }

/* ---------- exercise cards ---------- */

.card {
  display: block; padding: 0; margin-bottom: 8px; overflow: hidden;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
}

.card-main {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 10px 14px 10px 8px; min-height: 74px;
}

.card-main:active { background: var(--panel-2); }
.card-thumb { width: 66px; flex: 0 0 66px; }
.card-tag { display: block; font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 2px; }
.card-body h3 { margin: 0; font-size: 15px; font-variation-settings: 'wdth' 104, 'wght' 650; color: var(--white); }
.card-body p { margin: 2px 0 0; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

.card-tools { display: flex; gap: 1px; border-top: 1px solid var(--line-soft); background: var(--line-soft); }
.card-tools button { flex: 0 0 auto; width: 54px; min-height: 40px; background: var(--panel); color: var(--text); font-size: 14px; }
.card-tools button[disabled] { color: #2c3644; }
.card-tools .tool-wide { flex: 1 1 auto; width: auto; font-size: 13px; color: var(--muted); }
.card-tools button:active { background: var(--panel-2); }

/* ---------- detail and runner ---------- */

.back { padding: 10px 0; color: var(--muted); font-size: 14px; min-height: 44px; }

.poster {
  position: relative; margin-top: 4px; border-radius: var(--radius);
  overflow: hidden; border: 1px solid var(--line); background: #000;
}

.poster img { width: 100%; height: auto; }
.poster .poster-fallback { display: none; }
.poster.is-missing img { display: none; }
.poster.is-missing .poster-fallback { display: block; background: var(--panel); }

.poster-zoom {
  position: absolute; right: 10px; bottom: 10px;
  background: rgba(8, 11, 16, 0.78); border: 1px solid var(--line);
  color: var(--text); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 8px 12px; border-radius: 999px; min-height: 34px;
  backdrop-filter: blur(6px);
}

.poster.is-missing .poster-zoom { display: none; }

.lightbox {
  position: fixed; inset: 0; z-index: 60; background: rgba(4, 6, 9, 0.94);
  display: flex; align-items: center; justify-content: center; padding: 12px;
  overflow: auto;
}

.lightbox img { max-width: 100%; height: auto; border-radius: 6px; }

.lightbox-close {
  position: fixed; top: 14px; right: 14px; z-index: 61;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--white);
  width: 44px; height: 44px; border-radius: 999px; font-size: 18px;
}

.detail-stage {
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--line); border-radius: var(--radius); padding: 6px; margin-top: 4px;
}

.detail-stage .figure { width: 100%; height: auto; display: block; }

.motion {
  display: flex; align-items: center; gap: 12px; margin-top: 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 14px 8px 8px;
}

.motion .figure { width: 96px; flex: 0 0 96px; height: auto; }
.motion-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 2px; }
.motion-text { margin: 0; font-size: 13px; color: var(--muted); }

.detail h1, .run-name {
  font-size: 28px; line-height: 1.06; margin: 18px 0 8px;
  font-variation-settings: 'wdth' 110, 'wght' 750; color: var(--white);
}

.chips-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 4px; }

.mchip {
  font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--text); background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 11px;
  font-variant-numeric: tabular-nums;
}

.mchip b { color: var(--blue); font-variation-settings: 'wght' 750; }

.detail-meta { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; margin: 0; }
.desc { font-size: 14px; margin: 14px 0 0; color: var(--muted); }

.panel {
  margin-top: 18px; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 16px;
}

.panel h2 {
  margin: 0 0 8px; font-size: 11px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--muted); font-variation-settings: 'wght' 700;
}

.cues { margin: 0; padding: 0; list-style: none; }
.cues li { padding: 9px 0 9px 20px; position: relative; font-size: 14px; color: var(--text); }
.cues li + li { border-top: 1px solid var(--line-soft); }
.cues li::before {
  content: ''; position: absolute; left: 0; top: 17px;
  width: 8px; height: 8px; border-radius: 2px; background: var(--blue);
}

.stage-note { margin-top: 20px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 12px; }

.run-top { display: flex; align-items: center; justify-content: space-between; }
.run-pos { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }

.bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 4px 0 6px; }
.bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--blue-deep), var(--blue)); transition: width 0.3s ease; }
.bar.is-set { height: 9px; border-radius: 5px; }
.bar-note { margin: 0 0 12px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

.set-count { margin: 16px 0 8px; font-size: 17px; color: var(--muted); }
.set-count strong { font-size: 32px; font-variation-settings: 'wdth' 114, 'wght' 800; color: var(--blue); font-variant-numeric: tabular-nums; }

.cue-strip { color: var(--muted); font-size: 13px; text-align: center; margin: 14px 0 0; }

.weight {
  display: flex; align-items: center; justify-content: space-between;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel); margin-top: 16px; padding: 4px;
}

.weight button { width: 62px; min-height: 48px; font-size: 22px; color: var(--blue); }
.weight span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.weight strong { font-size: 22px; color: var(--white); font-variation-settings: 'wdth' 110, 'wght' 750; }

.rest { text-align: center; padding: 24px 0 8px; }
.rest-label { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
.rest-clock {
  margin: 4px 0 6px; font-size: 68px; line-height: 1;
  font-variation-settings: 'wdth' 114, 'wght' 800;
  font-variant-numeric: tabular-nums; color: var(--blue);
  text-shadow: 0 0 40px var(--blue-glow);
}
.rest-next { margin: 0; color: var(--muted); font-size: 13px; }

/* ---------- muscle map ---------- */

.mmap { margin-top: 14px; }
.mmap-svg { width: 100%; height: auto; display: block; max-height: 190px; }
.mm-base { fill: #263140; opacity: 0.9; }
.mm-second { fill: var(--blue); opacity: 0.34; }
.mm-first { fill: var(--blue); }
.mm-cap { fill: var(--muted); font-size: 7px; text-anchor: middle; font-family: inherit; }
.mmap-key { margin-top: 8px; }
.mm-line { margin: 2px 0; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
.mm-dot { width: 9px; height: 9px; border-radius: 2px; flex: 0 0 9px; }
.mm-dot.is-first { background: var(--blue); }
.mm-dot.is-second { background: var(--blue); opacity: 0.34; }

/* ---------- figures ---------- */

.fig-prop { stroke: #2b3543; stroke-linecap: round; }
.fig-far { stroke: #55647a; stroke-linecap: round; opacity: 0.5; }
.fig-near, .fig-torso { stroke: #dbe3ec; stroke-linecap: round; }
.fig-head { fill: #dbe3ec; }
.fig-bell rect { fill: var(--blue); }

.bd-prop { stroke: #2b3543; stroke-linecap: round; }
.bd-fill { fill: #38434f; stroke: #55636f; stroke-width: 0.8; stroke-linejoin: round; }
.bd-far { fill: #232c36; stroke: #333f4b; stroke-width: 0.7; stroke-linejoin: round; }
.bd-neck { stroke: #38434f; stroke-linecap: round; }
.bd-hl { stroke: none; }
.bd-hl.is-first { fill: var(--blue); opacity: 0.95; }
.bd-hl.is-second { fill: var(--blue); opacity: 0.36; }
.bd-bell rect { fill: #dbe3ec; }

/* ---------- day mover, group editor ---------- */

.mover, .groups {
  margin-top: 12px; padding: 14px 14px 8px;
  border: 1px solid rgba(30, 155, 255, 0.34); border-radius: var(--radius);
  background: var(--panel);
}

.mover-head { margin: 0 0 10px; font-size: 14px; font-variation-settings: 'wght' 650; color: var(--white); }
.mover-grid { display: flex; flex-wrap: wrap; gap: 6px; }

.mover-day {
  flex: 1 1 30%; min-width: 96px; text-align: left;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 8px 10px; min-height: 54px; background: rgba(255, 255, 255, 0.02);
}

.mover-day[disabled] { opacity: 0.35; }
.mv-name { display: block; font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.mv-what { display: block; font-size: 13px; font-variation-settings: 'wght' 650; color: var(--text); }
.mover-foot { display: flex; gap: 8px; }
.mover-foot .linky { flex: 1; }

.groups h3 { margin: 0 0 4px; font-size: 14px; font-variation-settings: 'wght' 700; color: var(--white); }
.groups p.hint { margin: 0 0 10px; font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.chip {
  border: 1px solid var(--line); border-radius: 999px;
  padding: 9px 14px; min-height: 42px; font-size: 13px;
  background: rgba(255, 255, 255, 0.02); color: var(--text);
}

.chip[aria-pressed="true"] {
  background: linear-gradient(180deg, var(--blue), var(--blue-deep));
  color: #fff; border-color: transparent; font-variation-settings: 'wght' 650;
}

.cardio-form { margin-top: 12px; border-top: 1px solid var(--line-soft); padding-top: 12px; }
.cardio-form label { display: block; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
.cardio-row { display: flex; gap: 8px; }

.cardio-form input {
  font: inherit; padding: 11px 12px; min-height: 46px;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--bg); color: var(--text); width: 100%;
}

.cardio-form input::placeholder { color: #566373; }
.cardio-form input.mins { flex: 0 0 92px; text-align: center; }
.cardio-form .btn { flex: 0 0 auto; min-height: 46px; padding: 0 18px; }

/* ---------- history and day log ---------- */

.hists { list-style: none; margin: 8px 0 0; padding: 0; }
.hist { display: flex; gap: 10px; align-items: baseline; padding: 11px 0; border-top: 1px solid var(--line-soft); font-size: 13px; }
.hist-date { flex: 0 0 82px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hist-title { flex: 1 1 auto; font-variation-settings: 'wght' 650; color: var(--text); }
.hist-meta { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.hist-empty { color: var(--muted); }

.logrow { display: flex; gap: 10px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line-soft); font-size: 14px; }
.logrow-n { flex: 0 0 24px; color: var(--muted); font-variant-numeric: tabular-nums; }
.logrow-name { flex: 1 1 auto; color: var(--text); }
.logrow-meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.logrow-mark { color: var(--blue); font-size: 11px; }

/* ---------- muscle group sections ---------- */

.gsec { margin-bottom: 20px; }

.gsec-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 0 2px 9px; margin-bottom: 9px; border-bottom: 1px solid var(--line);
}

.gsec-name {
  margin: 0; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--blue); font-variation-settings: 'wght' 750;
}

.gsec-meta { margin: 1px 0 0; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.gsec-tools { display: flex; gap: 6px; }

.gsec-tools button {
  border: 1px solid var(--line); border-radius: 999px;
  padding: 7px 13px; min-height: 36px; font-size: 12px; color: var(--muted);
  background: rgba(255, 255, 255, 0.02);
}

.gsec-tools button:active { background: rgba(255, 255, 255, 0.07); }

.gsec-swap {
  margin: 0 0 10px; padding: 12px; border-radius: var(--radius);
  border: 1px solid rgba(30, 155, 255, 0.34); background: var(--panel);
}

.hint { margin: 0 0 8px; font-size: 12px; color: var(--muted); }

/* ---------- manual log entry ---------- */

.logrow-x {
  flex: 0 0 34px; width: 34px; min-height: 34px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted); font-size: 16px; line-height: 1;
}

.mins-read {
  flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;
}

.mins-read strong { font-size: 26px; color: var(--white); font-variation-settings: 'wdth' 110, 'wght' 750; margin-right: 6px; }

/* ---------- avatar ---------- */

.hero-avatar {
  position: absolute; top: 0; right: 0; height: 152px; width: auto;
  object-fit: cover; object-position: top center;
  pointer-events: none; user-select: none;
  -webkit-mask-image: linear-gradient(to left, #000 46%, transparent 96%),
                      linear-gradient(to top, transparent 2%, #000 24%);
  -webkit-mask-composite: source-in;
          mask-image: linear-gradient(to left, #000 46%, transparent 96%),
                      linear-gradient(to top, transparent 2%, #000 24%);
          mask-composite: intersect;
  opacity: 0.95;
}

.hero .hero-title, .hero .hero-groups, .hero .hero-count { padding-right: 126px; }
.hero.is-rest .hero-avatar { opacity: 0.4; }

@media (max-width: 360px) {
  .hero-avatar { height: 124px; }
  .hero .hero-title, .hero .hero-groups, .hero .hero-count { padding-right: 100px; }
}

/* ---------- countdown ---------- */

.cd { text-align: center; padding: 46px 0 20px; }
.cd-label { margin: 0; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }

.cd-num {
  margin: 6px 0 10px; font-size: 132px; line-height: 1;
  font-variation-settings: 'wdth' 114, 'wght' 800;
  font-variant-numeric: tabular-nums; color: var(--blue);
  text-shadow: 0 0 60px var(--blue-glow);
}

.cd-next { margin: 0 0 26px; color: var(--muted); font-size: 14px; }

/* ---------- music ---------- */

.music {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel); padding: 8px 10px; margin-bottom: 12px;
}

.music-row { display: flex; align-items: center; gap: 8px; }
.music-row + .music-row { margin-top: 6px; }

.music-btn {
  flex: 0 0 42px; width: 42px; min-height: 42px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--text); font-size: 13px;
  background: rgba(255, 255, 255, 0.03);
}

.music-btn.is-play { background: linear-gradient(180deg, var(--blue), var(--blue-deep)); border-color: transparent; color: #fff; }
.music-now { flex: 1 1 auto; min-width: 0; text-align: left; padding: 2px 4px; }
.music-name { display: block; font-size: 13px; font-variation-settings: 'wght' 650; color: var(--white); }
.music-sub { display: block; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.music-vol-i { flex: 0 0 42px; text-align: center; color: var(--muted); font-size: 13px; }

.music-vol {
  flex: 1 1 auto; -webkit-appearance: none; appearance: none;
  height: 30px; background: none; margin: 0;
}

.music-vol::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--line); }
.music-vol::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 18px; height: 18px; margin-top: -7px;
  border-radius: 999px; background: var(--blue); border: none;
}
.music-vol::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
.music-vol::-moz-range-thumb { width: 18px; height: 18px; border: none; border-radius: 999px; background: var(--blue); }

.music-picker { margin-top: 10px; border-top: 1px solid var(--line-soft); padding-top: 10px; }

/* ---------- undo and finish early ---------- */

.linky.undo { color: var(--blue); }

.callit {
  display: block; width: 100%; text-align: center;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.02); color: var(--muted);
  font-size: 12px; padding: 10px; min-height: 40px; margin: 6px 0 10px;
}

.callit:active { background: rgba(255, 255, 255, 0.06); }

/* ---------- manual entry items ---------- */

.mitem { padding: 12px 0; border-top: 1px solid var(--line-soft); }
.mitem:first-child { border-top: none; padding-top: 2px; }
.mitem-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mitem-name { font-size: 14px; color: var(--text); font-variation-settings: 'wght' 600; }
.logrow-sub { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
.mitem-rows { display: flex; gap: 8px; margin-top: 8px; }

.stepper {
  flex: 1 1 0; display: flex; align-items: center; justify-content: space-between;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.02); padding: 2px;
}

.stepper button { width: 44px; min-height: 40px; font-size: 19px; color: var(--blue); }
.stepper span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stepper strong { font-size: 16px; color: var(--white); font-variation-settings: 'wght' 700; }
.stepper.is-flat { justify-content: center; min-height: 44px; }
.chip.is-day { min-width: 62px; text-align: center; justify-content: center; }

/* ---------- future days, panel headers ---------- */

.band-note { margin: 9px 0 0; font-size: 11px; color: var(--muted); text-align: center; }
.band-day.is-future { opacity: 0.38; cursor: default; }
.band-day.is-future .bd-n { color: var(--muted); }

.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.panel-head > :first-child { flex: 1 1 auto; }

.panel-x {
  flex: 0 0 34px; width: 34px; min-height: 34px; margin-top: -2px;
  border: 1px solid var(--line); border-radius: 999px;
  color: var(--muted); font-size: 17px; line-height: 1;
  background: rgba(255, 255, 255, 0.02);
}

.panel-x:active { background: rgba(255, 255, 255, 0.08); }
.sync-state { padding: 4px 0 4px 8px; }
.sync-state.is-pending { color: var(--blue); }

/* ---------- resting ---------- */

.detail-stage.is-rest { background: linear-gradient(180deg, #101c2a, var(--panel)); }
.detail-stage.is-rest .bd-fill { fill: #33404d; stroke: #4c5c6c; }
.detail-stage.is-rest .bd-far { fill: #212b35; stroke: #2e3a45; }
.detail-stage.is-rest .bd-neck { stroke: #33404d; }

/* ---------- tester mode ---------- */

.tester {
  margin: 14px 0 4px; padding: 14px 16px 6px;
  border: 1px dashed rgba(30, 155, 255, 0.5); border-radius: var(--radius);
  background: rgba(30, 155, 255, 0.06);
}

.tester-t {
  margin: 0 0 4px; font-size: 11px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--blue); font-variation-settings: 'wght' 750;
}

.tester-s { margin: 0; font-size: 12px; color: var(--muted); }
.tester-link { margin-top: 26px; opacity: 0.55; font-size: 12px; }
.poster.is-compact { margin-top: 8px; }

/* ---------- the exercise is done ---------- */

.cheer { position: relative; padding: 18px 0 8px; text-align: center; overflow: hidden; }

.confetti { position: absolute; inset: -20px 0 0; pointer-events: none; overflow: hidden; }

.confetti i {
  position: absolute; top: -24px; display: block;
  animation-name: fall; animation-timing-function: linear; animation-iteration-count: 2;
}

@keyframes fall {
  0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
  8%   { opacity: 1; }
  85%  { opacity: 1; }
  100% { transform: translateY(420px) rotate(var(--spin, 540deg)); opacity: 0; }
}

.cheer-h {
  position: relative; margin: 8px 0 2px; font-size: 44px; line-height: 1;
  font-variation-settings: 'wdth' 116, 'wght' 800; color: var(--blue);
  text-shadow: 0 0 44px var(--blue-glow);
}

.cheer-sub { position: relative; margin: 0 0 20px; font-size: 13px; color: var(--muted); }

.upnext {
  position: relative; text-align: left;

.upnext-l {
  margin: 0 0 8px; font-size: 10px; letter-spacing: 0.14em;

.upnext-row { display: flex; align-items: center; gap: 12px; }
.upnext-fig { flex: 0 0 62px; width: 62px; }

.upnext-n { display: block; font-size: 17px; color: var(--white); font-variation-settings: 'wdth' 106, 'wght' 700; }
.upnext-m { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }

.cheer-cd { position: relative; margin: 16px 0 0; font-size: 13px; color: var(--muted); }

.cheer-cd strong {
  display: inline-block; min-width: 30px;
  font-size: 26px; color: var(--blue); font-variant-numeric: tabular-nums;
  font-variation-settings: 'wdth' 112, 'wght' 800; vertical-align: -3px;
}

.cheer .hero-actions { position: relative; }

@media (prefers-reduced-motion: reduce) {
  .confetti { display: none; }
}

  /* A picture that has not been uploaded yet is not a failure. The exercise

  if (e.target && e.target !== window && e.target.tagName) return;
  if (!e.message) return;
  var box = document.getElementById('boot');
  if (!box) { box = document.createElement('div'); box.id='boot';
    box.innerHTML='<h2>Dumbbelly could not start</h2>'; document.body.appendChild(box); }
  box.appendChild(document.createTextNode(e.message+'\n  line '+(e.lineno||'?')+'\n'));
}, true);

function shapeSVG(s, cls) {
  if (s[0] === 'c') return `<circle cx="${s[1]}" cy="${s[2]}" r="${s[3]}" class="${cls}"/>`;
  if (s[0] === 'e') return `<ellipse cx="${s[1]}" cy="${s[2]}" rx="${s[3]}" ry="${s[4]}" class="${cls}"/>`;
  return `<rect x="${s[1]}" y="${s[2]}" width="${s[3]}" height="${s[4]}" rx="${s[5]}" class="${cls}"/>`;
}

function muscleMap(muscles) {
  const primary = muscles.primary || [];
  const secondary = muscles.secondary || [];
  const base = BODY_BASE.map(s => shapeSVG(s, 'mm-base')).join('');

  const paint = (list, cls) => list
    .flatMap(m => (MUSCLE_SHAPES[m] || []).map(s => shapeSVG(s, cls)))
    .join('');

  const named = primary.map(m => MUSCLE_NAMES[m] || m).join(', ');
  const alsoNamed = secondary.map(m => MUSCLE_NAMES[m] || m).join(', ');

  return `

           aria-label="Muscles worked: ${named}${alsoNamed ? '. Also: ' + alsoNamed : ''}">
        ${base}
        ${paint(secondary, 'mm-second')}
        ${paint(primary, 'mm-first')}
        <text x="52" y="119" class="mm-cap">front</text>
        <text x="148" y="119" class="mm-cap">back</text>
      </svg>
      <div class="mmap-key">
        <p class="mm-line"><span class="mm-dot is-first"></span>${named}</p>
        ${alsoNamed ? `<p class="mm-line"><span class="mm-dot is-second"></span>${alsoNamed}</p>` : ''}
      </div>
    </div>`;
}


/* ===== figure.js ===== */
/* Draws an exercise as an SVG figure and animates it between its two poses.
   One requestAnimationFrame loop drives every figure on the page. */

const JOINT_LINES = [
  ['far', 'shoulder', 'elbow'], ['far', 'elbow', 'hand'],
  ['far', 'hip', 'knee'], ['far', 'knee', 'foot'],
  ['near', 'shoulder', 'elbow'], ['near', 'elbow', 'hand'],
  ['near', 'hip', 'knee'], ['near', 'knee', 'foot']
];

function mergePose(base, over) {
  if (!over) return base;
  const out = {
    props: base.props,
    head: over.head || base.head,
    neck: over.neck || base.neck,
    hip: over.hip || base.hip,
    near: Object.assign({}, base.near, over.near || {}),
    far: Object.assign({}, base.far, over.far || {}),
    db: over.db || base.db
  };
  return out;
}

const lerp = (a, b, t) => a + (b - a) * t;
const lerpPt = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];

function poseAt(ex, t) {
  const a = ex.pose;
  const b = mergePose(ex.pose, ex.end);
  const side = s => {
    const o = {};
    ['shoulder', 'elbow', 'hand', 'knee', 'foot'].forEach(j => {
      if (a[s][j]) o[j] = lerpPt(a[s][j], b[s][j] || a[s][j], t);
    });
    return o;
  };
  return {
    props: a.props,
    head: lerpPt(a.head, b.head, t),
    neck: lerpPt(a.neck, b.neck, t),
    hip: lerpPt(a.hip, b.hip, t),
    near: side('near'),
    far: side('far'),
    db: a.db.map((d, i) => {
      const e = (b.db && b.db[i]) || d;
      return [lerp(d[0], e[0], t), lerp(d[1], e[1], t), lerp(d[2] || 0, e[2] || 0, t)];
    })
  };
}

function figureSVG(ex, opts) {
  const o = opts || {};
  const p = ex.pose;
  const props = (p.props || [])
    .map(q => `<line x1="${q.p1[0]}" y1="${q.p1[1]}" x2="${q.p2[0]}" y2="${q.p2[1]}" class="fig-prop" stroke-width="7"/>`)
    .join('');

  const limbs = JOINT_LINES.map(([side, from, to]) => {
    if (!p[side][to]) return '';
    const cls = side === 'near' ? 'fig-near' : 'fig-far';
    const w = side === 'near' ? 5.5 : 5;
    return `<line data-j="${side}.${from}.${to}" class="${cls}" stroke-width="${w}" x1="0" y1="0" x2="0" y2="0"/>`;
  }).join('');

  const bells = p.db
    .map((d, i) => `<g data-db="${i}" class="fig-bell">
      <rect x="-7" y="-1.4" width="14" height="2.8" rx="1.2"/>
      <rect x="-11.5" y="-5" width="5" height="10" rx="1.6"/>
      <rect x="6.5" y="-5" width="5" height="10" rx="1.6"/>
    </g>`).join('');

  return `<svg viewBox="0 0 140 124" class="figure" data-ex="${ex.id}" data-phase="${o.phase || 0}"
    role="img" aria-label="${ex.name} technique" xmlns="http://www.w3.org/2000/svg">
    ${props}
    ${limbs.replace(/data-j="far/g, 'data-j="far')}
    <line data-j="torso.far" class="fig-far" stroke-width="5" x1="0" y1="0" x2="0" y2="0"/>
    <line data-j="torso.near" class="fig-torso" stroke-width="8" x1="0" y1="0" x2="0" y2="0"/>
    <circle data-j="head" class="fig-head" r="8" cx="0" cy="0"/>
    ${bells}
  </svg>`;
}

/* ---------- animation loop ---------- */

function paintFigure(svg, ex, t) {
  const p = poseAt(ex, t);
  svg.querySelectorAll('[data-j]').forEach(el => {
    const j = el.dataset.j;
    if (j === 'head') { el.setAttribute('cx', p.head[0]); el.setAttribute('cy', p.head[1]); return; }
    if (j === 'torso.near' || j === 'torso.far') {
      el.setAttribute('x1', p.neck[0]); el.setAttribute('y1', p.neck[1]);
      el.setAttribute('x2', p.hip[0]); el.setAttribute('y2', p.hip[1]);
      return;
    }
    const [side, from, to] = j.split('.');
    const a = from === 'hip' ? p.hip : p[side][from];
    const b = p[side][to];
    if (!a || !b) return;
    el.setAttribute('x1', a[0]); el.setAttribute('y1', a[1]);
    el.setAttribute('x2', b[0]); el.setAttribute('y2', b[1]);
  });
  svg.querySelectorAll('[data-db]').forEach(g => {
    const d = p.db[Number(g.dataset.db)];
    if (d) g.setAttribute('transform', `translate(${d[0].toFixed(2)} ${d[1].toFixed(2)}) rotate(${d[2].toFixed(2)})`);
  });
}

let animating = false;

function tickFigures(now) {
  const svgs = document.querySelectorAll('svg.figure');
  svgs.forEach(svg => {
    const ex = figureById(svg.dataset.ex);
    if (!ex) return;
    const period = (ex.tempo || 2.8) * 1000;
    const phase = Number(svg.dataset.phase) || 0;
    const u = (((now / period) + phase) % 1 + 1) % 1;
    const t = (1 - Math.cos(2 * Math.PI * u)) / 2;
    if (svg.dataset.kind === 'body') paintBody(svg, ex, t);
    else paintFigure(svg, ex, t);
  });
  requestAnimationFrame(tickFigures);
}

function startFigureLoop() {
  if (animating || typeof requestAnimationFrame !== 'function') return;
  animating = true;
  requestAnimationFrame(tickFigures);
}


/* ===== body.js ===== */
/* A fuller figure for the exercise screen. Same pose data as the stick figure,
   drawn as tapered filled limbs with the working muscles lit up. */

const BODY_SEGS = [
  { side: 'far',  a: 'shoulder', b: 'elbow', w: [8.5, 6.5], seg: 'upperArm' },
  { side: 'far',  a: 'elbow',    b: 'hand',  w: [6.5, 4.5], seg: 'forearm' },
  { side: 'far',  a: 'hip',      b: 'knee',  w: [12, 8.5],  seg: 'thigh' },
  { side: 'far',  a: 'knee',     b: 'foot',  w: [8.5, 5.5], seg: 'shin' },
  { side: 'near', a: 'hip',      b: 'knee',  w: [12.5, 9],  seg: 'thigh' },
  { side: 'near', a: 'knee',     b: 'foot',  w: [9, 6],     seg: 'shin' },
  { side: 'near', a: 'shoulder', b: 'elbow', w: [9, 7],     seg: 'upperArm' },
  { side: 'near', a: 'elbow',    b: 'hand',  w: [7, 5],     seg: 'forearm' }
];

/* Where each muscle sits along its segment, as a fraction from start to end. */
const MUSCLE_SEG = {
  biceps:     { seg: 'upperArm', t: [0.18, 0.82] },
  triceps:    { seg: 'upperArm', t: [0.18, 0.82] },
  forearm:    { seg: 'forearm',  t: [0.08, 0.70] },
  quads:      { seg: 'thigh',    t: [0.12, 0.88] },
  hamstrings: { seg: 'thigh',    t: [0.12, 0.88] },
  calves:     { seg: 'shin',     t: [0.05, 0.60] },
  frontDelt:  { seg: 'torso',    t: [0.00, 0.17] },
  sideDelt:   { seg: 'torso',    t: [0.00, 0.17] },
  rearDelt:   { seg: 'torso',    t: [0.00, 0.17] },
  traps:      { seg: 'torso',    t: [0.00, 0.22] },
  chest:      { seg: 'torso',    t: [0.10, 0.44] },
  lats:       { seg: 'torso',    t: [0.20, 0.60] },
  abs:        { seg: 'torso',    t: [0.46, 0.86] },
  obliques:   { seg: 'torso',    t: [0.46, 0.86] },
  lowerBack:  { seg: 'torso',    t: [0.56, 0.90] },
  glutes:     { seg: 'torso',    t: [0.80, 1.00] }
};

const TORSO_W = [18, 13.5];

function highlightPlan(ex) {
  const out = [];
  const seen = new Set();
  const add = (list, rank) => list.forEach(m => {
    const spec = MUSCLE_SEG[m];
    if (!spec) return;
    const targets = spec.seg === 'torso' ? [{ side: null, seg: 'torso' }]
      : [{ side: 'near', seg: spec.seg }, { side: 'far', seg: spec.seg }];
    targets.forEach(t => {
      const k = `${t.side}|${t.seg}|${spec.t[0]}|${spec.t[1]}|${rank}`;
      if (seen.has(k)) return;
      seen.add(k);
      out.push({ side: t.side, seg: t.seg, t: spec.t, rank });
    });
  });
  add(ex.muscles.primary || [], 'first');
  add((ex.muscles.secondary || []).filter(m => !(ex.muscles.primary || []).includes(m)), 'second');
  return out;
}

function taper(a, b, wa, wb) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  return [
    [a[0] + nx * wa / 2, a[1] + ny * wa / 2],
    [b[0] + nx * wb / 2, b[1] + ny * wb / 2],
    [b[0] - nx * wb / 2, b[1] - ny * wb / 2],
    [a[0] - nx * wa / 2, a[1] - ny * wa / 2]
  ].map(p => p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' ');
}

const mixPt = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const mixNum = (a, b, t) => a + (b - a) * t;

function bodySegments(pose) {
  const out = [];
  BODY_SEGS.forEach(s => {
    const side = pose[s.side];
    const a = s.a === 'hip' ? pose.hip : side[s.a];
    const b = side[s.b];
    if (!a || !b) { out.push(null); return; }
    out.push({ a, b, wa: s.w[0], wb: s.w[1], side: s.side, seg: s.seg });
  });
  return out;
}

function bodySVG(ex) {
  const segs = bodySegments(ex.pose);
  const parts = [];

  parts.push(...(ex.pose.props || []).map(q =>
    `<line x1="${q.p1[0]}" y1="${q.p1[1]}" x2="${q.p2[0]}" y2="${q.p2[1]}" class="bd-prop" stroke-width="8"/>`));

  segs.forEach((s, i) => {
    if (!s) return;
    if (s.side !== 'far') return;
    if (s.seg === 'upperArm') parts.push(`<circle data-bcapseg="${i}" class="bd-far" r="4.8" cx="0" cy="0"/>`);
    parts.push(`<polygon data-bs="${i}" class="bd-far" points=""/>`);
    parts.push(`<circle data-bjoint="${i}" class="bd-far" r="${(s.wb / 2).toFixed(1)}" cx="0" cy="0"/>`);
  });

  parts.push('<polygon data-btorso="1" class="bd-fill" points=""/>');
  parts.push('<circle data-bcap="hip" class="bd-fill" r="7.5" cx="0" cy="0"/>');

  segs.forEach((s, i) => {
    if (!s || s.side !== 'near') return;
    if (s.seg === 'upperArm') parts.push(`<circle data-bcapseg="${i}" class="bd-fill" r="5.2" cx="0" cy="0"/>`);
    parts.push(`<polygon data-bs="${i}" class="bd-fill" points=""/>`);
    parts.push(`<circle data-bjoint="${i}" class="bd-fill" r="${(s.wb / 2).toFixed(1)}" cx="0" cy="0"/>`);
  });

  const plan = highlightPlan(ex);
  plan.forEach((h, k) => {
    parts.push(`<polygon data-bh="${k}" class="bd-hl is-${h.rank}" points=""/>`);
  });

  parts.push('<line data-bneck="1" class="bd-neck" stroke-width="11" x1="0" y1="0" x2="0" y2="0"/>');
  parts.push('<circle data-bhead="1" class="bd-fill" r="9.5" cx="0" cy="0"/>');

  (ex.pose.db || []).forEach((d, i) => parts.push(`<g data-db="${i}" class="bd-bell">
    <rect x="-8" y="-1.8" width="16" height="3.6" rx="1.4"/>
    <rect x="-13" y="-6" width="5.5" height="12" rx="1.8"/>
    <rect x="7.5" y="-6" width="5.5" height="12" rx="1.8"/>
  </g>`));

  return `<svg viewBox="0 0 140 124" class="figure bodyfig" data-ex="${ex.id}" data-kind="body"
    role="img" aria-label="${ex.name} technique" xmlns="http://www.w3.org/2000/svg">${parts.join('')}</svg>`;
}

function paintBody(svg, ex, t) {
  const p = poseAt(ex, t);
  const segs = bodySegments(p);

  svg.querySelectorAll('[data-bs]').forEach(el => {
    const s = segs[Number(el.dataset.bs)];
    if (s) el.setAttribute('points', taper(s.a, s.b, s.wa, s.wb));
  });

  svg.querySelectorAll('[data-bjoint]').forEach(el => {
    const s = segs[Number(el.dataset.bjoint)];
    if (s) { el.setAttribute('cx', s.b[0].toFixed(2)); el.setAttribute('cy', s.b[1].toFixed(2)); }
  });

  const torso = svg.querySelector('[data-btorso]');
  if (torso) torso.setAttribute('points', taper(p.neck, p.hip, TORSO_W[0], TORSO_W[1]));

  const hipCap = svg.querySelector('[data-bcap="hip"]');
  if (hipCap) { hipCap.setAttribute('cx', p.hip[0].toFixed(2)); hipCap.setAttribute('cy', p.hip[1].toFixed(2)); }

  svg.querySelectorAll('[data-bcapseg]').forEach(el => {
    const s = segs[Number(el.dataset.bcapseg)];
    if (s) { el.setAttribute('cx', s.a[0].toFixed(2)); el.setAttribute('cy', s.a[1].toFixed(2)); }
  });

  const plan = highlightPlan(ex);
  svg.querySelectorAll('[data-bh]').forEach(el => {
    const h = plan[Number(el.dataset.bh)];
    if (!h) return;
    let a, b, wa, wb;
    if (h.seg === 'torso') { a = p.neck; b = p.hip; wa = TORSO_W[0] * 0.72; wb = TORSO_W[1] * 0.72; }
    else {
      const s = segs.find(x => x && x.side === h.side && x.seg === h.seg);
      if (!s) { el.setAttribute('points', ''); return; }
      a = s.a; b = s.b; wa = s.wa * 0.62; wb = s.wb * 0.62;
    }
    const p0 = mixPt(a, b, h.t[0]), p1 = mixPt(a, b, h.t[1]);
    el.setAttribute('points', taper(p0, p1, mixNum(wa, wb, h.t[0]), mixNum(wa, wb, h.t[1])));
  });

  const neck = svg.querySelector('[data-bneck]');
  if (neck) {
    neck.setAttribute('x1', p.head[0]); neck.setAttribute('y1', p.head[1]);
    neck.setAttribute('x2', p.neck[0]); neck.setAttribute('y2', p.neck[1]);
  }
  const head = svg.querySelector('[data-bhead]');
  if (head) { head.setAttribute('cx', p.head[0]); head.setAttribute('cy', p.head[1]); }

  svg.querySelectorAll('[data-db]').forEach(g => {
    const d = p.db[Number(g.dataset.db)];
    if (d) g.setAttribute('transform', `translate(${d[0].toFixed(2)} ${d[1].toFixed(2)}) rotate(${d[2].toFixed(2)})`);
  });
}


/* ===== sync.js ===== */
/* Talks to the Google Apps Script web app.
   Everything is written locally first, then pushed. Nothing is lost if the phone drops signal. */

const SYNC_URL = 'https://script.google.com/macros/s/AKfycbzQjg4Y9UtO5RPVnd6PvoAlVgOFznJHgZI3vCRGfXoGYg1nCDz6qM72_gSOZMVWG8Yi/exec';

/* Tester mode. Anyone you send the link to gets their own sandbox: a separate
   storage area and no writes to your sheet at all. */
const TESTER = (function () {
  try {
    if (/(^|[?&#])tester\b/i.test(location.search + location.hash)) return true;
    return localStorage.getItem('rack.testerMode') === '1';
  } catch (e) { return false; }
})();

const STORE_PREFIX = TESTER ? 'rack.demo.' : 'rack.';

const store = {
  get(k, fallback) {
    try { const v = localStorage.getItem(STORE_PREFIX + k); return v === null ? fallback : JSON.parse(v); }
    catch (e) { return fallback; }
  },
  set(k, v) {
    try { localStorage.setItem(STORE_PREFIX + k, JSON.stringify(v)); } catch (e) { /* private mode */ }
  }
};

function setTesterMode(on) {
  try {
    if (on) localStorage.setItem('rack.testerMode', '1');
    else localStorage.removeItem('rack.testerMode');
  } catch (e) {}
  location.replace(location.pathname);
}

const sync = {
  status: 'idle',           // idle | sending | queued | offline
  onchange: null,

  queue() { return store.get('queue', []); },

  pending() { return this.queue().length > 0; },

  push(record) {
    if (TESTER) return;   // a tester never writes to the owner's sheet
    const q = this.queue();
    q.push(Object.assign({ athlete: ATHLETE, at: new Date().toISOString() }, record));
    store.set('queue', q);
    this.flush();
  },

  /* Remove the newest queued record that matches, if it has not gone out yet. */
  dropLast(match) {
    const q = this.queue();
    for (let i = q.length - 1; i >= 0; i--) {
      if (match(q[i])) { q.splice(i, 1); store.set('queue', q); return true; }
    }
    return false;
  },

  async flush() {
    if (TESTER) { this.set('idle'); return; }
    if (this.status === 'sending') return;
    let q = this.queue();
    if (!q.length) { this.set('idle'); return; }
    this.set('sending');
    while (q.length) {
      const ok = await this.send(q[0]);
      if (!ok) { this.set('queued'); return; }
      q = this.queue().slice(1);
      store.set('queue', q);
    }
    this.set('idle');
  },

  async send(record) {
    try {
      const res = await fetch(SYNC_URL, {
        method: 'POST',
        // text/plain keeps the browser from sending a preflight Apps Script cannot answer
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(record),
        redirect: 'follow'
      });
      return res.ok;
    } catch (e) {
      return false;
    }
  },

  set(s) {
    this.status = s;
    if (this.onchange) this.onchange(s);
  },

  label() {
    if (TESTER) return 'Not saving';
    const n = this.queue().length;
    if (n) return this.status === 'sending' ? 'Saving ' + n : n + ' to sync';
    if (this.status === 'sending') return 'Saving';
    return 'Saved';
  },

  /* Every send is retried until it lands. Nothing leaves the queue unacknowledged. */
  retry() { this.flush(); }
};

window.addEventListener('online', () => sync.flush());


/* ===== music.js ===== */
/* Background music. Live lo-fi streams, with a generated loop for when the
   gym wifi is useless. The audio element lives outside #app so re-rendering
   the screen never interrupts playback. */

const STATIONS = [
  { id: 'fluid',   name: 'Fluid',        by: 'SomaFM', desc: 'Instrumental hip hop, future soul', url: 'https://ice1.somafm.com/fluid-128-mp3' },
  { id: 'groove',  name: 'Groove Salad', by: 'SomaFM', desc: 'Chilled ambient downtempo',          url: 'https://ice1.somafm.com/groovesalad-128-mp3' },
  { id: 'blender', name: 'Beat Blender', by: 'SomaFM', desc: 'Deep house and downtempo',           url: 'https://ice1.somafm.com/beatblender-128-mp3' },
  { id: 'agent',   name: 'Secret Agent', by: 'SomaFM', desc: 'Spy jazz and lounge',                url: 'https://ice1.somafm.com/secretagent-128-mp3' },
  { id: 'drone',   name: 'Drone Zone',   by: 'SomaFM', desc: 'Slow ambient, no beat',              url: 'https://ice1.somafm.com/dronezone-128-mp3' },
  { id: 'builtin', name: 'Built in loop', by: 'No connection needed', desc: 'Generated on your phone', url: null }
];

const music = {
  el: null,
  gen: null,
  state: 'idle',        // idle | loading | playing | error
  onchange: null,

  prefs() {
    const p = store.get('music', {});
    return {
      station: p.station || STATIONS[0].id,
      volume: typeof p.volume === 'number' ? p.volume : 0.5,
      custom: p.custom || ''
    };
  },

  save(patch) { store.set('music', Object.assign(this.prefs(), patch)); },

  station() {
    const id = this.prefs().station;
    if (id === 'custom') {
      return { id: 'custom', name: 'Your stream', by: 'Custom', desc: this.prefs().custom, url: this.prefs().custom };
    }
    return STATIONS.find(s => s.id === id) || STATIONS[0];
  },

  audio() {
    if (!this.el) {
      this.el = new Audio();
      this.el.preload = 'none';
      this.el.crossOrigin = 'anonymous';
      this.el.addEventListener('playing', () => this.set('playing'));
      this.el.addEventListener('waiting', () => this.set('loading'));
      this.el.addEventListener('error', () => this.set('error'));
      document.body.appendChild(this.el);
    }
    return this.el;
  },

  set(s) { this.state = s; if (this.onchange) this.onchange(s); },

  play() {
    const st = this.station();
    this.setVolume(this.prefs().volume);
    if (!st.url) { this.stopStream(); this.startGenerated(); this.set('playing'); return; }
    this.stopGenerated();
    const a = this.audio();
    if (a.src !== st.url) a.src = st.url;
    this.set('loading');
    const p = a.play();
    if (p && p.catch) p.catch(() => this.set('error'));
  },

  pause() { this.stopStream(); this.stopGenerated(); this.set('idle'); },

  stopStream() { if (this.el) { this.el.pause(); } },

  toggle() { if (this.state === 'playing' || this.state === 'loading') this.pause(); else this.play(); },

  next() {
    const ids = STATIONS.map(s => s.id);
    const i = ids.indexOf(this.prefs().station);
    this.save({ station: ids[(i + 1) % ids.length] });
    if (this.state !== 'idle') this.play();
  },

  pick(id) {
    this.save({ station: id });
    this.play();
  },

  setVolume(v) {
    this.save({ volume: v });
    if (this.el) this.el.volume = v;
    if (this.gen) this.gen.master.gain.value = v * 0.5;
  },

  /* ---------- the generated loop ---------- */

  startGenerated() {
    if (this.gen) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) { this.set('error'); return; }
    const ctx = new C();
    const master = ctx.createGain();
    master.gain.value = this.prefs().volume * 0.5;
    master.connect(ctx.destination);

    const chords = [
      [220.00, 261.63, 329.63],   // Am
      [174.61, 220.00, 261.63],   // F
      [196.00, 246.94, 293.66],   // G
      [164.81, 196.00, 246.94]    // Em
    ];

    const pad = ctx.createGain();
    pad.gain.value = 0.0;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 700;
    filter.Q.value = 0.6;
    pad.connect(filter); filter.connect(master);

    const voices = [0, 1, 2].map(() => {
      const o = ctx.createOscillator();
      o.type = 'triangle';
      const g = ctx.createGain();
      g.gain.value = 0.28;
      o.connect(g); g.connect(pad);
      o.start();
      return o;
    });

    const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.4, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * (1 - i / nd.length);

    const beat = 60 / 74;   // 74 bpm, unhurried
    let step = 0;

    const tick = () => {
      const t = ctx.currentTime + 0.05;
      if (step % 8 === 0) {
        const ch = chords[(step / 8) % chords.length];
        voices.forEach((o, i) => o.frequency.setTargetAtTime(ch[i], t, 0.35));
        pad.gain.setTargetAtTime(0.5, t, 1.2);
        filter.frequency.setTargetAtTime(620 + Math.random() * 420, t, 2.0);
      }
      if (step % 4 === 0) {                       // kick
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.setValueAtTime(120, t);
        o.frequency.exponentialRampToValueAtTime(46, t + 0.13);
        g.gain.setValueAtTime(0.7, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
        o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.3);
      }
      if (step % 4 === 2) {                       // soft snare or rim
        const s = ctx.createBufferSource(); s.buffer = noiseBuf;
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1900;
        const g = ctx.createGain(); g.gain.value = 0.11;
        s.connect(bp); bp.connect(g); g.connect(master); s.start(t);
      }
      if (step % 2 === 1) {                       // hat
        const s = ctx.createBufferSource(); s.buffer = noiseBuf;
        const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
        const g = ctx.createGain(); g.gain.value = 0.045;
        s.connect(hp); hp.connect(g); g.connect(master); s.start(t);
      }
      step++;
    };

    tick();
    const timer = setInterval(tick, beat * 500);
    this.gen = { ctx, master, timer, voices };
    if (ctx.state === 'suspended') ctx.resume();
  },

  stopGenerated() {
    if (!this.gen) return;
    clearInterval(this.gen.timer);
    try { this.gen.ctx.close(); } catch (e) {}
    this.gen = null;
  },

  label() {
    if (this.state === 'error') return 'Could not connect';
    if (this.state === 'loading') return 'Connecting';
    if (this.state === 'playing') return 'Playing';
    return 'Paused';
  }
};


/* ===== runner.js ===== */
/* The workout runner. One exercise at a time, three sets, rest between them.
   The session clock starts on the first Start and never pauses, rests included. */

const WORK_SEC_PER_SET = 40;      // used only for the time estimate
const TRANSITION_SEC = 75;        // walking over, changing the bench, picking bells
const GRACE_SEC = 300;            // bathroom, water, someone using your rack

const CHEER_SEC = 10;

const CHEERS = [
  'Hurray!', 'Nice work!', 'That is the one!', 'Clean sweep!', 'Got it done!', 'Yes!'
];

const MOTIVATION = [
  'You got this', 'One set at a time', 'Own the last two reps', 'Slow on the way down',
  'Breathe, then go', 'Nobody is coming to lift it for you', 'This is the easy part',
  'Full range, every rep', 'Stay tight', 'Finish what you started', 'Better than yesterday',
  'The bells do not care how you feel'
];

function estimateSeconds(items) {
  let sec = 0;
  items.forEach(e => {
    if (e.cardio) { sec += (e.minutes || 30) * 60 + TRANSITION_SEC; return; }
    sec += e.sets * WORK_SEC_PER_SET;
    sec += (e.sets - 1) * GROUPS[e.group].rest;
    sec += TRANSITION_SEC;
  });
  return sec + GRACE_SEC;
}

function humanMinutes(sec) {
  const m = Math.round(sec / 60 / 5) * 5;
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}h ${r}m` : `${h}h`;
}

function clock(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
  const pad = n => String(n).padStart(2, '0');
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

/* ---------- session ---------- */

const session = {
  data: null,

  load() { this.data = store.get('active', null); return this.data; },
  save() { store.set('active', this.data); },

  start(dateKey, plan, order, startIdx) {
    this.data = {
      dateKey,
      mark: plan.mark,
      title: plan.title,
      groups: plan.groups,
      order: (order && order.length ? order.slice() : plan.groups.flatMap(byGroup).map(e => e.id)),
      idx: Math.min(Math.max(0, startIdx || 0), (order || []).length ? order.length - 1 : 0),
      phase: 'proposed',        // proposed | set | rest | done
      setsDone: 0,
      restEndsAt: null,
      startedAt: Date.now(),
      cheerEndsAt: null,
      cheerLine: '',
      logged: []
    };
    this.save();
  },

  get exercise() { return byId(this.data.order[this.data.idx]); },
  get elapsed() { return (Date.now() - this.data.startedAt) / 1000; },
  get totalSets() { return this.data.order.reduce((n, id) => n + byId(id).sets, 0); },
  get doneSets() { return this.data.logged.length; },

  weight(id) {
    const w = store.get('weights', {});
    return w[id] || 20;
  },
  setWeight(id, lb) {
    const w = store.get('weights', {});
    w[id] = Math.min(MAX_DUMBBELL, Math.max(WEIGHT_STEP, lb));
    store.set('weights', w);
  },

  motivation() {
    return MOTIVATION[Math.floor(this.elapsed / 25) % MOTIVATION.length];
  },

  accept() { this.data.phase = 'set'; this.save(); },

  swap() {
    const ex = this.exercise;
    const used = new Set(this.data.order);
    const alt = byGroup(ex.group).find(e => !used.has(e.id));
    if (!alt) return false;
    this.data.order[this.data.idx] = alt.id;
    this.data.setsDone = 0;
    this.save();
    return true;
  },

  logSet(ex, marked) {
    this.data.setsDone++;
    const entry = {
      exerciseId: ex.id, exerciseName: ex.name, group: ex.group,
      set: this.data.setsDone, reps: ex.reps, weight: ex.cardio ? '' : this.weight(ex.id),
      elapsedSec: Math.round(this.elapsed), marked: marked ? 'marked done' : ''
    };
    this.data.logged.push(entry);
    sync.push(Object.assign({ type: 'set', dateKey: this.data.dateKey, sessionTitle: this.data.title }, entry));
  },

  /* Mark the whole exercise done and move on. Logs every set still outstanding. */
  completeExercise() {
    const ex = this.exercise;
    while (this.data.setsDone < ex.sets) this.logSet(ex, true);
    this.nextExercise();
    this.save();
  },

  completeSet() {
    const ex = this.exercise;
    this.logSet(ex, false);

    if (this.data.setsDone >= ex.sets) {
      /* Every set on this exercise is in. Take a beat and celebrate it. */
      this.data.phase = 'cheer';
      this.data.cheerEndsAt = Date.now() + CHEER_SEC * 1000;
      this.data.cheerLine = CHEERS[Math.floor(Math.random() * CHEERS.length)];
      this.data.restEndsAt = null;
    } else {
      this.data.phase = 'rest';
      this.data.restEndsAt = Date.now() + GROUPS[ex.group].rest * 1000;
    }
    this.save();
  },

  /* Step back one set. Used when the weight was wrong or the tap was early. */
  undoSet() {
    const last = this.data.logged.pop();
    if (!last) return false;
    this.data.cheerEndsAt = null;
    sync.dropLast(r => r.type === 'set' && r.exerciseId === last.exerciseId && r.set === last.set);
    const at = this.data.order.indexOf(last.exerciseId);
    if (at >= 0) this.data.idx = at;
    this.data.setsDone = last.set - 1;
    this.data.phase = 'set';
    this.data.restEndsAt = null;
    this.save();
    return true;
  },

  /* End the session where it stands. Whatever is logged is what counts. */
  callItADay() {
    this.data.phase = 'done';
    this.data.restEndsAt = null;
    this.finish();
    this.save();
  },

  cheerLeft() {
    return this.data.cheerEndsAt ? (this.data.cheerEndsAt - Date.now()) / 1000 : 0;
  },

  holdCheer() { this.data.cheerEndsAt = null; this.save(); },

  get upNext() {
    const id = this.data.order[this.data.idx + 1];
    return id ? byId(id) : null;
  },

  nextExercise() {
    this.data.idx++;
    this.data.setsDone = 0;
    this.data.restEndsAt = null;
    this.data.cheerEndsAt = null;
    this.data.phase = this.data.idx >= this.data.order.length ? 'done' : 'proposed';
    if (this.data.phase === 'done') this.finish();
    this.save();
  },

  skipExercise() { this.nextExercise(); },

  addRest(sec) {
    if (this.data.restEndsAt) { this.data.restEndsAt += sec * 1000; this.save(); }
  },

  skipRest() {
    this.data.phase = 'set';
    this.data.restEndsAt = null;
    this.save();
  },

  restLeft() {
    return this.data.restEndsAt ? (this.data.restEndsAt - Date.now()) / 1000 : 0;
  },

  finish() {
    const d = this.data;
    const durationSec = Math.round((Date.now() - d.startedAt) / 1000);
    /* Name the session after what was actually trained, not what was planned. */
    const doneGroups = [...new Set(d.logged.map(l => l.group))];
    const groups = doneGroups.length ? doneGroups : d.groups;
    const title = doneGroups.length ? titleFor(doneGroups) : d.title;
    const log = store.get('log', {});
    log[d.dateKey] = {
      title, groups,
      durationSec, sets: d.logged.length,
      exercises: [...new Set(d.logged.map(l => l.exerciseName))],
      finishedAt: new Date().toISOString()
    };
    log[d.dateKey].entries = d.logged;
    store.set('log', log);
    sync.push({
      type: 'session', dateKey: d.dateKey, title, groups: groups.join('|'),
      durationSec, sets: d.logged.length,
      exercises: [...new Set(d.logged.map(l => l.exerciseName))].join('|')
    });
  },

  abandon() {
    if (this.data && this.data.logged.length) this.finish();
    this.data = null;
    store.set('active', null);
  }
};

/* ---------- dates ---------- */

function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const start = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - start) / 86400000 + 1) / 7);
}

const isoDay = d => ((d.getDay() + 6) % 7) + 1;
const key = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

function today() { const d = new Date(); d.setHours(12, 0, 0, 0); return d; }
function viewedDate() { return state.selected ? new Date(state.selected + 'T12:00:00') : today(); }
function weekOf(d) { const s = addDays(d, -(isoDay(d) - 1)); return Array.from({ length: 7 }, (_, i) => addDays(s, i)); }

const fmtLong = d => d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = d => d.toLocaleDateString(undefined, { weekday: 'long' });

/* ---------- the editable week ---------- */

function defaultPlanMap(n) {
  const m = {};
  DEFAULT_SPLITS[n].forEach(s => { m[s.weekday] = { mark: s.mark, title: s.title, groups: s.groups.slice() }; });
  return m;
}

const MARK_FIX = { A: '1', B: '2', C: '3' };

function plans() {
  const p = store.get('plans', {}) || {};
  let dirty = false;
  [3, 5, 'c'].forEach(n => {
    if (!p[n]) return;
    Object.keys(p[n]).forEach(wd => {
      const m = p[n][wd] && p[n][wd].mark;
      if (m && MARK_FIX[m]) { p[n][wd].mark = MARK_FIX[m]; dirty = true; }
    });
  });
  [3, 5, 'c'].forEach(n => { if (!p[n]) { p[n] = defaultPlanMap(n); dirty = true; } });
  if (dirty) store.set('plans', p);
  return p;
}

function scheduledFor(date) { return plans()[state.split][isoDay(date)] || null; }

function sessionFor(date) {
  const ov = store.get('overrides', {})[key(date)];
  if (ov && ov.disabled) return null;
  return ov || scheduledFor(date);
}

function isDisabled(date) {
  const ov = store.get('overrides', {})[key(date)];
  return !!(ov && ov.disabled);
}

function disableDay(dateKey) {
  const o = store.get('overrides', {});
  o[dateKey] = { disabled: true };
  store.set('overrides', o);
}

function titleFor(groups) {
  const n = groups.map(g => (GROUPS[g] ? GROUPS[g].name : g));
  if (n.length <= 1) return n[0] || '';
  if (n.length === 2) return n[0] + ' and ' + n[1];
  return n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1];
}

/* Adds or removes a muscle group from a day, and keeps the exercise order in step. */
function toggleGroup(date, group) {
  const dk = key(date);
  const overrides = store.get('overrides', {});
  const ov = overrides[dk];
  const scheduled = scheduledFor(date);
  const n = PER_GROUP[state.split] || 3;

  let plan;
  if (ov && !ov.disabled) plan = ov;
  else if (scheduled) plan = scheduled;
  else {
    overrides[dk] = { mark: '+', title: titleFor([group]), groups: [], activated: true };
    store.set('overrides', overrides);
    plan = overrides[dk];
  }

  let ids = orderFor(date).slice();
  const has = plan.groups.includes(group);

  if (has) {
    if (plan.groups.length === 1) return false;
    plan.groups = plan.groups.filter(g => g !== group);
    ids = ids.filter(id => byId(id).group !== group);
  } else {
    plan.groups = plan.groups.concat([group]);
    const take = group === 'cardio' ? 1 : n;
    byGroup(group).slice(0, take).forEach(e => { if (!ids.includes(e.id)) ids.push(e.id); });
  }

  plan.title = titleFor(plan.groups);
  if (ov && !ov.disabled) { overrides[dk] = plan; store.set('overrides', overrides); }
  else { const p = plans(); p[state.split][isoDay(date)] = plan; store.set('plans', p); }
  setOrder(date, ids);
  return true;
}

function addCardioToDay(date, id) {
  const dk = key(date);
  const ids = orderFor(date).slice();   // read the order before the plan changes under us
  const overrides = store.get('overrides', {});
  const scheduled = scheduledFor(date);
  let plan = (overrides[dk] && !overrides[dk].disabled) ? overrides[dk] : scheduled;
  if (!plan) {
    overrides[dk] = { mark: '+', title: 'Cardio', groups: ['cardio'], activated: true };
    store.set('overrides', overrides);
    plan = overrides[dk];
    setOrder(date, [id]);
    return;
  }
  if (!plan.groups.includes('cardio')) plan.groups = plan.groups.concat(['cardio']);
  plan.title = titleFor(plan.groups);
  if (overrides[dk] && !overrides[dk].disabled) { overrides[dk] = plan; store.set('overrides', overrides); }
  else { const p = plans(); p[state.split][isoDay(date)] = plan; store.set('plans', p); }
  if (!ids.includes(id)) ids.push(id);
  setOrder(date, ids);
}

function resetWeek() {
  const p = plans();
  p[state.split] = defaultPlanMap(state.split);
  store.set('plans', p);
  const o = store.get('orders', {});
  Object.keys(o).forEach(k => { if (k.indexOf('s' + state.split) === 0) delete o[k]; });
  store.set('orders', o);
}

function swapDays(wdA, wdB) {
  if (wdA === wdB) return;
  const p = plans();
  const map = p[state.split];
  const a = map[wdA] || null, b = map[wdB] || null;
  if (b) map[wdA] = b; else delete map[wdA];
  if (a) map[wdB] = a; else delete map[wdB];
  store.set('plans', p);

  const o = store.get('orders', {});
  const ka = `s${state.split}w${wdA}`, kb = `s${state.split}w${wdB}`;
  const oa = o[ka], ob = o[kb];
  if (ob) o[ka] = ob; else delete o[ka];
  if (oa) o[kb] = oa; else delete o[kb];
  store.set('orders', o);
}

/* ---------- the editable exercise order ---------- */

function orderKey(date) {
  return store.get('overrides', {})[key(date)] ? 'd:' + key(date) : `s${state.split}w${isoDay(date)}`;
}

function defaultOrder(plan) {
  const n = PER_GROUP[state.split] || 3;
  return plan.groups.flatMap(g => byGroup(g).slice(0, n).map(e => e.id));
}

function orderFor(date) {
  const plan = sessionFor(date);
  if (!plan) return [];
  const saved = store.get('orders', {})[orderKey(date)];
  if (Array.isArray(saved) && saved.length && saved.every(id => byId(id))) return saved;
  return defaultOrder(plan);
}

function setOrder(date, ids) {
  const o = store.get('orders', {});
  o[orderKey(date)] = ids;
  store.set('orders', o);
}

function replaceAt(date, i) {
  const ids = orderFor(date).slice();
  const cur = byId(ids[i]);
  const pool = byGroup(cur.group);
  if (pool.length < 2) return false;
  const start = pool.findIndex(e => e.id === cur.id);
  for (let k = 1; k <= pool.length; k++) {
    const cand = pool[(start + k) % pool.length];
    if (!ids.includes(cand.id)) { ids[i] = cand.id; setOrder(date, ids); return true; }
  }
  return false;
}

/* The session, split into its muscle groups, in plan order. */
function sessionGroups(date) {
  const plan = sessionFor(date);
  if (!plan) return [];
  const ids = orderFor(date);
  const out = [];
  const used = new Set();
  plan.groups.forEach(g => {
    const list = ids.filter(id => byId(id).group === g);
    list.forEach(id => used.add(id));
    if (list.length) out.push({ group: g, ids: list });
  });
  const orphans = ids.filter(id => !used.has(id));
  orphans.forEach(id => {
    const g = byId(id).group;
    const found = out.find(o => o.group === g);
    if (found) found.ids.push(id); else out.push({ group: g, ids: [id] });
  });
  return out;
}

function availableGroups(date) {
  const plan = sessionFor(date);
  const have = plan ? plan.groups : [];
  return EDITABLE_GROUPS.filter(g => !have.includes(g));
}

/* Swap a whole muscle group for another, keeping its place in the session. */
function swapGroupFor(date, from, to) {
  const plan = sessionFor(date);
  if (!plan || !plan.groups.includes(from) || plan.groups.includes(to)) return false;
  const ids = orderFor(date);
  const at = ids.findIndex(id => byId(id).group === from);
  const take = to === 'cardio' ? 1 : (PER_GROUP[state.split] || 3);
  const fresh = byGroup(to).slice(0, take).map(e => e.id);
  const kept = ids.filter(id => byId(id).group !== from);
  const insert = at < 0 ? kept.length : Math.min(at, kept.length);
  const next = kept.slice(0, insert).concat(fresh, kept.slice(insert));

  plan.groups = plan.groups.map(g => (g === from ? to : g));
  plan.title = titleFor(plan.groups);
  writePlan(date, plan);
  setOrder(date, next);
  return true;
}

function writePlan(date, plan) {
  const dk = key(date);
  const overrides = store.get('overrides', {});
  if (overrides[dk] && !overrides[dk].disabled) { overrides[dk] = plan; store.set('overrides', overrides); }
  else { const p = plans(); p[state.split][isoDay(date)] = plan; store.set('plans', p); }
}

function moveAt(date, i, dir) {
  const ids = orderFor(date).slice();
  const j = i + dir;
  if (j < 0 || j >= ids.length) return;
  const t = ids[i]; ids[i] = ids[j]; ids[j] = t;
  setOrder(date, ids);
}

/* ---------- activation ---------- */

function trainedThisWeek(date) {
  const log = store.get('log', {});
  const done = new Set();
  weekOf(date).forEach(d => { const r = log[key(d)]; if (r) (r.groups || []).forEach(g => done.add(g)); });
  return done;
}

function suggestGroups(date) {
  const done = trainedThisWeek(date);
  const open = GROUP_PRIORITY.filter(g => !done.has(g));
  if (open.length >= 2) return open.slice(0, 2);
  if (open.length === 1) return open;
  return ['biceps', 'back'];
}

function activateDay(dateKey) {
  const groups = suggestGroups(new Date(dateKey + 'T12:00:00'));
  const o = store.get('overrides', {});
  o[dateKey] = { mark: '+', title: groups.map(g => GROUPS[g].name).join(' and '), groups, activated: true };
  store.set('overrides', o);
}

function deactivateDay(dateKey) {
  const o = store.get('overrides', {});
  delete o[dateKey];
  store.set('overrides', o);
  const ord = store.get('orders', {});
  delete ord['d:' + dateKey];
  store.set('orders', ord);
}

/* Days are numbered by where they fall in the week, not by a fixed letter.
   Activate an extra day and everything after it shifts up on its own. */
function markFor(date) {
  const log = store.get('log', {});
  let n = 0;
  const week = weekOf(date);
  for (let i = 0; i < week.length; i++) {
    const d = week[i];
    if (sessionFor(d) || log[key(d)]) n++;
    if (key(d) === key(date)) return sessionFor(d) || log[key(d)] ? String(n) : '';
  }
  return '';
}

function nextTrainingDay(from) {
  for (let i = 1; i <= 7; i++) {
    const d = addDays(from, i);
    if (sessionFor(d)) return { date: d, session: sessionFor(d) };
  }
  return null;
}

/* ---------- screen wake lock ---------- */

let wakeLock = null;

async function holdScreen() {
  try {
    if (navigator.wakeLock && !wakeLock) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) { /* unsupported or refused, not worth telling anyone */ }
}

function releaseScreen() {
  if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
}

/* ---------- render ---------- */

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function render() {
  if (state.screen === 'countdown' && state.pending) app.innerHTML = countdownView();
  else if (state.screen === 'run' && session.data) app.innerHTML = runView();
  else if (state.screen === 'history') app.innerHTML = historyView();
  else if (state.screen === 'daylog') app.innerHTML = dayLogView();
  else if (state.screen === 'manual' && state.manual) app.innerHTML = manualView();
  else if (state.screen === 'detail') app.innerHTML = detailView();
  else app.innerHTML = homeView();
  bind();
  startFigureLoop();
}

  return `

function doneCard(rec, d) {

}

function heroTraining(d, plan) {
  const items = orderFor(d).map(byId);

        <button class="btn" data-start="${key(d)}">Start workout</button>
        <button class="btn btn-quiet" data-edit="1">Muscle groups</button>

      </div>

}

function heroRest(d) {
  const next = nextTrainingDay(d);
  const open = suggestGroups(d).map(g => GROUPS[g].name).join(' and ');
  return `
    <section class="hero is-rest">
      ${avatar()}
      <div class="hero-mark">Rest</div>

      <p class="hero-groups">${isDisabled(d)

      <div class="hero-actions">
        ${isDisabled(d)
          ? `<button class="btn" data-deactivate="${key(d)}">Turn this day back on</button>`
          : `<button class="btn" data-activate="${key(d)}">Activate this day</button>`}
        <button class="btn btn-quiet" data-edit="1">Muscle groups</button>
      </div>
      <div class="hero-actions">
        ${isDisabled(d) ? `<button class="btn btn-quiet" data-activate="${key(d)}">Use it as a catch up day</button>` : ''}

      </div>
    </section>`;
}

function dayMover(d) {
  const wd = isoDay(d);
  const map = plans()[state.split];
  const cells = WEEKDAY_NAMES.map((name, i) => {
    const target = i + 1;
    const p = map[target];
    return `<button class="mover-day" ${target === wd ? 'disabled' : ''} data-swapday="${target}">
      <span class="mv-name">${esc(name.slice(0, 3))}</span>
      <span class="mv-what">${p ? esc(p.title) : 'Rest'}</span>
    </button>`;
  }).join('');
  return `
    <section class="mover">
      <div class="panel-head">
        <p class="mover-head">Swap ${esc(WEEKDAY_NAMES[wd - 1])} with which day?</p>
        <button class="panel-x" data-move="0" aria-label="Close">&times;</button>
      </div>
      <div class="mover-grid">${cells}</div>
      <div class="mover-foot">
        <button class="linky" data-resetweek="1">Reset the week to defaults</button>
        <button class="linky" data-move="0">&larr; Back to the day</button>
      </div>
    </section>`;
}

function splitSwitch() {
  const on = n => String(state.split) === String(n);
  const buttons = [3, 5, 'c'].map(n =>
    `<button data-split="${n}" aria-pressed="${on(n)}">${SPLIT_LABEL[n]}</button>`).join('');
  return `<div class="switch" role="group" aria-label="Training days per week">${buttons}</div>
    ${state.split === 'c' ? customPicker() : ''}`;
}

function customPicker() {
  const map = plans().c || {};
  const cells = WEEKDAY_NAMES.map((name, i) => {
    const wd = i + 1;
    const p = map[wd];
    return `<button class="chip is-day" aria-pressed="${!!p}" data-customday="${wd}">
      ${esc(name.slice(0, 3))}${p ? ' &check;' : ''}</button>`;
  }).join('');
  return `<section class="groups">
    <h3>Your own schedule</h3>
    <p class="hint">Tap the days you plan to train. Each one starts with three exercises per group,
      and you can change its muscle groups from the day itself.</p>
    <div class="chips">${cells}</div>
    ${Object.keys(map).length ? `<p class="hint" style="margin-top:10px">${
      Object.keys(map).sort().map(wd => esc(WEEKDAY_NAMES[wd - 1].slice(0, 3)) + ' ' + esc(map[wd].title)).join(' &middot; ')
    }</p>` : ''}
  </section>`;
}

function toggleCustomDay(wd) {
  const p = plans();
  const map = p.c || (p.c = {});
  if (map[wd]) {
    delete map[wd];
    const o = store.get('orders', {});
    delete o['scw' + wd];
    store.set('orders', o);
  } else {
    const groups = CUSTOM_ROTATION[Object.keys(map).length % CUSTOM_ROTATION.length].slice();
    map[wd] = { title: titleFor(groups), groups };
  }
  store.set('plans', p);
}

function weekStrip(viewed) {
  const t = today(), log = store.get('log', {});
  const cells = weekOf(viewed).map(d => {
    const s = sessionFor(d);
    const cls = ['week-day'];
    if (!s) cls.push('is-rest');
    if (log[key(d)]) cls.push('is-logged');
    if (key(d) === key(t)) cls.push('is-today');
    return `<button class="${cls.join(' ')}" aria-pressed="${key(d) === key(viewed)}" data-goto="${key(d)}">
      <span class="wd">${esc(d.toLocaleDateString(undefined, { weekday: 'narrow' }))}</span>
      <span class="wm">${markFor(d) || '&middot;'}</span>
    </button>`;
  }).join('');
  return `<nav class="week" aria-label="This week">${cells}</nav>`;
}

function exerciseList(d) {
  const dk = key(d);
  const ids = orderFor(d);
  const blocks = sessionGroups(d).map(sec => {
    const sets = sec.ids.reduce((n, id) => n + byId(id).sets, 0);
    const open = state.swapGroup === sec.group;
    const rows = sec.ids.map((id, li) => {
      const e = byId(id);
      const gi = ids.indexOf(id);
      return `<div class="card">
        <button class="card-main" data-exercise="${e.id}" data-from="${dk}">
          <span class="card-thumb">${figureSVG(e, { phase: (gi + 1) * 0.13 })}</span>
          <span class="card-body">
            <span class="card-tag">${gi + 1} &middot; ${esc(GROUPS[e.group].name)}</span>
            <h3>${esc(e.name)}</h3>
            <p>${e.cardio ? esc(e.reps) : `${e.sets} sets &middot; ${esc(e.reps)} reps &middot; ${GROUPS[e.group].rest}s rest`}</p>
          </span>
        </button>
        <div class="card-tools">
          <button data-up="${gi}" data-d="${dk}" ${li === 0 ? 'disabled' : ''} aria-label="Move up">&uarr;</button>
          <button data-down="${gi}" data-d="${dk}" ${li === sec.ids.length - 1 ? 'disabled' : ''} aria-label="Move down">&darr;</button>
          <button class="tool-wide" data-replace="${gi}" data-d="${dk}">Replace</button>
        </div>
      </div>`;
    }).join('');

    const choices = availableGroups(d).map(g =>
      `<button class="chip" data-swapto="${g}" data-from="${sec.group}" data-d="${dk}">${esc(GROUPS[g].name)}</button>`
    ).join('') || '<p class="hint">Every muscle group is already in this session.</p>';

    return `<section class="gsec">
      <div class="gsec-head">
        <div>
          <p class="gsec-name">${esc(GROUPS[sec.group].name)}</p>
          <p class="gsec-meta">${sec.ids.length} ${sec.ids.length === 1 ? 'exercise' : 'exercises'} &middot; ${sets} sets</p>
        </div>
        <div class="gsec-tools">
          <button data-swapgroup="${open ? '' : sec.group}">${open ? 'Cancel' : 'Swap'}</button>
          <button data-rmgroup="${sec.group}" data-d="${dk}">Remove</button>
        </div>
      </div>
      ${open ? `<div class="gsec-swap"><p class="hint">Swap ${esc(GROUPS[sec.group].name)} for:</p><div class="chips">${choices}</div></div>` : ''}
      ${rows}
    </section>`;
  }).join('');

  return `<div class="section-head"><h2>The session</h2><span>Tap to open, or reorder</span></div>${blocks}`;
}
