<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rack</title>
<meta name="description" content="A dumbbell training plan that knows what day it is.">
<meta name="theme-color" content="#e4e3de">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root {
  --concrete: #e4e3de;
  --slab: #f6f5f2;
  --ink: #182028;
  --iron: #626b76;
  --stamp: #c0361e;
  --rule: #cbc9c2;
  --pad: 20px;
  --radius: 4px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--concrete);
  color: var(--ink);
  font-family: Archivo, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px; line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

body { min-height: 100dvh; display: flex; justify-content: center; }

#app { width: 100%; max-width: 480px; padding: 0 var(--pad) 72px; }

button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
button:focus-visible { outline: 2px solid var(--stamp); outline-offset: 3px; }

/* ---------- welcome bar ---------- */

.welcome {
  position: sticky; top: 0; z-index: 5;
  background: var(--concrete);
  padding: 14px 0 10px;
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
}

.hello {
  margin: 0; font-size: 15px;
  font-variation-settings: 'wdth' 105, 'wght' 650;
}

.sync-state { margin: 0; font-size: 12px; color: var(--iron); }

.live { display: flex; align-items: baseline; gap: 10px; min-width: 0; }

.live-clock {
  font-size: 19px;
  font-variation-settings: 'wdth' 118, 'wght' 800;
  font-variant-numeric: tabular-nums;
  color: var(--stamp);
}

.live-msg {
  font-size: 12px; color: var(--iron); margin-left: 10px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ---------- masthead ---------- */

.masthead { display: flex; align-items: baseline; justify-content: space-between; padding: 20px 0 16px; }
.wordmark { font-variation-settings: 'wdth' 125, 'wght' 800; font-size: 21px; }
.datestamp { color: var(--iron); font-size: 14px; }

/* ---------- resume ---------- */

.resume {
  width: 100%; display: flex; justify-content: space-between; align-items: center;
  background: var(--ink); color: var(--slab);
  border-radius: var(--radius); padding: 13px 16px; margin-bottom: 14px;
  font-size: 14px; min-height: 50px; text-align: left;
}

.resume-go { font-variation-settings: 'wdth' 105, 'wght' 700; color: #fff; }

/* ---------- hero ---------- */

.hero {
  background: var(--slab); border: 1px solid var(--rule);
  border-radius: var(--radius); padding: 22px 20px 20px;
}

.hero.is-rest { background: transparent; border-style: dashed; }
.hero.is-done { border-color: var(--ink); }

.hero-mark {
  font-variation-settings: 'wdth' 125, 'wght' 800;
  font-size: 76px; line-height: 0.82; letter-spacing: -0.03em;
  color: var(--stamp); font-variant-numeric: tabular-nums;
}

.hero.is-rest .hero-mark { color: var(--iron); font-size: 44px; }
.hero.is-done .hero-mark { color: var(--ink); font-size: 52px; }

.hero-title { font-variation-settings: 'wdth' 112, 'wght' 700; font-size: 27px; line-height: 1.1; margin: 12px 0 4px; }
.hero-groups { color: var(--iron); font-size: 15px; margin: 0 0 2px; }
.hero-count { color: var(--iron); font-size: 14px; font-variant-numeric: tabular-nums; margin: 0; }
.hero-actions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }

.btn {
  background: var(--ink); color: var(--slab);
  border-radius: var(--radius); padding: 14px 22px;
  font-variation-settings: 'wdth' 105, 'wght' 650;
  font-size: 16px; min-height: 52px; flex: 1 1 auto;
}

.btn:active { transform: translateY(1px); }
.btn[disabled] { background: var(--rule); color: var(--iron); }
.btn-quiet { background: transparent; color: var(--ink); border: 1px solid var(--rule); }

.linky {
  display: block; width: 100%; text-align: center;
  color: var(--iron); font-size: 14px; padding: 14px 0; min-height: 44px;
}

/* ---------- split switch ---------- */

.switch {
  display: flex; margin: 22px 0 4px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  overflow: hidden; background: var(--slab);
}

.switch button { flex: 1; padding: 12px 8px; font-size: 15px; color: var(--iron); min-height: 48px; }
.switch button[aria-pressed="true"] { background: var(--ink); color: var(--slab); font-variation-settings: 'wght' 700; }
.switch-note { color: var(--iron); font-size: 13px; margin: 8px 0 0; }

/* ---------- week strip ---------- */

.week { display: flex; gap: 6px; margin: 26px 0 8px; }

.week-day {
  flex: 1 1 0; min-width: 0;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--slab); padding: 8px 2px 9px; text-align: center; min-height: 62px;
}

.week-day .wd { display: block; font-size: 12px; color: var(--iron); }
.week-day .wm { display: block; font-size: 18px; margin-top: 4px; font-variation-settings: 'wdth' 118, 'wght' 750; }
.week-day.is-rest .wm { color: var(--rule); }
.week-day.is-today { border-color: var(--ink); border-width: 2px; }
.week-day.is-logged { background: #dcded6; }
.week-day.is-logged .wm { color: var(--stamp); }
.week-day[aria-pressed="true"] { background: var(--ink); }
.week-day[aria-pressed="true"] .wd { color: var(--rule); }
.week-day[aria-pressed="true"] .wm { color: var(--slab); }

/* ---------- exercise list ---------- */

.section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 30px 0 12px; }
.section-head h2 { font-size: 17px; margin: 0; font-variation-settings: 'wdth' 108, 'wght' 700; }
.section-head span { color: var(--iron); font-size: 13px; }

.group-label {
  color: var(--iron); font-size: 13px; margin: 20px 0 8px;
  padding-bottom: 6px; border-bottom: 1px solid var(--rule);
  font-variation-settings: 'wght' 600;
}

.card {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  background: var(--slab); border: 1px solid var(--rule); border-radius: var(--radius);
  padding: 10px 14px 10px 8px; margin-bottom: 8px; min-height: 72px;
}

.card:active { background: #eeece7; }
.card-thumb { width: 68px; flex: 0 0 68px; }
.card-body h3 { margin: 0; font-size: 16px; font-variation-settings: 'wdth' 105, 'wght' 650; }
.card-body p { margin: 2px 0 0; color: var(--iron); font-size: 13px; font-variant-numeric: tabular-nums; }

/* ---------- detail and runner ---------- */

.back { padding: 12px 0; color: var(--iron); font-size: 15px; min-height: 44px; }

.detail-stage {
  background: var(--slab); border: 1px solid var(--rule);
  border-radius: var(--radius); padding: 8px; margin-top: 4px;
}

.detail-stage .figure { width: 100%; height: auto; display: block; }

.detail h1, .run-name {
  font-size: 30px; line-height: 1.08; margin: 20px 0 6px;
  font-variation-settings: 'wdth' 112, 'wght' 750;
}

.detail-meta { color: var(--iron); font-size: 15px; font-variant-numeric: tabular-nums; margin: 0; }
.desc { font-size: 15px; margin: 14px 0 0; }

.cues { margin: 20px 0 0; padding: 0; list-style: none; }
.cues li { padding: 11px 0 11px 18px; border-top: 1px solid var(--rule); position: relative; font-size: 15px; }
.cues li::before { content: ''; position: absolute; left: 0; top: 19px; width: 7px; height: 2px; background: var(--stamp); }

.stage-note { margin-top: 24px; color: var(--iron); font-size: 13px; border-top: 1px solid var(--rule); padding-top: 12px; }

.run-top { display: flex; align-items: center; justify-content: space-between; }
.run-pos { color: var(--iron); font-size: 13px; font-variant-numeric: tabular-nums; }

.bar { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; margin: 4px 0 6px; }
.bar span { display: block; height: 100%; background: var(--stamp); transition: width 0.3s ease; }
.bar.is-set { height: 10px; border-radius: 5px; }
.bar-note { margin: 0 0 12px; color: var(--iron); font-size: 13px; font-variant-numeric: tabular-nums; }

.set-count { margin: 16px 0 8px; font-size: 20px; }
.set-count strong { font-size: 30px; font-variation-settings: 'wdth' 118, 'wght' 800; color: var(--stamp); font-variant-numeric: tabular-nums; }

.cue-strip { color: var(--iron); font-size: 14px; text-align: center; margin: 14px 0 0; }

.weight {
  display: flex; align-items: center; justify-content: space-between;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--slab); margin-top: 18px; padding: 4px;
}

.weight button { width: 64px; min-height: 48px; font-size: 24px; color: var(--ink); }
.weight span { font-size: 15px; color: var(--iron); font-variant-numeric: tabular-nums; }
.weight strong { font-size: 22px; color: var(--ink); font-variation-settings: 'wdth' 112, 'wght' 750; }

.rest { text-align: center; padding: 26px 0 10px; }
.rest-label { margin: 0; color: var(--iron); font-size: 14px; }
.rest-clock {
  margin: 2px 0 4px; font-size: 68px; line-height: 1;
  font-variation-settings: 'wdth' 118, 'wght' 800;
  font-variant-numeric: tabular-nums; color: var(--stamp);
}
.rest-next { margin: 0; color: var(--iron); font-size: 14px; }

/* ---------- muscle map ---------- */

.mmap {
  margin-top: 18px; background: var(--slab);
  border: 1px solid var(--rule); border-radius: var(--radius); padding: 10px 12px 8px;
}

.mmap-svg { width: 100%; height: auto; display: block; max-height: 210px; }
.mm-base { fill: var(--rule); opacity: 0.55; }
.mm-second { fill: var(--stamp); opacity: 0.32; }
.mm-first { fill: var(--stamp); }
.mm-cap { fill: var(--iron); font-size: 7px; text-anchor: middle; font-family: inherit; }

.mmap-key { margin-top: 6px; }
.mm-line { margin: 2px 0; font-size: 13px; color: var(--iron); display: flex; align-items: center; gap: 7px; }
.mm-dot { width: 9px; height: 9px; border-radius: 2px; flex: 0 0 9px; }
.mm-dot.is-first { background: var(--stamp); }
.mm-dot.is-second { background: var(--stamp); opacity: 0.32; }

/* ---------- figure colours ---------- */

.fig-prop { stroke: var(--rule); stroke-linecap: round; }
.fig-far { stroke: var(--iron); stroke-linecap: round; opacity: 0.38; }
.fig-near, .fig-torso { stroke: var(--ink); stroke-linecap: round; }
.fig-head { fill: var(--ink); }
.fig-bell rect { fill: var(--stamp); }

/* ---------- card tools ---------- */

.card { display: block; padding: 0; }

.card-main {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  padding: 10px 14px 8px 8px; background: none; min-height: 72px;
}

.card-main:active { background: #eeece7; }

.card-tag {
  display: block; font-size: 11px; color: var(--iron);
  font-variant-numeric: tabular-nums; margin-bottom: 1px;
}

.card-tools {
  display: flex; gap: 1px; border-top: 1px solid var(--rule);
  background: var(--rule);
}

.card-tools button {
  flex: 0 0 auto; width: 56px; min-height: 42px;
  background: var(--slab); color: var(--ink); font-size: 15px;
}

.card-tools button[disabled] { color: var(--rule); }
.card-tools .tool-wide { flex: 1 1 auto; width: auto; font-size: 14px; color: var(--iron); }
.card-tools button:active { background: #eeece7; }

/* ---------- day mover ---------- */

.mover {
  margin-top: 12px; padding: 14px 14px 8px;
  border: 1px solid var(--ink); border-radius: var(--radius); background: var(--slab);
}

.mover-head { margin: 0 0 10px; font-size: 15px; font-variation-settings: 'wght' 650; }
.mover-grid { display: flex; flex-wrap: wrap; gap: 6px; }

.mover-day {
  flex: 1 1 30%; min-width: 96px; text-align: left;
  border: 1px solid var(--rule); border-radius: var(--radius);
  padding: 8px 10px; min-height: 52px; background: var(--concrete);
}

.mover-day[disabled] { opacity: 0.4; }
.mv-name { display: block; font-size: 12px; color: var(--iron); }
.mv-what { display: block; font-size: 14px; font-variation-settings: 'wght' 650; }
.mover-foot { display: flex; gap: 8px; }
.mover-foot .linky { flex: 1; }

/* ---------- history ---------- */

.datestamp { padding: 0; text-decoration: underline; text-underline-offset: 3px; }

.hists { list-style: none; margin: 8px 0 0; padding: 0; }

.hist {
  display: flex; gap: 10px; align-items: baseline;
  padding: 11px 0; border-top: 1px solid var(--rule); font-size: 14px;
}

.hist-date { flex: 0 0 82px; color: var(--iron); font-variant-numeric: tabular-nums; }
.hist-title { flex: 1 1 auto; font-variation-settings: 'wght' 650; }
.hist-meta { color: var(--iron); font-variant-numeric: tabular-nums; font-size: 13px; }
.hist-empty { color: var(--iron); }

<body>
<main id="app"></main>
<script>
window.addEventListener('error', function (e) {
  var box = document.getElementById('boot');
  if (!box) { box = document.createElement('div'); box.id='boot';
    box.innerHTML='<h2>Rack could not start</h2>'; document.body.appendChild(box); }
  box.appendChild(document.createTextNode((e.message||'Unknown error')+'\n  line '+(e.lineno||'?')+'\n'));
}, true);
</script>

/* ===== figure.js ===== */
/* Draws an exercise as an SVG figure and animates it between its two poses.
   One requestAnimationFrame loop drives every figure on the page. */

const JOINT_LINES = [
  ['far', 'shoulder', 'elbow'], ['far', 'elbow', 'hand'],
  ['far', 'hip', 'knee'], ['far', 'knee', 'foot'],
  ['near', 'shoulder', 'elbow'], ['near', 'elbow', 'hand'],
  ['near', 'hip', 'knee'], ['near', 'knee', 'foot']
];

function mergePose(base, over) {
  if (!over) return base;
  const out = {
    props: base.props,
    head: over.head || base.head,
    neck: over.neck || base.neck,
    hip: over.hip || base.hip,
    near: Object.assign({}, base.near, over.near || {}),
    far: Object.assign({}, base.far, over.far || {}),
    db: over.db || base.db
  };
  return out;
}

const lerp = (a, b, t) => a + (b - a) * t;
const lerpPt = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];

function poseAt(ex, t) {
  const a = ex.pose;
  const b = mergePose(ex.pose, ex.end);
  const side = s => {
    const o = {};
    ['shoulder', 'elbow', 'hand', 'knee', 'foot'].forEach(j => {
      if (a[s][j]) o[j] = lerpPt(a[s][j], b[s][j] || a[s][j], t);
    });
    return o;
  };
  return {
    props: a.props,
    head: lerpPt(a.head, b.head, t),
    neck: lerpPt(a.neck, b.neck, t),
    hip: lerpPt(a.hip, b.hip, t),
    near: side('near'),
    far: side('far'),
    db: a.db.map((d, i) => {
      const e = (b.db && b.db[i]) || d;
      return [lerp(d[0], e[0], t), lerp(d[1], e[1], t), lerp(d[2] || 0, e[2] || 0, t)];
    })
  };
}

function figureSVG(ex, opts) {
  const o = opts || {};
  const p = ex.pose;
  const props = (p.props || [])
    .map(q => `<line x1="${q.p1[0]}" y1="${q.p1[1]}" x2="${q.p2[0]}" y2="${q.p2[1]}" class="fig-prop" stroke-width="7"/>`)
    .join('');

  const limbs = JOINT_LINES.map(([side, from, to]) => {
    if (!p[side][to]) return '';
    const cls = side === 'near' ? 'fig-near' : 'fig-far';
    const w = side === 'near' ? 5.5 : 5;
    return `<line data-j="${side}.${from}.${to}" class="${cls}" stroke-width="${w}" x1="0" y1="0" x2="0" y2="0"/>`;
  }).join('');

  const bells = p.db
    .map((d, i) => `<g data-db="${i}" class="fig-bell">
      <rect x="-7" y="-1.4" width="14" height="2.8" rx="1.2"/>
      <rect x="-11.5" y="-5" width="5" height="10" rx="1.6"/>
      <rect x="6.5" y="-5" width="5" height="10" rx="1.6"/>
    </g>`).join('');

  return `<svg viewBox="0 0 140 124" class="figure" data-ex="${ex.id}" data-phase="${o.phase || 0}"
    role="img" aria-label="${ex.name} technique" xmlns="http://www.w3.org/2000/svg">
    ${props}
    ${limbs.replace(/data-j="far/g, 'data-j="far')}
    <line data-j="torso.far" class="fig-far" stroke-width="5" x1="0" y1="0" x2="0" y2="0"/>
    <line data-j="torso.near" class="fig-torso" stroke-width="8" x1="0" y1="0" x2="0" y2="0"/>
    <circle data-j="head" class="fig-head" r="8" cx="0" cy="0"/>
    ${bells}
  </svg>`;
}

/* ---------- animation loop ---------- */

function paintFigure(svg, ex, t) {
  const p = poseAt(ex, t);
  svg.querySelectorAll('[data-j]').forEach(el => {
    const j = el.dataset.j;
    if (j === 'head') { el.setAttribute('cx', p.head[0]); el.setAttribute('cy', p.head[1]); return; }
    if (j === 'torso.near' || j === 'torso.far') {
      el.setAttribute('x1', p.neck[0]); el.setAttribute('y1', p.neck[1]);
      el.setAttribute('x2', p.hip[0]); el.setAttribute('y2', p.hip[1]);
      return;
    }
    const [side, from, to] = j.split('.');
    const a = from === 'hip' ? p.hip : p[side][from];
    const b = p[side][to];
    if (!a || !b) return;
    el.setAttribute('x1', a[0]); el.setAttribute('y1', a[1]);
    el.setAttribute('x2', b[0]); el.setAttribute('y2', b[1]);
  });
  svg.querySelectorAll('[data-db]').forEach(g => {
    const d = p.db[Number(g.dataset.db)];
    if (d) g.setAttribute('transform', `translate(${d[0].toFixed(2)} ${d[1].toFixed(2)}) rotate(${d[2].toFixed(2)})`);
  });
}

let animating = false;

function tickFigures(now) {
  const svgs = document.querySelectorAll('svg.figure');
  svgs.forEach(svg => {
    const ex = byId(svg.dataset.ex);
    if (!ex) return;
    const period = (ex.tempo || 2.8) * 1000;
    const phase = Number(svg.dataset.phase) || 0;
    const u = (((now / period) + phase) % 1 + 1) % 1;
    paintFigure(svg, ex, (1 - Math.cos(2 * Math.PI * u)) / 2);
  });
  requestAnimationFrame(tickFigures);
}

function startFigureLoop() {
  if (animating || typeof requestAnimationFrame !== 'function') return;
  animating = true;
  requestAnimationFrame(tickFigures);
}


/* ===== sync.js ===== */
/* Talks to the Google Apps Script web app.
   Everything is written locally first, then pushed. Nothing is lost if the phone drops signal. */

const SYNC_URL = 'https://script.google.com/macros/s/AKfycbzQjg4Y9UtO5RPVnd6PvoAlVgOFznJHgZI3vCRGfXoGYg1nCDz6qM72_gSOZMVWG8Yi/exec';

const store = {
  get(k, fallback) {
    try { const v = localStorage.getItem('rack.' + k); return v === null ? fallback : JSON.parse(v); }
    catch (e) { return fallback; }
  },
  set(k, v) {
    try { localStorage.setItem('rack.' + k, JSON.stringify(v)); } catch (e) { /* private mode */ }
  }
};

const sync = {
  status: 'idle',           // idle | sending | queued | offline
  onchange: null,

  queue() { return store.get('queue', []); },

  push(record) {
    const q = this.queue();
    q.push(Object.assign({ athlete: ATHLETE, at: new Date().toISOString() }, record));
    store.set('queue', q);
    this.flush();
  },

  async flush() {
    if (this.status === 'sending') return;
    let q = this.queue();
    if (!q.length) { this.set('idle'); return; }
    this.set('sending');
    while (q.length) {
      const ok = await this.send(q[0]);
      if (!ok) { this.set('queued'); return; }
      q = this.queue().slice(1);
      store.set('queue', q);
    }
    this.set('idle');
  },

  async send(record) {
    try {
      const res = await fetch(SYNC_URL, {
        method: 'POST',
        // text/plain keeps the browser from sending a preflight Apps Script cannot answer
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(record),
        redirect: 'follow'
      });
      return res.ok;
    } catch (e) {
      return false;
    }
  },

  set(s) {
    this.status = s;
    if (this.onchange) this.onchange(s);
  },

  label() {
    const n = this.queue().length;
    if (this.status === 'sending') return 'Saving';
    if (n) return n + ' to sync';
    return 'Saved';
  }
};

window.addEventListener('online', () => sync.flush());


/* ===== runner.js ===== */
/* The workout runner. One exercise at a time, three sets, rest between them.
   The session clock starts on the first Start and never pauses, rests included. */

const WORK_SEC_PER_SET = 40;      // used only for the time estimate
const TRANSITION_SEC = 75;        // walking over, changing the bench, picking bells
const GRACE_SEC = 300;            // bathroom, water, someone using your rack

const MOTIVATION = [
  'You got this', 'One set at a time', 'Own the last two reps', 'Slow on the way down',
  'Breathe, then go', 'Nobody is coming to lift it for you', 'This is the easy part',
  'Full range, every rep', 'Stay tight', 'Finish what you started', 'Better than yesterday',
  'The bells do not care how you feel'
];

function estimateSeconds(items) {
  let sec = 0;
  items.forEach(e => {
    sec += e.sets * WORK_SEC_PER_SET;
    sec += (e.sets - 1) * GROUPS[e.group].rest;
    sec += TRANSITION_SEC;
  });
  return sec + GRACE_SEC;
}

function humanMinutes(sec) {
  const m = Math.round(sec / 60 / 5) * 5;
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}h ${r}m` : `${h}h`;
}

function clock(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
  const pad = n => String(n).padStart(2, '0');
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

/* ---------- session ---------- */

const session = {
  data: null,

  load() { this.data = store.get('active', null); return this.data; },
  save() { store.set('active', this.data); },

  start(dateKey, plan, order, startIdx) {
    this.data = {
      dateKey,
      mark: plan.mark,
      title: plan.title,
      groups: plan.groups,
      order: (order && order.length ? order.slice() : plan.groups.flatMap(byGroup).map(e => e.id)),
      idx: Math.min(Math.max(0, startIdx || 0), (order || []).length ? order.length - 1 : 0),
      phase: 'proposed',        // proposed | set | rest | done
      setsDone: 0,
      restEndsAt: null,
      startedAt: Date.now(),
      logged: []
    };
    this.save();
  },

  get exercise() { return byId(this.data.order[this.data.idx]); },
  get elapsed() { return (Date.now() - this.data.startedAt) / 1000; },
  get totalSets() { return this.data.order.reduce((n, id) => n + byId(id).sets, 0); },
  get doneSets() { return this.data.logged.length; },

  weight(id) {
    const w = store.get('weights', {});
    return w[id] || 20;
  },
  setWeight(id, lb) {
    const w = store.get('weights', {});
    w[id] = Math.min(MAX_DUMBBELL, Math.max(WEIGHT_STEP, lb));
    store.set('weights', w);
  },

  motivation() {
    return MOTIVATION[Math.floor(this.elapsed / 25) % MOTIVATION.length];
  },

  accept() { this.data.phase = 'set'; this.save(); },

  swap() {
    const ex = this.exercise;
    const used = new Set(this.data.order);
    const alt = byGroup(ex.group).find(e => !used.has(e.id));
    if (!alt) return false;
    this.data.order[this.data.idx] = alt.id;
    this.data.setsDone = 0;
    this.save();
    return true;
  },

  logSet(ex, marked) {
    this.data.setsDone++;
    const entry = {
      exerciseId: ex.id, exerciseName: ex.name, group: ex.group,
      set: this.data.setsDone, reps: ex.reps, weight: this.weight(ex.id),
      elapsedSec: Math.round(this.elapsed), marked: marked ? 'marked done' : ''
    };
    this.data.logged.push(entry);
    sync.push(Object.assign({ type: 'set', dateKey: this.data.dateKey, sessionTitle: this.data.title }, entry));
  },

  /* Mark the whole exercise done and move on. Logs every set still outstanding. */
  completeExercise() {
    const ex = this.exercise;
    while (this.data.setsDone < ex.sets) this.logSet(ex, true);
    this.nextExercise();
    this.save();
  },

  completeSet() {
    const ex = this.exercise;
    this.logSet(ex, false);

    if (this.data.setsDone >= ex.sets) {
      this.nextExercise();
    } else {
      this.data.phase = 'rest';
      this.data.restEndsAt = Date.now() + GROUPS[ex.group].rest * 1000;
    }
    this.save();
  },

  nextExercise() {
    this.data.idx++;
    this.data.setsDone = 0;
    this.data.restEndsAt = null;
    this.data.phase = this.data.idx >= this.data.order.length ? 'done' : 'proposed';
    if (this.data.phase === 'done') this.finish();
    this.save();
  },

  skipExercise() { this.nextExercise(); },

  addRest(sec) {
    if (this.data.restEndsAt) { this.data.restEndsAt += sec * 1000; this.save(); }
  },

  skipRest() {
    this.data.phase = 'set';
    this.data.restEndsAt = null;
    this.save();
  },

  restLeft() {
    return this.data.restEndsAt ? (this.data.restEndsAt - Date.now()) / 1000 : 0;
  },

  finish() {
    const d = this.data;
    const durationSec = Math.round((Date.now() - d.startedAt) / 1000);
    const log = store.get('log', {});
    log[d.dateKey] = {
      title: d.title, mark: d.mark, groups: d.groups,
      durationSec, sets: d.logged.length,
      exercises: [...new Set(d.logged.map(l => l.exerciseName))],
      finishedAt: new Date().toISOString()
    };
    store.set('log', log);
    sync.push({
      type: 'session', dateKey: d.dateKey, title: d.title, groups: d.groups.join('|'),
      durationSec, sets: d.logged.length,
      exercises: [...new Set(d.logged.map(l => l.exerciseName))].join('|')
    });
  },

  abandon() {
    if (this.data && this.data.logged.length) this.finish();
    this.data = null;
    store.set('active', null);
  }
};


/* ===== app.js ===== */
/* Rack. Schedule, dates, editing, screens. */

const DEFAULT_SPLITS = {
  3: [
    { mark: 'A', title: 'Pull', groups: ['biceps', 'back'], weekday: 1 },
    { mark: 'B', title: 'Push', groups: ['chest', 'shoulders', 'triceps'], weekday: 3 },
    { mark: 'C', title: 'Legs and core', groups: ['legs', 'core'], weekday: 5 }
  ],
  5: [
    { mark: '1', title: 'Arms', groups: ['biceps', 'triceps'], weekday: 1 },
    { mark: '2', title: 'Chest', groups: ['chest'], weekday: 2 },
    { mark: '3', title: 'Back', groups: ['back'], weekday: 3 },
    { mark: '4', title: 'Shoulders', groups: ['shoulders'], weekday: 4 },
    { mark: '5', title: 'Legs and core', groups: ['legs', 'core'], weekday: 5 }
  ]
};

const PER_GROUP = { 3: 3, 5: 4 };
const GROUP_PRIORITY = ['biceps', 'back', 'chest', 'shoulders', 'triceps', 'legs', 'core'];
const WEEKDAY_NAMES = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

const state = {
  split: store.get('split', 3) === 5 ? 5 : 3,
  selected: null,
  exercise: null,
  detailFrom: null,
  screen: 'home',
  moving: false,
  history: null
};

/* ---------- dates ---------- */

const isoDay = d => ((d.getDay() + 6) % 7) + 1;
const key = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

function today() { const d = new Date(); d.setHours(12, 0, 0, 0); return d; }
function viewedDate() { return state.selected ? new Date(state.selected + 'T12:00:00') : today(); }
function weekOf(d) { const s = addDays(d, -(isoDay(d) - 1)); return Array.from({ length: 7 }, (_, i) => addDays(s, i)); }

const fmtLong = d => d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = d => d.toLocaleDateString(undefined, { weekday: 'long' });

/* ---------- the editable week ---------- */

function defaultPlanMap(n) {
  const m = {};
  DEFAULT_SPLITS[n].forEach(s => { m[s.weekday] = { mark: s.mark, title: s.title, groups: s.groups.slice() }; });
  return m;
}

function plans() {
  const p = store.get('plans', {}) || {};
  let dirty = false;
  [3, 5].forEach(n => { if (!p[n]) { p[n] = defaultPlanMap(n); dirty = true; } });
  if (dirty) store.set('plans', p);
  return p;
}

function scheduledFor(date) { return plans()[state.split][isoDay(date)] || null; }

function sessionFor(date) {
  return store.get('overrides', {})[key(date)] || scheduledFor(date);
}

function resetWeek() {
  const p = plans();
  p[state.split] = defaultPlanMap(state.split);
  store.set('plans', p);
  const o = store.get('orders', {});
  Object.keys(o).forEach(k => { if (k.indexOf('s' + state.split) === 0) delete o[k]; });
  store.set('orders', o);
}

function swapDays(wdA, wdB) {
  if (wdA === wdB) return;
  const p = plans();
  const map = p[state.split];
  const a = map[wdA] || null, b = map[wdB] || null;
  if (b) map[wdA] = b; else delete map[wdA];
  if (a) map[wdB] = a; else delete map[wdB];
  store.set('plans', p);

  const o = store.get('orders', {});
  const ka = `s${state.split}w${wdA}`, kb = `s${state.split}w${wdB}`;
  const oa = o[ka], ob = o[kb];
  if (ob) o[ka] = ob; else delete o[ka];
  if (oa) o[kb] = oa; else delete o[kb];
  store.set('orders', o);
}

/* ---------- the editable exercise order ---------- */

function orderKey(date) {
  return store.get('overrides', {})[key(date)] ? 'd:' + key(date) : `s${state.split}w${isoDay(date)}`;
}

function defaultOrder(plan) {
  const n = PER_GROUP[state.split] || 3;
  return plan.groups.flatMap(g => byGroup(g).slice(0, n).map(e => e.id));
}

function orderFor(date) {
  const plan = sessionFor(date);
  if (!plan) return [];
  const saved = store.get('orders', {})[orderKey(date)];
  if (Array.isArray(saved) && saved.length && saved.every(id => byId(id))) return saved;
  return defaultOrder(plan);
}

function setOrder(date, ids) {
  const o = store.get('orders', {});
  o[orderKey(date)] = ids;
  store.set('orders', o);
}

function replaceAt(date, i) {
  const ids = orderFor(date).slice();
  const cur = byId(ids[i]);
  const pool = byGroup(cur.group);
  const start = pool.findIndex(e => e.id === cur.id);
  for (let k = 1; k <= pool.length; k++) {
    const cand = pool[(start + k) % pool.length];
    if (!ids.includes(cand.id)) { ids[i] = cand.id; setOrder(date, ids); return true; }
  }
  return false;
}

function moveAt(date, i, dir) {
  const ids = orderFor(date).slice();
  const j = i + dir;
  if (j < 0 || j >= ids.length) return;
  const t = ids[i]; ids[i] = ids[j]; ids[j] = t;
  setOrder(date, ids);
}

/* ---------- activation ---------- */

function trainedThisWeek(date) {
  const log = store.get('log', {});
  const done = new Set();
  weekOf(date).forEach(d => { const r = log[key(d)]; if (r) (r.groups || []).forEach(g => done.add(g)); });
  return done;
}

function suggestGroups(date) {
  const done = trainedThisWeek(date);
  const open = GROUP_PRIORITY.filter(g => !done.has(g));
  if (open.length >= 2) return open.slice(0, 2);
  if (open.length === 1) return open;
  return ['biceps', 'back'];
}

function activateDay(dateKey) {
  const groups = suggestGroups(new Date(dateKey + 'T12:00:00'));
  const o = store.get('overrides', {});
  o[dateKey] = { mark: '+', title: groups.map(g => GROUPS[g].name).join(' and '), groups, activated: true };
  store.set('overrides', o);
}

function deactivateDay(dateKey) {
  const o = store.get('overrides', {});
  delete o[dateKey];
  store.set('overrides', o);
  const ord = store.get('orders', {});
  delete ord['d:' + dateKey];
  store.set('orders', ord);
}

function nextTrainingDay(from) {
  for (let i = 1; i <= 7; i++) {
    const d = addDays(from, i);
    if (sessionFor(d)) return { date: d, session: sessionFor(d) };
  }
  return null;
}

/* ---------- screen wake lock ---------- */

let wakeLock = null;

async function holdScreen() {
  try {
    if (navigator.wakeLock && !wakeLock) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) { /* unsupported or refused, not worth telling anyone */ }
}

function releaseScreen() {
  if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
}

/* ---------- render ---------- */

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function render() {
  if (state.screen === 'run' && session.data) app.innerHTML = runView();
  else if (state.screen === 'history') app.innerHTML = historyView();
  else if (state.screen === 'detail') app.innerHTML = detailView();
  else app.innerHTML = homeView();
  bind();
  startFigureLoop();
}

function welcomeBar() {
  const live = session.data && session.data.phase !== 'done';
  return `
    <header class="welcome">
      <p class="hello">Welcome, ${esc(ATHLETE)}</p>
      ${live ? `<div class="live">
          <span class="live-clock" id="elapsed">${clock(session.elapsed)}</span>
          <span class="live-msg" id="motivate">${esc(session.motivation())}</span>
        </div>` : `<p class="sync-state" id="syncstate">${esc(sync.label())}</p>`}
    </header>`;
}

/* ---------- home ---------- */

function homeView() {
  const d = viewedDate();
  const plan = sessionFor(d);
  const isToday = key(d) === key(today());
  const logged = store.get('log', {})[key(d)];

  return `
    ${welcomeBar()}
    <div class="masthead">
      <div class="wordmark">Rack</div>
      <button class="datestamp" data-history="1">${esc(fmtLong(d))}${isToday ? '' : ' &middot; not today'}</button>
    </div>
    ${session.data && session.data.phase !== 'done' ? resumeBar() : ''}
    ${logged ? doneCard(logged) : (plan ? heroTraining(d, plan) : heroRest(d))}
    ${state.moving ? dayMover(d) : ''}
    ${splitSwitch()}
    ${weekStrip(d)}
    ${plan && !logged ? exerciseList(d) : ''}`;
}

function resumeBar() {
  return `<button class="resume" data-resume="1">
    <span>Session in progress &middot; ${esc(session.data.title)}</span>
    <span class="resume-go">Resume</span>
  </button>`;
}

function doneCard(rec) {
  return `<section class="hero is-done">
    <div class="hero-mark">${esc(rec.mark || '+')}</div>
    <h1 class="hero-title">${esc(rec.title)}</h1>
    <p class="hero-count">Done in ${clock(rec.durationSec)} &middot; ${rec.sets} sets</p>
    <p class="hero-groups">${esc((rec.exercises || []).join(', '))}</p>
  </section>`;
}

function heroTraining(d, plan) {
  const items = orderFor(d).map(byId);
  const est = estimateSeconds(items);
  const sets = items.reduce((n, e) => n + e.sets, 0);
  const groups = plan.groups.map(g => GROUPS[g].name).join(', ');
  const showGroups = groups.toLowerCase() !== plan.title.toLowerCase();
  return `
    <section class="hero">
      <div class="hero-mark">${esc(plan.mark)}</div>
      <h1 class="hero-title">${esc(plan.title)}</h1>
      ${showGroups ? `<p class="hero-groups">${esc(groups)}</p>` : ''}
      <p class="hero-count">${items.length} exercises &middot; ${sets} sets &middot; about ${humanMinutes(est)}</p>
      <div class="hero-actions">
        <button class="btn" data-start="${key(d)}">Start workout</button>
        ${plan.activated
          ? `<button class="btn btn-quiet" data-deactivate="${key(d)}">Clear</button>`
          : `<button class="btn btn-quiet" data-move="1">Move day</button>`}
      </div>
    </section>`;
}

function heroRest(d) {
  const next = nextTrainingDay(d);
  const open = suggestGroups(d).map(g => GROUPS[g].name).join(' and ');
  return `
    <section class="hero is-rest">
      <div class="hero-mark">Rest</div>
      <h1 class="hero-title">Nothing scheduled</h1>
      <p class="hero-groups">${next ? `Next up is ${esc(next.session.title)} on ${esc(fmtShort(next.date))}.` : ''}</p>
      <p class="hero-count">Not trained this week yet: ${esc(open)}</p>
      <div class="hero-actions">
        <button class="btn" data-activate="${key(d)}">Activate this day</button>
        <button class="btn btn-quiet" data-move="1">Move a day here</button>
      </div>
    </section>`;
}

function dayMover(d) {
  const wd = isoDay(d);
  const map = plans()[state.split];
  const cells = WEEKDAY_NAMES.map((name, i) => {
    const target = i + 1;
    const p = map[target];
    return `<button class="mover-day" ${target === wd ? 'disabled' : ''} data-swapday="${target}">
      <span class="mv-name">${esc(name.slice(0, 3))}</span>
      <span class="mv-what">${p ? esc(p.title) : 'Rest'}</span>
    </button>`;
  }).join('');
  return `
    <section class="mover">
      <p class="mover-head">Swap ${esc(WEEKDAY_NAMES[wd - 1])} with which day?</p>
      <div class="mover-grid">${cells}</div>
      <div class="mover-foot">
        <button class="linky" data-resetweek="1">Reset the week to defaults</button>
        <button class="linky" data-move="0">Cancel</button>
      </div>
    </section>`;
}

function splitSwitch() {
  const on = n => state.split === n;
  const map = plans()[state.split];
  const summary = Object.keys(map).sort()
    .map(wd => `${WEEKDAY_NAMES[wd - 1].slice(0, 3)} ${map[wd].title}`).join(', ');
  return `
    <div class="switch" role="group" aria-label="Training days per week">
      <button data-split="3" aria-pressed="${on(3)}">3 days a week</button>
      <button data-split="5" aria-pressed="${on(5)}">5 days a week</button>
    </div>
    <p class="switch-note">${esc(summary)}.</p>`;
}

function weekStrip(viewed) {
  const t = today(), log = store.get('log', {});
  const cells = weekOf(viewed).map(d => {
    const s = sessionFor(d);
    const cls = ['week-day'];
    if (!s) cls.push('is-rest');
    if (log[key(d)]) cls.push('is-logged');
    if (key(d) === key(t)) cls.push('is-today');
    return `<button class="${cls.join(' ')}" aria-pressed="${key(d) === key(viewed)}" data-goto="${key(d)}">
      <span class="wd">${esc(d.toLocaleDateString(undefined, { weekday: 'narrow' }))}</span>
      <span class="wm">${s ? esc(s.mark) : '&middot;'}</span>
    </button>`;
  }).join('');
  return `<nav class="week" aria-label="This week">${cells}</nav>`;
}

function exerciseList(d) {
  const ids = orderFor(d);
  const dk = key(d);
  const rows = ids.map((id, i) => {
    const e = byId(id);
    return `<div class="card">
      <button class="card-main" data-exercise="${e.id}" data-from="${dk}" data-idx="${i}">
        <span class="card-thumb">${figureSVG(e, { phase: (i + 1) * 0.13 })}</span>
        <span class="card-body">
          <span class="card-tag">${i + 1} &middot; ${esc(GROUPS[e.group].name)}</span>
          <h3>${esc(e.name)}</h3>
          <p>${e.sets} sets &middot; ${esc(e.reps)} reps &middot; ${GROUPS[e.group].rest}s rest</p>
        </span>
      </button>
      <div class="card-tools">
        <button data-up="${i}" data-d="${dk}" ${i === 0 ? 'disabled' : ''} aria-label="Move up">&uarr;</button>
        <button data-down="${i}" data-d="${dk}" ${i === ids.length - 1 ? 'disabled' : ''} aria-label="Move down">&darr;</button>
        <button class="tool-wide" data-replace="${i}" data-d="${dk}">Replace</button>
      </div>
    </div>`;
  }).join('');

  return `<div class="section-head"><h2>The session</h2><span>Tap to open, or reorder</span></div>${rows}`;
}

/* ---------- detail ---------- */

function detailView() {
  const e = byId(state.exercise);
  const from = state.detailFrom;
  const canStart = from && sessionFor(new Date(from + 'T12:00:00'));
  const idx = canStart ? orderFor(new Date(from + 'T12:00:00')).indexOf(e.id) : -1;
  return `
    ${welcomeBar()}
    <div class="detail">
      <button class="back" data-back="1">&larr; Back</button>
      <div class="detail-stage">${figureSVG(e, {})}</div>
      <h1>${esc(e.name)}</h1>
      <p class="detail-meta">${e.sets} sets &middot; ${esc(e.reps)} reps &middot; ${GROUPS[e.group].rest}s rest between sets</p>
      <p class="desc">${esc(e.desc)}</p>
      ${canStart ? `<div class="hero-actions">
        <button class="btn" data-starthere="${from}" data-i="${idx}">Start the session here</button>
        <button class="btn btn-quiet" data-replacehere="${idx}" data-d="${from}">Replace</button>
      </div>` : ''}
      ${muscleMap(e.muscles)}
      <ul class="cues">${e.cues.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
    </div>`;
}

/* ---------- history ---------- */

function historyView() {
  const local = store.get('log', {});
  const days = Object.keys(local).sort().reverse();
  const remote = state.history;

  const localRows = days.length ? days.map(k => {
    const r = local[k];
    return `<li class="hist">
      <span class="hist-date">${esc(k)}</span>
      <span class="hist-title">${esc(r.title)}</span>
      <span class="hist-meta">${clock(r.durationSec)} &middot; ${r.sets} sets</span>
    </li>`;
  }).join('') : '<li class="hist hist-empty">Nothing logged on this device yet.</li>';

  let remoteBlock;
  if (remote === null) remoteBlock = '<p class="stage-note">Loading from your sheet.</p>';
  else if (remote === 'error') remoteBlock = '<p class="stage-note">Could not reach the sheet. Check the Apps Script deployment is set to "Anyone".</p>';
  else if (!remote.length) remoteBlock = '<p class="stage-note">The sheet has no sessions yet.</p>';
  else remoteBlock = `<ul class="hists">${remote.slice().reverse().map(s => `<li class="hist">
      <span class="hist-date">${esc(String(s.date).slice(0, 10))}</span>
      <span class="hist-title">${esc(s.title || '')}</span>
      <span class="hist-meta">${esc(String(s.duration || ''))} &middot; ${esc(String(s.sets || 0))} sets</span>
    </li>`).join('')}</ul>`;

  return `
    ${welcomeBar()}
    <div class="detail">
      <button class="back" data-back="1">&larr; Back</button>
      <h1>History</h1>
      <p class="detail-meta">On this device</p>
      <ul class="hists">${localRows}</ul>
      <p class="detail-meta" style="margin-top:22px">From the sheet</p>
      ${remoteBlock}
    </div>`;
}

function loadHistory() {
  state.history = null;
  fetch(SYNC_URL + '?action=history')
    .then(r => r.json())
    .then(j => { state.history = (j && j.sessions) || []; if (state.screen === 'history') render(); })
    .catch(() => { state.history = 'error'; if (state.screen === 'history') render(); });
}

/* ---------- runner ---------- */

function runView() {
  const d = session.data;
  if (d.phase === 'done') return doneView();
  const ex = session.exercise;
  const setNo = Math.min(d.setsDone + 1, ex.sets);
  const pct = Math.round((session.doneSets / session.totalSets) * 100);

  return `
    ${welcomeBar()}
    <div class="run">
      <div class="run-top">
        <button class="back" data-exit="1">&larr; Leave</button>
        <span class="run-pos">Exercise ${d.idx + 1} of ${d.order.length}</span>
      </div>
      <div class="bar"><span style="width:${pct}%"></span></div>
      <p class="bar-note">${session.doneSets} of ${session.totalSets} sets done in this session</p>
      <div class="detail-stage">${figureSVG(ex, {})}</div>
      <h1 class="run-name">${esc(ex.name)}</h1>
      ${d.phase === 'proposed' ? proposedBlock(ex) : ''}
      ${d.phase === 'set' ? setBlock(ex, setNo) : ''}
      ${d.phase === 'rest' ? restBlock(ex, setNo) : ''}
    </div>`;
}

function weightPicker(ex) {
  const w = session.weight(ex.id);
  return `<div class="weight">
    <button data-weight="-1" aria-label="Lower the weight">&minus;</button>
    <span><strong>${w}</strong> lb each</span>
    <button data-weight="1" aria-label="Raise the weight">+</button>
  </div>`;
}

function proposedBlock(ex) {
  return `
    <p class="detail-meta">${ex.sets} sets &middot; ${esc(ex.reps)} reps &middot; ${GROUPS[ex.group].rest}s rest</p>
    <p class="desc">${esc(ex.desc)}</p>
    ${muscleMap(ex.muscles)}
    <ul class="cues">${ex.cues.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
    ${weightPicker(ex)}
    <div class="hero-actions">
      <button class="btn" data-accept="1">Accept</button>
      <button class="btn btn-quiet" data-swap="1">New exercise</button>
    </div>
    <div class="hero-actions">
      <button class="btn btn-quiet" data-markdone="1">Mark as done</button>
    </div>
    <button class="linky" data-skipex="1">Skip this exercise</button>`;
}

function setBlock(ex, setNo) {
  const pct = Math.round((session.data.setsDone / ex.sets) * 100);
  return `
    <p class="set-count">Set <strong>${setNo}</strong> of ${ex.sets}</p>
    <div class="bar is-set"><span style="width:${pct}%"></span></div>
    <p class="bar-note">${session.data.setsDone} of ${ex.sets} done &middot; ${esc(ex.reps)} reps</p>
    ${weightPicker(ex)}
    <div class="hero-actions">
      <button class="btn" data-done="1">Set complete</button>
      <button class="btn btn-quiet" data-markdone="1">Mark exercise done</button>
    </div>
    <p class="cue-strip">${esc(ex.cues[0])}</p>`;
}

function restBlock(ex, setNo) {
  return `
    <div class="rest">
      <p class="rest-label">Rest</p>
      <p class="rest-clock" id="restcount">${clock(session.restLeft())}</p>
      <p class="rest-next">Set ${setNo} of ${ex.sets} starts automatically</p>
    </div>
    <div class="hero-actions">
      <button class="btn" data-skiprest="1">Start now</button>
      <button class="btn btn-quiet" data-addrest="30">Add 30s</button>
    </div>
    <button class="linky" data-markdone="1">Mark exercise done and move on</button>`;
}

function doneView() {
  const d = session.data;
  const names = [...new Set(d.logged.map(l => l.exerciseName))];
  return `
    ${welcomeBar()}
    <div class="detail">
      <h1 class="run-name">${esc(d.title)} done</h1>
      <p class="detail-meta">${clock((Date.now() - d.startedAt) / 1000)} &middot; ${d.logged.length} sets &middot; ${names.length} exercises</p>
      <ul class="cues">${names.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
      <p class="stage-note">Saved to your sheet. ${esc(sync.label())}.</p>
      <div class="hero-actions"><button class="btn" data-close="1">Back to the week</button></div>
    </div>`;
}

/* ---------- events ---------- */

function on(sel, fn) { app.querySelectorAll(sel).forEach(el => el.addEventListener('click', () => fn(el))); }
const dateOf = k => new Date(k + 'T12:00:00');

function beginSession(dk, startIdx) {
  const d = dateOf(dk);
  const plan = sessionFor(d);
  if (!plan) return;
  if (session.data && session.data.phase !== 'done') session.abandon();
  session.start(dk, plan, orderFor(d), startIdx || 0);
  state.screen = 'run';
  holdScreen();
  render();
}

function bind() {
  on('[data-split]', el => { state.split = Number(el.dataset.split); store.set('split', state.split); state.moving = false; render(); });
  on('[data-goto]', el => { state.selected = el.dataset.goto === key(today()) ? null : el.dataset.goto; state.screen = 'home'; state.moving = false; render(); });
  on('[data-exercise]', el => { state.exercise = el.dataset.exercise; state.detailFrom = el.dataset.from || null; state.screen = 'detail'; render(); });
  on('[data-back]', () => { state.screen = 'home'; state.exercise = null; render(); });
  on('[data-activate]', el => { activateDay(el.dataset.activate); render(); });
  on('[data-deactivate]', el => { deactivateDay(el.dataset.deactivate); render(); });
  on('[data-history]', () => { state.screen = 'history'; loadHistory(); render(); });

  on('[data-move]', el => { state.moving = el.dataset.move === '1'; render(); });
  on('[data-swapday]', el => { swapDays(isoDay(viewedDate()), Number(el.dataset.swapday)); state.moving = false; render(); });
  on('[data-resetweek]', () => { resetWeek(); state.moving = false; render(); });

  on('[data-up]', el => { moveAt(dateOf(el.dataset.d), Number(el.dataset.up), -1); render(); });
  on('[data-down]', el => { moveAt(dateOf(el.dataset.d), Number(el.dataset.down), 1); render(); });
  on('[data-replace]', el => {
    if (!replaceAt(dateOf(el.dataset.d), Number(el.dataset.replace))) alert('Every exercise for that muscle group is already in this session.');
    render();
  });
  on('[data-replacehere]', el => {
    const d = dateOf(el.dataset.d), i = Number(el.dataset.replacehere);
    if (replaceAt(d, i)) { state.exercise = orderFor(d)[i]; } else alert('Every exercise for that muscle group is already in this session.');
    render();
  });

  on('[data-start]', el => beginSession(el.dataset.start, 0));
  on('[data-starthere]', el => beginSession(el.dataset.starthere, Math.max(0, Number(el.dataset.i))));
  on('[data-resume]', () => { state.screen = 'run'; holdScreen(); render(); });
  on('[data-accept]', () => { session.accept(); render(); });
  on('[data-swap]', () => { if (!session.swap()) alert('No other exercise left for this muscle group.'); render(); });
  on('[data-skipex]', () => { session.skipExercise(); render(); });
  on('[data-markdone]', () => { session.completeExercise(); render(); });
  on('[data-done]', () => { session.completeSet(); render(); });
  on('[data-skiprest]', () => { session.skipRest(); render(); });
  on('[data-addrest]', el => { session.addRest(Number(el.dataset.addrest)); render(); });
  on('[data-exit]', () => { state.screen = 'home'; releaseScreen(); render(); });
  on('[data-close]', () => { session.data = null; store.set('active', null); state.screen = 'home'; releaseScreen(); render(); });

  on('[data-weight]', el => {
    const ex = session.exercise;
    session.setWeight(ex.id, session.weight(ex.id) + Number(el.dataset.weight) * WEIGHT_STEP);
    render();
  });
}

/* ---------- clock ---------- */

function beep() {
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const ctx = new C();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 660; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
    o.start(); o.stop(ctx.currentTime + 0.36);
  } catch (e) { /* no audio, no problem */ }
}

let lastBeep = null;

setInterval(() => {
  const s = document.getElementById('syncstate');
  if (s) s.textContent = sync.label();
  if (!session.data || session.data.phase === 'done') return;

  const el = document.getElementById('elapsed');
  if (el) el.textContent = clock(session.elapsed);
  const mv = document.getElementById('motivate');
  if (mv) mv.textContent = session.motivation();

  if (session.data.phase === 'rest') {
    const left = session.restLeft();
    const rc = document.getElementById('restcount');
    if (rc) rc.textContent = clock(left);
    const w = Math.ceil(left);
    if (w <= 3 && w >= 1 && lastBeep !== w) { lastBeep = w; beep(); }
    if (left <= 0) { lastBeep = null; session.skipRest(); render(); }
  }
}, 500);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (state.screen === 'run' && session.data) holdScreen();
  render();
});

session.load();
if (session.data && session.data.phase !== 'done') { state.screen = 'run'; holdScreen(); }
sync.flush();
render();

</script>
</body>
</html>
